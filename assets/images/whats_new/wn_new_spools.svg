<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="300" height="130">
  <!-- New spools - generated, language-neutral (UI labels are English in the app). -->
  <rect x="0" y="0" width="300" height="130" fill="#ffffff"/>
  <rect x="1" y="1" width="298" height="128" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <rect x="12" y="10" width="276" height="110" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="22" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2b2b2b" text-anchor="start" font-weight="bold">New spool(s)</text>
  <text x="22" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">Yarn   PES 167f72      Batch   B-2410</text>
  <text x="22" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">Spools  4      Weight  5.0 kg</text>
  <rect x="22" y="74" width="11" height="11" rx="2" fill="#39a650" stroke="#888888" stroke-width="1"/>
  <text x="40" y="83" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="start">Add new spools to the label queue</text>
  <rect x="212" y="94" width="66" height="22" rx="3" fill="#39a650"/>
  <text x="245.0" y="109.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">OK</text>
  <text x="22" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#565656" text-anchor="start" font-style="italic">then jumps to the new spools</text>
</svg>
