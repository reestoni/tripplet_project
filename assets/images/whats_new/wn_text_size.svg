  <text x="115" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="middle">125 %</text>
  <rect x="152" y="38" width="62" height="40" rx="5" fill="#1F4E8C"/>
  <text x="183" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">Extra large</text>
  <text x="183" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">150 %</text>
  <rect x="220" y="38" width="62" height="40" rx="5" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1"/>
  <text x="251" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="middle">Huge</text>
  <text x="251" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="middle">200 %</text>
  <text x="16" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b2b2b" text-anchor="start">Aa</text>
  <text x="40" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2b2b2b" text-anchor="start">Aa</text>
  <text x="70" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold">Aa</text>
  <text x="104" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#2b2b2b" text-anchor="start">Aa</text>
