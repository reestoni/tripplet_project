  <text x="16" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2b2b2b" text-anchor="start" font-weight="bold">Text size (whole program)</text>
  <rect x="16" y="38" width="62" height="40" rx="5" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1"/>
  <text x="47" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="middle">Normal</text>
  <text x="47" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b2b2b" text-anchor="middle">100 %</text>
  <rect x="84" y="38" width="62" height="40" rx="5" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1"/>
