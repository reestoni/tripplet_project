<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="940" height="250">
  <!-- Life of a spool (Yarn Stock help). {{key}} placeholders are filled per language by
       ui/widgets/yarn_stock_help_dialog.py (texts in yarn_stock_help_texts.py). Plain SVG Tiny shapes only (no markers/CSS) so QSvgWidget renders it. -->
  <rect x="0" y="0" width="940" height="250" fill="#ffffff"/>

  <rect x="10" y="10" width="700" height="26" rx="13" fill="#e8f5e9"/>
  <text x="24" y="28" fill="#2b7a3d" font-family="Consolas, monospace" font-size="12" font-weight="bold">{{status}}: in stock</text>
  <rect x="770" y="10" width="160" height="26" rx="13" fill="#eeeeee"/>
  <text x="784" y="28" fill="#565656" font-family="Consolas, monospace" font-size="12" font-weight="bold">{{status}}: discarded</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="10" y="56" width="150" height="96" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="24" y="80" fill="#2b2b2b" font-weight="bold" font-size="14">{{t1}}</text>
    <text x="24" y="102" fill="#565656">New spool(s):</text>
    <text x="24" y="120" fill="#565656">{{t1b}}</text>
    <text x="24" y="138" fill="#565656">{{t1c}}</text>

    <rect x="196" y="56" width="150" height="96" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="210" y="80" fill="#2b2b2b" font-weight="bold" font-size="14">{{t2}}</text>
    <text x="210" y="102" fill="#565656">Add to label queue,</text>
    <text x="210" y="120" fill="#565656">Print Labels,</text>
    <text x="210" y="138" fill="#565656">{{t2c}}</text>

    <rect x="382" y="56" width="150" height="96" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="396" y="80" fill="#2b2b2b" font-weight="bold" font-size="14">{{t3}}</text>
    <text x="396" y="102" fill="#565656">{{t3a}}</text>
    <text x="396" y="120" fill="#565656">{{t3b}}</text>
    <text x="396" y="138" fill="#565656">{{t3c}}</text>

    <rect x="568" y="56" width="150" height="96" rx="8" fill="#e8f5e9" stroke="#39a650" stroke-width="1.5"/>
    <text x="582" y="80" fill="#2b2b2b" font-weight="bold" font-size="14">{{t4}}</text>
    <text x="582" y="102" fill="#565656">{{t4a}}</text>
    <text x="582" y="120" fill="#565656">{{t4b}}</text>
    <text x="582" y="138" fill="#565656">{{t4c}}</text>

    <rect x="770" y="56" width="160" height="96" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.2"/>
    <text x="784" y="80" fill="#2b2b2b" font-weight="bold" font-size="14">{{t5}}</text>
    <text x="784" y="102" fill="#565656">{{t5a}}</text>
    <text x="784" y="120" fill="#565656">{{t5b}}</text>
    <text x="784" y="138" fill="#565656">{{t5c}}</text>

    <!-- forward arrows -->
    <line x1="160" y1="104" x2="188" y2="104" stroke="#565656" stroke-width="1.5"/>
    <polygon points="196,104 187,99 187,109" fill="#565656"/>
    <line x1="346" y1="104" x2="374" y2="104" stroke="#565656" stroke-width="1.5"/>
    <polygon points="382,104 373,99 373,109" fill="#565656"/>
    <line x1="532" y1="104" x2="560" y2="104" stroke="#565656" stroke-width="1.5"/>
    <polygon points="568,104 559,99 559,109" fill="#565656"/>
    <line x1="718" y1="104" x2="762" y2="104" stroke="#565656" stroke-width="1.5"/>
    <polygon points="770,104 761,99 761,109" fill="#565656"/>

    <!-- loop back: weight is updated by hand -->
    <polyline points="643,152 643,204 457,204 457,162" fill="none" stroke="#39a650" stroke-width="1.5" stroke-dasharray="5,4"/>
    <polygon points="457,153 452,163 462,163" fill="#39a650"/>
    <rect x="452" y="190" width="196" height="28" rx="6" fill="#ffffff"/>
    <text x="550" y="209" text-anchor="middle" fill="#2b7a3d" font-weight="bold">{{loop}}</text>

    <text x="24" y="210" fill="#2b2b2b" font-weight="bold">{{trace}}</text>
    <text x="24" y="230" fill="#565656">{{trace2}}</text>
  </g>
</svg>
