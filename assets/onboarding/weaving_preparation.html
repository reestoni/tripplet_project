<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weaving Preparation</title>
<!-- Knowledge Base module (ui/screen_onboarding.py), category Weaving.
     Content from the user's research page "Webereivorbereitung: vom Garn zur webbereiten Kette".
     Texts in weaving_preparation_texts.js (de/en/es/zh). ?lang=xx, window.setLang('xx'), window.goScene(i),
     ?embedded=1 (no own header/scene buttons, reports the scene via document.title "scene:n"),
     ?scene=n&paused=1 for screenshots. No external resources (sources as plain text only).
     The links area at the bottom opens other modules: embedded via document.title "open:<key>", otherwise <key>.html.
     SVG/DOM: process routes (scene 0), seven animated process diagrams with step control (scene 1),
     comparison (scene 2), warper's beam calculator (scene 3). Scenes never change automatically. -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --hl:#39A650;--air:#2386C8;--heat:#E07B39;--twist:#6A4FC8;--soft:#EEF3EC;
  --acc:#E07B39;--acc2:#2386C8;--ok:#2F8F45;--bad:#C92A2A;--cool:#1C7ED6;--wind:#495057;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:80ch}
.langs,.scenes{display:flex;gap:6px;flex-wrap:wrap}
.langs[hidden]{display:none}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"],.seg button[aria-pressed="true"],.mtabs button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 6px}
.caption p{margin:0;color:var(--muted);max-width:90ch}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font-body)}
svg.bg{background:var(--bg);border-radius:6px}
.sc{display:none;flex-direction:column;gap:12px}
.sc.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.card h3{font-family:var(--font-display);font-size:19px;margin:0 0 6px}
.seg,.mtabs{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.mtabs button{font-size:13.5px;padding:6px 11px}
.lbl{display:block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;color:var(--hl)}
.kpi span{color:var(--muted);font-size:13px}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.pbtn{font-size:13px;padding:5px 11px}
.ins{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cmp .c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;border-top:4px solid var(--acc)}
.cmp .c h4{margin:0 0 4px;font-size:15px}
.cmp .c p{margin:4px 0;font-size:13.5px}
.mhead h3{margin:0;font-size:21px;font-family:var(--font-display)}
.mhead .de{color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:12px}
.steps{counter-reset:s;list-style:none;padding:0;margin:4px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 4px 30px;font-size:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0}
.figs div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.figs b{display:block;font-size:17px;color:#1F7A36}
.figs span{font-size:12px;color:var(--muted)}
.pc{display:grid;grid-template-columns:1fr 1fr .8fr;gap:12px;margin:12px 0 0}
.pcc{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)}
.pcc ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.pcc li{margin:3px 0}
.pcc p{margin:4px 0 0;font-size:13.5px}
.pcc.pro{border-left:5px solid var(--ok)}
.pcc.con{border-left:5px solid var(--bad)}
.pcc.when{border-left:5px solid var(--acc2)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
table.t tr:last-child td{border-bottom:0}
.ctl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:4px 0 8px}
.ctl label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.ctl input[type=range]{width:180px;accent-color:#39A650}
.ctl b{color:var(--fg);font-family:var(--font-mono);font-weight:600;min-width:7ch}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lk{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.lk:hover{border-color:var(--hl)}
.lk b{display:block;font-size:16px;margin-bottom:2px}
.lk span{font-size:13px;color:var(--muted)}
.lk em{display:block;font-style:normal;font-size:12px;color:var(--hl);margin-top:6px;font-family:var(--font-mono)}
.node{cursor:pointer}
.node:hover rect{stroke:var(--acc);stroke-width:2.5}
.node.sel rect{stroke:var(--acc);stroke-width:3}
.node.web{cursor:default}
details{font-size:12px;color:var(--muted)}
details ol{columns:2;column-gap:28px;margin:8px 0 0}
details li{break-inside:avoid;margin-bottom:4px}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:860px){.grid2,.pc{grid-template-columns:1fr}}
@media (max-width:760px){header{flex-direction:column}details ol{columns:1}}
</style>
<script src="weaving_preparation_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="scenes" id="scenes" role="group"></div>
  <section class="caption" aria-live="polite"><h2 id="ctitle"></h2><p id="ctext"></p></section>

  <!-- 0 typical routes -->
  <div class="sc" id="sc0">
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <div class="seg" id="rseg"></div>
      <svg id="rsvg" viewBox="0 0 1100 232" role="img" style="margin-top:10px"></svg>
      <p class="note" id="rtxt"></p>
    </div>
  </div>
  <!-- 1 processes in detail -->
  <div class="sc" id="sc1">
    <div class="mtabs" id="ptabs"></div>
    <div class="card">
      <div class="mhead"><h3 id="pname"></h3><div class="de" id="pde"></div></div>
      <svg class="bg" id="psvg" viewBox="0 0 900 320" role="img" style="margin-top:8px"></svg>
      <div class="stepbar" id="pbar"></div>
      <div class="grid2">
        <div><span class="lbl" id="lhow"></span><ol class="steps" id="psteps"></ol></div>
        <div><span class="lbl" id="lfigs"></span><div class="figs" id="pfigs"></div></div>
      </div>
      <div class="pc" id="ppc"></div>
    </div>
  </div>
  <!-- 2 comparison -->
  <div class="sc" id="sc2">
    <div class="card"><h3 id="v1T"></h3><div class="tblwrap"><table class="t" id="v1"></table></div></div>
    <div class="cmp" id="v2"></div>
  </div>
  <!-- 3 worked example -->
  <div class="sc" id="sc3">
    <div class="card">
      <div class="ctl">
        <label><span id="cbL"></span> <input type="range" id="cb" min="100" max="350" value="200"><b id="cbv"></b></label>
        <label><span id="cdL"></span> <input type="range" id="cd" min="15" max="80" value="40"><b id="cdv"></b></label>
        <label><span id="cgL"></span> <input type="range" id="cg" min="400" max="1200" step="20" value="800"><b id="cgv"></b></label>
      </div>
      <svg id="csvg" viewBox="0 0 1000 200" role="img"></svg>
      <p class="note" id="cnote"></p>
    </div>
  </div>

  <span class="lbl" id="lkL" style="margin-top:6px"></span>
  <div class="links" id="links"></div>
  <p class="note" id="note"></p>
  <details><summary id="srcsum"></summary><ol id="srclist"></ol></details>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let lang=params.get('lang')||'de';if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const PAUSED=params.get('paused')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches&&params.get('paused')!=='0';
const T=()=>TEXTS[lang];
const NSC=4;
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// rough text width (CJK = 1 em) - used to shrink SVG labels that would overflow their slot
const textW=(t,s,w)=>{let n=0;for(const ch of String(t))n+=/[⺀-鿿＀-￯　-〿]/.test(ch)?1:/[A-Z0-9%]/.test(ch)?.64:ch===' '?.3:.54;return n*s*(w>=600?1.05:1)};
const TX=(x,y,t,c='var(--fg)',a='middle',w=600,s=12,max=0)=>{
  let sz=s,adj='';
  if(max){const e=textW(t,s,w);if(e>max){sz=Math.max(s*.8,s*max/e);if(textW(t,sz,w)>max)adj=` textLength="${max}" lengthAdjust="spacingAndGlyphs"`}}
  return `<text x="${x}" y="${y}" font-size="${+sz.toFixed(1)}" text-anchor="${a}" fill="${c}" font-weight="${w}"${adj}>${esc(t)}</text>`;
};
const Tm=(x,y,t,a='middle',max=0)=>TX(x,y,t,'var(--muted)',a,400,11,max);
const num=v=>T().ui.loc==='none'?String(v):v.toLocaleString(T().ui.loc).replace(/[’'  ]/g,' ');
const ARR=`<defs><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>`;
const YARN='#1864ab';
const lerp=(a,b,u)=>a+(b-a)*Math.max(0,Math.min(1,u));
const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));

// ── language-neutral data (texts in weaving_preparation_texts.js, same order)
const PK=['spulen','direkt','konus','schlichten','denim','einziehen','knuepfen'];
const ST_T={spulen:[0,0.38,0.47,0.58,0.7,0.8],direkt:[0,0.2,0.4,0.6,0.85],konus:[0,0.08,0.3,0.76,0.95],schlichten:[0,0.2,0.4,0.6,0.8],
  denim:[0,0.25,0.3,0.35,0.75,0.86],einziehen:[0,0.25,0.5,0.75],knuepfen:[0,0.12,0.45,0.9]};
const PAUSE_T={spulen:0.7,direkt:0.6,konus:0.5,schlichten:0.5,denim:0.9,einziehen:0.6,knuepfen:0.5};
const NODES=[['spulen',100],['direkt',330],['konus',330],['denim',330],['schlichten',560],['einziehen',790],['knuepfen',790],['web',1005]];
const NY={spulen:110,direkt:50,konus:120,denim:190,schlichten:110,einziehen:70,knuepfen:150,web:110};
const RK=['roh','bunt','denim','wechsel'];
const ROUTES={roh:{n:['spulen','direkt','schlichten','einziehen','web'],e:[['spulen','direkt'],['direkt','schlichten'],['schlichten','einziehen'],['einziehen','web']]},
 bunt:{n:['spulen','konus','schlichten','einziehen','web'],e:[['spulen','konus'],['konus','schlichten'],['schlichten','einziehen'],['konus','einziehen'],['einziehen','web']]},
 denim:{n:['spulen','denim','schlichten','einziehen','knuepfen','web'],e:[['spulen','denim'],['denim','schlichten'],['schlichten','einziehen'],['schlichten','knuepfen'],['einziehen','web'],['knuepfen','web']]},
 wechsel:{n:['schlichten','knuepfen','web'],e:[['schlichten','knuepfen'],['knuepfen','web']]}};
const EDGES=[['spulen','direkt'],['spulen','konus'],['spulen','denim'],['direkt','schlichten'],['konus','schlichten'],['konus','einziehen'],['denim','schlichten'],['schlichten','einziehen'],['schlichten','knuepfen'],['einziehen','web'],['knuepfen','web']];
const LINK_KEYS=['weaving_machines','shaft_weaving','weave_structures','air_splicing','textile_dyeing'];
const SOURCES=['Teaching material Warping – worked example 8,000 ends, creel types','IJTFT 2017 – direct and sectional warping, creel 1,000–1,200',
 'IJTFT 2017 – direct warping > 600 m/min, single colour only','Textile Fashion Study – sectional vs. direct warping',
 'Teaching material – direct warping 500–1,000 ends per beam','Textile Learner – warping calculation','NITER – direct, sectional and ball warping',
 'Fibre2Fashion – zones of the sizing machine','Teaching material Sizing – drying cylinders, add-on','US patent 4793035 – definition of size add-on',
 'US patent 4859509 – sizing sequence, lease rods','US patent 4251403 – filament sizing 10–100 m/min','Teaching material – drying methods, PVA vs. starch',
 'Textile Details – size add-on and warp breaks','Teaching material – ball warping, 350–500 ends, 12–36 ropes','Trade news – rope vs. slasher dyeing in denim',
 'texdata – winding balls, rope dyeing, long chain beaming','Textile World – drawing-in with camera control','Textile World – separating up to 200 ends/cm',
 'Trade document – drawing-in from a single package, independent of the warp beam','Textile World – tying-in up to 600 knots/min','Trade document Tying-in – double knot',
 'Textilegence – end separation with needles or cones','Trade news – splicing at every cop change','Textile World – winding, yarn clearing, splice cycle'];

let scene=Math.max(0,Math.min(NSC-1,parseInt(params.get('scene')||'0',10)||0));

// ── step bar (back / play-pause / forward + label)
const bars=[];
function mkBar(id,o){
  const el=$(id);
  el.innerHTML=`<button type="button" class="pbtn" data-a="p"></button><button type="button" class="pbtn" data-a="t"></button><button type="button" class="pbtn" data-a="n"></button><span class="ins" data-a="l"></span>`;
  const q=a=>el.querySelector(`[data-a=${a}]`);
  let last={};
  const set=(a,v)=>{if(last[a]!==v){last[a]=v;q(a).textContent=v}};
  const upd=()=>{const u=T().ui;set('p',u.prev);set('n',u.next);set('t',o.isPlay()?u.pause:u.play);set('l',o.label())};
  q('p').onclick=()=>{o.prev();upd()};q('n').onclick=()=>{o.next();upd()};q('t').onclick=()=>{o.toggle();upd()};
  bars.push(upd);upd();return upd;
}
function segBtns(el,keys,labels,cur,cb){
  el.innerHTML=keys.map((k,i)=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${esc(labels[i])}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>cb(b.dataset.k));
}
function openModule(key){
  if(EMBED){document.title='open:'+key;return}
  location.href=key+'.html?lang='+encodeURIComponent(lang);
}
// deterministic "random" (screenshots stay reproducible)
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

// ── process diagrams (viewBox 900 x 320), t = 0..1
const D={};
D.spulen=(t,L)=>{
  let s=ARR;
  s+=`<path d="M70 280 L110 280 L100 170 L80 170 Z" fill="#ffe8cc" stroke="#495057"/>`+Tm(90,300,L.kops,'middle',160);
  const cut=t>=0.45&&t<0.74;
  const defX=lerp(120,360,seg(t,0.15,0.42));
  s+=`<path d="M90 170 Q90 110 140 110 L220 110" fill="none" stroke="${YARN}" stroke-width="2.5"/>`;
  s+=`<circle cx="235" cy="110" r="11" fill="#dee2e6" stroke="#495057"/><circle cx="235" cy="110" r="5" fill="#adb5bd"/>`+Tm(235,90,L.tens,'middle',130);
  s+=`<rect x="320" y="96" width="70" height="28" rx="5" fill="${t>=0.38&&t<0.5?'#F4D4D4':'var(--panel)'}" stroke="#495057"/>`+Tm(355,88,L.clear,'middle',140);
  s+=`<rect x="460" y="150" width="70" height="40" rx="6" fill="${t>=0.6&&t<0.8?'#CBE3D1':'var(--panel)'}" stroke="#495057"/>`+Tm(495,208,L.splicer,'middle',130);
  if(!cut)s+=`<path d="M246 110 L630 110" fill="none" stroke="${YARN}" stroke-width="2.5"/>`;
  else s+=`<path d="M246 110 L340 110" fill="none" stroke="${YARN}" stroke-width="2.5"/><path d="M400 110 L630 110" fill="none" stroke="${YARN}" stroke-width="2.5" opacity="${t<0.55?1:0.3}"/>`;
  if(t>=0.15&&t<0.47)s+=`<ellipse cx="${defX}" cy="110" rx="8" ry="5" fill="#c92a2a"/>`;
  if(t>=0.38&&t<0.5)s+=TX(355,145,L.cut,'#c92a2a','middle',600,12,300);
  if(t>=0.55&&t<0.74){const u=seg(t,0.55,0.66);
    s+=`<path d="M${lerp(330,470,u)} ${lerp(110,165,u)} L470 165" stroke="var(--acc)" stroke-width="2.5" fill="none"/><path d="M${lerp(400,520,u)} ${lerp(110,175,u)} L520 175" stroke="var(--acc)" stroke-width="2.5" fill="none"/>`;
    s+=TX(470,240,L.arms,'var(--acc)','middle',600,12,320);
    if(t>=0.66){for(let k=0;k<6;k++)s+=`<circle cx="${480+rnd(k+Math.floor(t*40))*30}" cy="${160+rnd(k+7+Math.floor(t*40))*20}" r="2" fill="var(--ok)"/>`;s+=TX(470,260,L.air,'var(--ok)','middle',600,12,320)}}
  const gx=650+Math.sin(t*Math.PI*16)*24;
  s+=`<circle cx="700" cy="230" r="34" fill="#dee2e6" stroke="#495057"/>`+Tm(720,290,L.drum,'middle',200);
  const R=36+t*14;
  s+=`<rect x="${700-R}" y="${196-R*1.2}" width="${2*R}" height="${R*1.2}" rx="8" fill="#d0ebff" stroke="${YARN}"/>`;
  for(let i=0;i<5;i++)s+=`<line x1="${700-R+6}" y1="${196-R*1.2+6+i*R*0.22}" x2="${700+R-6}" y2="${196-R*1.2+14+i*R*0.22}" stroke="${YARN}" opacity=".5"/>`;
  s+=Tm(700,196-R*1.2-10,L.grow,'middle',190);
  s+=`<path d="M630 110 L${gx} 150" stroke="${YARN}" stroke-width="2" ${cut?'opacity=".3"':''}/>`;
  return s;};
D.direkt=(t,L)=>{
  let s=ARR;
  const rows=10,cols=6;
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r++)s+=`<circle cx="${50+c*30}" cy="${40+r*26}" r="9" fill="#ffe8cc" stroke="#495057" stroke-width="1"/>`;
  s+=TX(125,305,L.creel,'var(--fg)','middle',600,12,240);
  const show=t>=0.2;
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r+=2){const y0=40+r*26,yk=70+((c*rows+r)/(rows*cols))*180;
    s+=`<path d="M${59+c*30} ${y0} C 300 ${y0}, 330 ${yk}, 420 ${yk}" fill="none" stroke="${YARN}" stroke-width="1" opacity=".6"/>`;

[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
applyLang();
requestAnimationFrame(now=>{last=now;loop(now)});
})();
</script>
