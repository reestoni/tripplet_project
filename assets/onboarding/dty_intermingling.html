<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DTY Intermingling</title>
<!-- Onboarding-Modul (ui/screen_onboarding.py). Texte in dty_intermingling_texts.js (de/en/es/zh).
     Sprache: ?lang=xx oder window.setLang('xx') (TrippleT ruft das beim Flaggen-Klick auf).
     ?embedded=1 blendet die eigene Sprachleiste aus. Keine externen Ressourcen (laeuft offline). -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --yarn:#6E6556;--yarn-rgb:110,101,86;--air:#2386C8;--air-rgb:35,134,200;--heat:#E07B39;--hl:#39A650;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:70ch}
.langs{display:flex;gap:4px;flex-shrink:0}
.langs[hidden]{display:none}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:16/9}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--hl)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.scenes{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
button{background:#fff}
.scenes button span{font-family:var(--font-mono);font-size:12px;opacity:.7}
.right{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.slider{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.slider[hidden]{display:none}
.slider input{accent-color:var(--hl);width:140px}
.slider output{min-width:5.5em;color:var(--fg)}
.slider input[type=number]{width:84px;font:inherit;color:var(--fg);background:#fff;padding:4px 6px;border:1px solid var(--line);border-radius:4px}
.play{min-width:120px;justify-content:center}
.caption{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;border-top:1px solid var(--line);padding-top:16px}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 8px}
.caption p{margin:0 0 10px;max-width:70ch}
.now{font-family:var(--font-mono);font-size:13px;color:var(--hl);min-height:1.5em}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.facts li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.facts b{font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.note{font-size:12px;color:var(--muted);margin:0}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:760px){.caption{grid-template-columns:1fr;gap:14px}.facts li{grid-template-columns:96px minmax(0,1fr)}header{flex-direction:column}}
</style>
<script src="dty_intermingling_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="stage">
    <canvas id="cv" width="1600" height="900"></canvas>
  </div>
  <div class="controls">
    <div class="scenes" id="scenes" role="group"></div>
    <div class="right">
      <label class="slider" id="v2wrap"><span id="v2lab"></span>
        <input id="v2" type="number" min="50" max="2000" step="10" value="800"></label>
      <label class="slider" id="drwrap"><span id="drlab"></span>
        <input id="dr" type="number" min="1.05" max="3" step="0.01" value="1.70"></label>
      <label class="slider" id="ofwrap"><span id="oflab"></span>
        <input id="of" type="range" min="1" max="10" step="0.5" value="5"><output id="ofout"></output></label>
      <label class="slider" id="uwrap" hidden><span id="ulab"></span>
        <input id="spread" type="range" min="0" max="100" step="5" value="60"><output id="uout"></output></label>
      <label class="slider" id="pwrap"><span id="plab"></span>
        <input id="pressure" type="range" min="1" max="5" step="0.1" value="3"><output id="pout"></output></label>
      <button class="play" id="play" type="button"></button>
    </div>
  </div>
  <section class="caption" aria-live="polite">
    <div><h2 id="ctitle"></h2><p class="now" id="cnow"></p><p id="ctext"></p></div>
    <ul class="facts" id="cfacts"></ul>
  </section>
  <p class="note" id="note"></p>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=1600,H=900;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={bg:css('--panel'),line:css('--line'),fg:css('--fg'),muted:css('--muted'),yarn:css('--yarn'),air:css('--air'),heat:css('--heat'),hl:css('--hl')};
const YRGB=css('--yarn-rgb'),ARGB=css('--air-rgb');
const MONO=css('--font-mono'),DISP=css('--font-display'),BODY=css('--font-body');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const params=new URLSearchParams(location.search);
let lang=(params.get('lang')||'de');if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const T=()=>TEXTS[lang];
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);

if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
let fitW=0;
function fit(){const w=cv.getBoundingClientRect().width||W;if(w===fitW&&cv.width>0)return;fitW=w;const d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(w*d));cv.height=Math.max(1,Math.round(w*9/16*d))}
addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);fit();
const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;

/* Stationen: nur Geometrie, Texte aus TEXTS[lang].stations (gleiche Reihenfolge) */
const ST=[{x:140,y:780,lx:230,ly:830},{x:300,y:520,lx:220,ly:470},{x:495,y:370,lx:420,ly:300},{x:760,y:250,lx:760,ly:200},
 {x:930,y:400,lx:800,ly:470},{x:1000,y:500,lx:880,ly:610},{x:1110,y:474,lx:1080,ly:360,jet:true},{x:1220,y:500,lx:1268,ly:425},
 {x:1330,y:500,lx:1320,ly:560},{x:1460,y:500,lx:1470,ly:440},{x:1460,y:760,lx:1440,ly:845}];
const DUR=[26,12,26,14,14,12];

/* ---------- UI ---------- */
const sceneEl=$('scenes'),play=$('play'),pin=$('pressure'),ofin=$('of'),v2in=$('v2'),drin=$('dr');
/* auto = Bewegung laeuft (Pause friert sie ein). Szenen wechseln NIE von selbst, nur per Reiter/Knopf/Pfeiltaste. */
let scene=0,sceneT=0,auto=!reduce,t=0,pressure=3,of=5,selSt=-1,hoverSt=-1,v2=800,dr=1.7,spread=.6;
/* Szene 1: Geschwindigkeit LW 2 (m/min) und Verstreckverhaeltnis eingeben -> LW 1 = LW 2 / Verstreckung, LW 2.x = LW 2 - OF */
const num=(v,d)=>{const s=v.toFixed(d);return lang==='de'||lang==='es'?s.replace('.',','):s};
v2in.oninput=()=>{const v=parseFloat(v2in.value);if(isFinite(v)&&v>0)v2=Math.min(5000,v)};
drin.oninput=()=>{const v=parseFloat(drin.value);if(isFinite(v)&&v>=1)dr=Math.min(5,v)};
v2in.onchange=()=>{v2in.value=String(v2)};drin.onchange=()=>{drin.value=dr.toFixed(2)};
const level=p=>p<2?T().ui.low:p<3.8?T().ui.mid:T().ui.high;
function setPlay(){play.setAttribute('aria-pressed',auto);play.textContent=auto?T().ui.pause:T().ui.play}
play.onclick=()=>{auto=!auto;setPlay()};
pin.oninput=()=>{pressure=+pin.value;$('pout').textContent=level(pressure)};
$('spread').oninput=()=>{spread=+$('spread').value/100;$('uout').textContent=$('spread').value+' %'};$('spread').oninput();
ofin.oninput=()=>{of=+ofin.value;$('ofout').textContent=of.toFixed(1).replace(/\.0$/,'')+' %'};
function go(i){const n=(i+DUR.length)%DUR.length;if(n!==scene){selSt=-1;hoverSt=-1}scene=n;sceneT=0;if(EMBED)document.title='scene:'+scene;
  [...sceneEl.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===scene));
  const s=T().scenes[scene];$('ctitle').textContent=`${scene+1}  ·  ${s.title}`;$('ctext').textContent=s.text;
  $('cfacts').innerHTML='';s.facts.forEach(f=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=f[0];const sp=document.createElement('span');sp.textContent=f[1];li.append(b,sp);$('cfacts').appendChild(li)});
  showStation();$('pwrap').hidden=scene<2||scene===4;$('uwrap').hidden=scene!==4;$('ofwrap').hidden=!(scene===0||scene===2);$('v2wrap').hidden=scene!==0;$('drwrap').hidden=scene!==0}
function applyLang(){const u=T().ui;document.documentElement.lang=lang;
  ['eyebrow','h1','lead','note'].forEach(k=>$(k).textContent=u[k]);$('plab').textContent=u.pressure;$('oflab').textContent=u.of;$('ulab').textContent=u.spread;$('v2lab').textContent=u.v2;$('drlab').textContent=u.dr;
  sceneEl.setAttribute('aria-label',u.scenes);sceneEl.innerHTML='';
  T().scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span>${i+1}</span>`;b.append(s.k);b.onclick=()=>go(i);sceneEl.appendChild(b)});
  [...$('langs').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  pin.oninput();ofin.oninput();setPlay();const keep=sceneT;go(scene);sceneT=keep}
function showStation(){const S=T().stations;
  $('cnow').textContent=scene!==0?'':selSt>=0?`▸ ${S[selSt].n}: ${S[selSt].d}`:`▸ ${T().ui.clickHint}`}
/* Szene 1: Positionen anklicken (Symbol oder Beschriftung) */
function hitStation(ev){const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height;
  for(let i=0;i<ST.length;i++){const p=ST[i];if(Math.hypot(x-p.x,y-p.y)<46)return i;
    const nm=`${i+1}  ${T().stations[i].s||T().stations[i].n}`;ctx.font=`500 21px ${MONO}`;const w=ctx.measureText(nm).width/2+12;
    if(Math.abs(x-p.lx)<w&&Math.abs(y-p.ly)<18)return i}return -1}
cv.addEventListener('mousemove',ev=>{if(scene!==0){cv.style.cursor='';return}hoverSt=hitStation(ev);cv.style.cursor=hoverSt>=0?'pointer':''});
cv.addEventListener('mouseleave',()=>{hoverSt=-1;cv.style.cursor=''});
cv.addEventListener('click',ev=>{if(scene!==0)return;const i=hitStation(ev);selSt=(i===selSt)?-1:i;showStation()});
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(scene+1);if(e.key==='ArrowLeft')go(scene-1);if(e.key===' '){e.preventDefault();auto=!auto;setPlay()}});
applyLang();
if(params.get('scene'))go((+params.get('scene')||1)-1);
if(params.get('paused')==='1'){auto=false;setPlay()}
if(params.get('station')){selSt=(+params.get('station')||1)-1;showStation()}

/* ---------- Zeichenhilfen ---------- */
function label(txt,x,y,o={}){ctx.font=`${o.w||500} ${o.s||24}px ${o.f||MONO}`;ctx.fillStyle=o.c||C.muted;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.fillText(txt,x,y)}
function leader(x1,y1,x2,y2,c){ctx.strokeStyle=c||C.line;ctx.lineWidth=1.5;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function godet(x,y,r,hl,spd=1){ctx.lineWidth=3;ctx.strokeStyle=hl?C.hl:C.muted;ctx.fillStyle=C.bg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  for(let k=0;k<3;k++){const a=t*3*spd+k*2.094;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.8);ctx.stroke()}}
function knotShape(p){return{L:300-40*(p-1)}}
function bundle(x0,x1,N,fn,alpha=0.9,lw=2){
  for(let i=0;i<N;i++){const shade=0.55+0.45*((i*7)%N)/N;ctx.strokeStyle=`rgba(${YRGB},${alpha*shade})`;ctx.lineWidth=lw;ctx.beginPath();
    for(let x=x0;x<=x1;x+=5){const y=fn(x,i);x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}}
function poly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
/* Erklaerung oben in der Szene (Zeilenumbruch auch fuer Chinesisch ohne Leerzeichen) */
function wrap(txt,maxW){const parts=/\s/.test(txt)?txt.split(/(\s+)/):[...txt];const lines=[];let cur='';
  parts.forEach(w=>{const tryS=cur+w;if(ctx.measureText(tryS).width>maxW&&cur.trim()&&!/^[，。、；：）！？,.;:)]/.test(w)){lines.push(cur.trim());cur=w.trimStart()}else cur=tryS});
  if(cur.trim())lines.push(cur.trim());return lines}
function infoBox(head,body){const x=60,y=86,w=1480,h=64;
  ctx.fillStyle=head?'#E9F6E9':'#F4F6F3';ctx.strokeStyle=head?C.hl:C.line;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();ctx.stroke();
  let tx=x+20;if(head){label(head,tx,y+h/2,{a:'left',s:24,c:C.hl,f:BODY,w:700});ctx.font=`700 24px ${BODY}`;tx+=ctx.measureText(head).width+24}
  ctx.font=`400 21px ${BODY}`;const lines=wrap(body,x+w-20-tx).slice(0,2);
  lines.forEach((ln,k)=>label(ln,tx,y+h/2+(k-(lines.length-1)/2)*26,{a:'left',s:21,c:head?C.fg:C.muted,f:BODY,w:400}))}
function ofLabel(){return of.toFixed(1).replace(/\.0$/,'')}

/* ---------- Szene 1: Maschine ---------- */
/* Fadenlauf in Abschnitten mit eigener Geschwindigkeit: bis LW1 v1, Verstreckzone bis LW2 ~1,7*v1,
   Overfeed-Zone LW2 -> Duese -> LW2.x (Faden locker, Durchhang je nach OF), danach LW2.x = LW2 - OF */
const V1=55;
function seg(pts,speed,dash,col){ctx.strokeStyle=`rgba(${YRGB},.22)`;ctx.lineWidth=3;ctx.setLineDash([]);poly(pts);
  ctx.strokeStyle=col||C.yarn;ctx.setLineDash(dash);ctx.lineDashOffset=-t*speed;poly(pts);ctx.setLineDash([])}
function ofZonePts(){const pts=[],sag=1.2+of*1.6,w=1+.12*Math.sin(t*7);
  for(let x=1000;x<=1220;x+=4){let y=500;if(x<1080)y+=sag*w*Math.sin(Math.PI*(x-1000)/80);else if(x>1140)y+=sag*w*Math.sin(Math.PI*(x-1140)/80);pts.push([x,y])}return pts}
function scene1(){
  const S=T().stations,cvT=T().cv;
  const st=selSt;
  infoBox(st>=0?`${st+1}  ${S[st].n}`:'',st>=0?S[st].d:T().ui.clickHint);
  ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.strokeRect(60,160,1480,700);
  label(cvT.machine,90,195,{a:'left',s:22});
  ctx.lineCap='round';
  ctx.strokeStyle=`rgba(224,123,57,${0.75+0.15*Math.sin(t*3)})`;ctx.lineWidth=30;ctx.beginPath();ctx.moveTo(350,490);ctx.lineTo(640,250);ctx.stroke();
  ctx.strokeStyle='#A9B3B6';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(650,250);ctx.lineTo(875,250);ctx.stroke();
  ctx.lineCap='butt';
  ctx.fillStyle='#EEF1ED';ctx.strokeStyle=C.muted;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(85,700,110,80,8);ctx.fill();ctx.stroke();
  for(let k=0;k<5;k++){ctx.beginPath();ctx.moveTo(90,712+k*14);ctx.lineTo(190,712+k*14);ctx.strokeStyle=C.line;ctx.stroke()}
  const g=10+((t*2)%30);ctx.fillStyle='#EEF1ED';ctx.strokeStyle=C.muted;ctx.beginPath();ctx.roundRect(1400,760-g/2-20,120,40+g,8);ctx.fill();ctx.stroke();
  const tr=1460+48*Math.sin(t*4);ctx.fillStyle=C.yarn;ctx.fillRect(tr-3,705,6,14);
  const DRAW=dr,vv2=V1*DRAW,v2x=vv2*(1-of/100);
  seg([[140,700],[230,565],[300,520]],V1,[10,12]);
  seg([[300,520],[350,490],[640,250],[880,250],[930,400],[1000,500]],vv2,[17,20]);
  seg(ofZonePts(),vv2,[17,20],st===7||st===5||st===6?C.air:C.yarn);
  // Set-Heizer zwischen LW 2.x und LW 3
  ctx.lineCap='round';ctx.strokeStyle=`rgba(224,123,57,${st===8?.75:.45})`;ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(1265,500);ctx.lineTo(1400,500);ctx.stroke();ctx.lineCap='butt';
  seg([[1220,500],[1460,500]],v2x,[17*(1-of/100),20]);seg([[1460,500],[1460,700]],v2x,[17*(1-of/100),20]);
  for(let k=0;k<4;k++){const fx=905+k*16,fy=362+k*25;ctx.strokeStyle=st===4?C.hl:C.muted;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(fx,fy,40,10,-0.3,0,7);ctx.stroke();
    const a=t*8+k;ctx.fillStyle=C.muted;ctx.beginPath();ctx.arc(fx+Math.cos(a)*36,fy+Math.sin(a)*8,3,0,7);ctx.fill()}
  godet(300,520,28,st===1,1);godet(1000,500,28,st===5,DRAW);godet(1220,500,28,st===7,DRAW*(1-of/100));godet(1460,500,24,st===9,DRAW*(1-of/100));
  const jh=st===6;ctx.fillStyle=jh?C.air:'#DCE8F0';ctx.strokeStyle=C.air;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(1080,474,60,52,6);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(1110,474);ctx.lineTo(1110,430);ctx.stroke();
  for(let k=0;k<3;k++){const yy=430+((t*60+k*15)%44);ctx.fillStyle=C.air;ctx.beginPath();ctx.arc(1110,yy,3,0,7);ctx.fill()}
  ST.forEach((p,i)=>{const hl=i===st;leader(p.x,p.y,p.lx,p.ly+(p.ly<p.y?14:-14),hl?C.hl:C.line);
    const hv=i===hoverSt&&!hl;if(hv){ctx.strokeStyle=C.hl;ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(p.x,p.y,44,0,7);ctx.stroke();ctx.setLineDash([])}
    label(`${i+1}  ${S[i].s||S[i].n}`,p.lx,p.ly,{c:hl||hv?C.hl:(p.jet||i===7?C.fg:C.muted),s:hl?25:21,w:hl?600:500})});
  // Geschwindigkeiten (oben rechts)
  const VAL=[v2/dr,v2,v2*(1-of/100)];
  cvT.spd.forEach(([n,f],j)=>{const y=202+j*50,hl=(j===0&&st===1)||(j===1&&st===5)||(j===2&&st===7);
    label(n,1210,y,{a:'left',s:20,c:hl?C.hl:C.muted});label(`${num(VAL[j],VAL[j]<100?1:0)} m/min`,1520,y,{a:'right',s:20,c:j===2?C.air:(hl?C.hl:C.fg),w:600});
    label(fmt(f,{of:ofLabel(),dr:num(dr,2)}),1210,y+22,{a:'left',s:16,c:C.muted})});

const UNI_Z1=[.06,-.08,.03,.09,-.05,-.02,.07,-.09,.01,.05,-.06,-.01];
const UNI_Z2=[-.55,-.45,.15,1.9,-.5,-.6,.35,-.35,.95,-.55,-.25,-.1];
function uniDists(z,s){const m=UNI_P/UNI_N;let d=z.map(v=>Math.max(.22*m,m*(1+s*v)));const k=UNI_P/d.reduce((a,b)=>a+b,0);return d.map(v=>v*k)}
function uniStats(d){const m=d.reduce((a,b)=>a+b,0)/d.length,sd=Math.sqrt(d.reduce((a,b)=>a+(b-m)*(b-m),0)/(d.length-1));
  return{cv:100*sd/m,max:Math.max(...d),imax:d.indexOf(Math.max(...d)),mean:m}}
/* Faden als Buendel: an den Knoten eng, dazwischen offen; lange offene Stellen spreizen staerker */
function uniStrip(d,cy,col,markGap){const mean=UNI_P/UNI_N,shift=(110*t)%UNI_P,pos=[];let c=0;d.forEach(v=>{pos.push(c);c+=v});
  const knotAt=s=>{s=((s%UNI_P)+UNI_P)%UNI_P;let j=0;while(j<UNI_N-1&&pos[j+1]<=s)j++;const a=pos[j],len=d[j],u=(s-a)/len;return{j,u,len,dk:Math.min(s-a,a+len-s)}};
  for(let i=0;i<9;i++){ctx.strokeStyle=`rgba(${YRGB},${.45+.5*((i*5)%9)/9})`;ctx.lineWidth=1.8;ctx.beginPath();
    for(let x=UNI_X0;x<=UNI_X1;x+=4){const s=x-UNI_X0+shift,k=knotAt(s),open=Math.pow(Math.sin(Math.PI*k.u),.7),loose=Math.min(2,.5+.5*k.len/mean);
      const y=cy+(i-4)*4.4*open*loose+open*loose*2.2*Math.sin(s*.16+i*1.7);x===UNI_X0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
  for(let j=0;j<UNI_N;j++){let x=UNI_X0+((pos[j]-shift)%UNI_P+UNI_P)%UNI_P;if(x<UNI_X0||x>UNI_X1)continue;
    ctx.fillStyle=C.air;ctx.beginPath();ctx.moveTo(x,cy+46);ctx.lineTo(x-8,cy+60);ctx.lineTo(x+8,cy+60);ctx.fill();ctx.strokeStyle=`rgba(${ARGB},.35)`;ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.beginPath();ctx.moveTo(x,cy+8);ctx.lineTo(x,cy+44);ctx.stroke();ctx.setLineDash([])}
  if(markGap){const st=uniStats(d);if(st.max>1.6*mean){const a=UNI_X0+((pos[st.imax]-shift)%UNI_P+UNI_P)%UNI_P,b=a+st.max;
    const xa=Math.max(UNI_X0,a),xb=Math.min(UNI_X1,b);if(xb-xa>40){ctx.strokeStyle=C.red;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(xa,cy-50);ctx.lineTo(xa,cy-58);ctx.lineTo(xb,cy-58);ctx.lineTo(xb,cy-50);ctx.stroke();
      label(T().cv.gap,(xa+xb)/2,cy-76,{s:18,c:C.red,w:600})}}}}
function uniBars(d,x0,y0,w,h,col,title){const cvT=T().cv,mean=UNI_P/UNI_N,st=uniStats(d),top=3*mean,bw=w/UNI_N;
  label(title,x0,y0-16,{a:'left',s:19,c:C.fg,f:BODY,w:600});
  ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0,y0+h);ctx.lineTo(x0+w,y0+h);ctx.stroke();
  d.forEach((v,j)=>{const bh=h*Math.min(1,v/top),far=v>2*mean;ctx.fillStyle=far?C.red:col;ctx.globalAlpha=.85;ctx.fillRect(x0+j*bw+4,y0+h-bh,bw-8,bh);ctx.globalAlpha=1});
  [[mean,cvT.meanL,C.muted,[6,5]],[2*mean,cvT.twice,C.red,[3,4]]].forEach(([v,l,c,dash])=>{const y=y0+h-h*v/top;ctx.strokeStyle=c;ctx.setLineDash(dash);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+w,y);ctx.stroke();ctx.setLineDash([]);
    label(l,x0+w+8,y,{a:'left',s:14,c})});
  const mm=v=>(v*UNI_MM/UNI_P).toFixed(1).replace('.',lang==='de'||lang==='es'?',':'.');
  label(fmt(cvT.statKnots,{n:Math.round(UNI_N*1000/UNI_MM)}),x0,y0+h+30,{a:'left',s:17,c:C.fg});
  label(fmt(cvT.statCv,{cv:Math.round(st.cv)}),x0,y0+h+56,{a:'left',s:17,c:st.cv>30?C.red:C.hl,w:600});
  label(fmt(cvT.statGap,{g:mm(st.max)}),x0,y0+h+82,{a:'left',s:17,c:st.max>2*mean?C.red:C.fg});
  return st}
function sceneU(){const cvT=T().cv;C.red=C.red||'#D6453D';
  const d1=uniDists(UNI_Z1,1),d2=uniDists(UNI_Z2,spread);
  label(cvT.even,UNI_X0,130,{a:'left',s:26,c:C.hl,f:DISP,w:600});label(cvT.evenT,UNI_X0+260,130,{a:'left',s:18,f:BODY});
  uniStrip(d1,200,C.hl,false);
  label(cvT.uneven,UNI_X0,320,{a:'left',s:26,c:C.heat,f:DISP,w:600});label(cvT.unevenT,UNI_X0+260,320,{a:'left',s:18,f:BODY});
  uniStrip(d2,400,C.heat,true);
  label(cvT.sameN,800,500,{s:19,c:C.fg,f:BODY,w:600});
  const a=uniBars(d1,UNI_X0,580,560,150,C.hl,cvT.distTitle+' · '+cvT.even),b=uniBars(d2,820,580,560,150,C.heat,cvT.distTitle+' · '+cvT.uneven);
  $('cnow').textContent='▸ '+fmt(cvT.now,{a:Math.round(a.cv),b:Math.round(b.cv)});
}

/* ---------- Szene 6: Vergleich ---------- */
function scene5(){const cvT=T().cv;
  const N=14,v=110;
  label(cvT.without,80,180,{a:'left',s:30,c:C.muted,f:DISP,w:600});
  bundle(80,1520,N,(x,i)=>{const ph=i/N*Math.PI*2;const s=x-v*t;return 300+22*Math.sin(ph)+9*Math.sin(s*0.012+i*1.7)+5*Math.sin(s*0.031+i)},0.85,2);
  ctx.strokeStyle=`rgba(${YRGB},.75)`;ctx.lineWidth=2;
  for(let k=0;k<4;k++){const bx=((k*380-v*t)%1520+1520)%1520+60;ctx.beginPath();ctx.moveTo(bx,318);ctx.bezierCurveTo(bx+20,390,bx+70,380,bx+90,325);ctx.stroke()}
  label(cvT.withoutT,80,420,{a:'left',s:20});
  ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(80,480);ctx.lineTo(1520,480);ctx.stroke();
  label(cvT.with,80,540,{a:'left',s:30,c:C.air,f:DISP,w:600});
  drawYarn(80,1520,650,44);
  label(cvT.withT,80,760,{a:'left',s:20,c:C.fg});
}

/* ---------- Loop ---------- */
const DRAWFN=[scene1,scene2,scene3,scene4,sceneU,scene5];
function frame(now){
  const real=Math.min(0.05,(now-lastFrame)/1000)*(reduce?0.5:1),dt=auto?real:0;lastFrame=now;t+=dt;sceneT+=real;
  fit();
  try{
    const sc=cv.width/W;ctx.setTransform(sc,0,0,sc,0,0);
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(90,100,96,.06)';ctx.lineWidth=1;for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.lineCap='butt';ctx.setLineDash([]);
    DRAWFN[scene](dt);
    label(`${scene+1}/${DUR.length}`,1540,60,{a:'right',s:22});
    label(T().scenes[scene].k.toUpperCase(),60,60,{a:'left',s:30,c:C.fg,f:DISP,w:600});
  }catch(e){console.error(e)}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
