<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chemical Finishing</title>
<!-- Knowledge Base module (ui/screen_onboarding.py), category dyeing/finishing.
     Content from the user's research page "Chemische Textilausrüstung - Effekte, Verfahren, Regulierung" (as of Nov 2026).
     Texts in chemical_finishing_texts.js (de/en/es/zh). ?lang=xx, window.setLang('xx'), window.goScene(i),
     ?embedded=1 (no own header/scene buttons, reports the scene via document.title "scene:n"),
     ?scene=n for screenshots. No external resources (sources as plain text only).
     Links to other modules (LINK_KEYS): embedded via document.title "open:<key>", otherwise <key>.html directly.
     No canvas - SVG/DOM, because the content is data (filters, cards, tables, timeline). -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --hl:#39A650;--air:#2386C8;--heat:#E07B39;--yarn:#B5651D;--twist:#6A4FC8;--soft:#EEF3EC;
  --water:#0C8599;--wind:#495057;--pin:#C62828;--cn:#C2255C;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:80ch}
.langs,.scenes{display:flex;gap:6px;flex-wrap:wrap}
.langs[hidden]{display:none}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 6px}
.caption p{margin:0;color:var(--muted);max-width:90ch}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font-body)}
.sc{display:none;flex-direction:column;gap:12px}
.sc.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.card h3{font-family:var(--font-display);font-size:22px;margin:2px 0 6px}
.card p{margin:6px 0}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:start}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg.sm button{font-size:13px;padding:5px 10px}
.seg button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lbl{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;margin:2px 4px 2px 0;background:var(--soft);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin:0}
.muted{color:var(--muted);font-size:13px}
.node{cursor:pointer}
.node:hover rect{stroke:var(--hl);stroke-width:2.5}
.golink{margin-top:8px;font-size:13px;padding:5px 10px;border-color:var(--hl);color:#1F7A36;font-weight:600}
.golink:hover{background:#F0F7F2;border-color:var(--hl)}
.row{margin:8px 0}
.row .lbl{margin-bottom:2px}
.row p{margin:4px 0}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-family:var(--font-display);font-size:25px;line-height:1.1;color:#1F7A36}
.kpi span{color:var(--muted);font-size:12.5px;line-height:1.35;display:block;margin-top:3px}
/* atlas */
.amp{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.amplegend{font-size:13px;color:var(--muted)}
.amplegend span{margin-right:10px}
.fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.fxc{display:block;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:9px 11px;text-align:left}
.fxc:hover{border-color:var(--c)}
.fxc.sel{box-shadow:0 0 0 2px var(--c)}
.fxc b{display:block;font-size:14px;line-height:1.25}
.fxc span{font-size:12px;color:var(--muted)}
#fxd{position:sticky;top:10px}
#fxd svg{max-height:200px}
/* tables */
.ovx{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
table.t .pill{white-space:nowrap}
.hm td.s{text-align:center;font-weight:600;width:13%;color:var(--fg)}
/* regulation */
.reglist{display:grid;gap:8px}
.rg{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.rg .d{font-family:var(--font-mono);font-size:13px;color:#1F7A36;font-weight:600}
.rg b{display:block}
.rg span{font-size:13px;color:var(--muted)}
.rg.past{opacity:.66}
.rg .gtag{display:inline-block;font-family:var(--font-mono);font-size:10.5px;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;font-weight:400;vertical-align:1px}
/* related modules */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lk{display:block;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;width:100%}
button.lk:hover{border-color:var(--hl)}
.lk b{display:block;font-size:16px;margin-bottom:3px;font-family:var(--font-display)}
button.lk b{color:#1F7A36}
.lk span{font-size:13px;color:var(--muted)}
details{font-size:12px;color:var(--muted)}
details ol{columns:2;column-gap:28px;margin:8px 0 0}
details li{break-inside:avoid;margin-bottom:4px}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}header{flex-direction:column}details ol{columns:1}#fxd{position:static}}
</style>
<script src="chemical_finishing_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="scenes" id="scenes" role="group"></div>
  <section class="caption" aria-live="polite"><h2 id="ctitle"></h2><p id="ctext"></p></section>

  <!-- 0 finishing chain -->
  <div class="sc" id="sc0">
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="stage">
        <svg id="chainsvg" viewBox="0 0 760 330" role="img"></svg>
        <div style="padding:2px 6px 4px"><span class="muted" id="dyehint"></span> <button type="button" class="golink" id="dyelink"></button></div>
      </div>
      <div class="card" id="chaind"></div>
    </div>
  </div>
  <!-- 1 effect atlas -->
  <div class="sc" id="sc1">
    <div class="amplegend" id="amplegend"></div>
    <div class="seg sm" id="fbar"></div>
    <div class="grid2">
      <div class="fx" id="fxgrid"></div>
      <div class="card" id="fxd"></div>
    </div>
  </div>
  <!-- 2 application methods -->
  <div class="sc" id="sc2">
    <div class="seg" id="mtabs"></div>
    <div class="grid2">
      <div class="stage"><svg id="msvg" viewBox="0 0 620 330" role="img"></svg></div>
      <div class="card" id="mdesc"></div>
    </div>
    <div class="card">
      <span class="lbl" id="putitle"></span>
      <svg id="pusvg" viewBox="0 0 1100 230" role="img"></svg>
      <p class="note" id="punote"></p>
    </div>
  </div>
  <!-- 3 PFAS phase-out -->
  <div class="sc" id="sc3">
    <div class="grid2">
      <div class="card ovx">
        <table class="t hm" id="hm"></table>
        <p class="note" id="hmnote" style="margin-top:8px"></p>
      </div>
      <div class="stage"><svg id="gensvg" viewBox="0 0 420 330" role="img"></svg></div>
    </div>
  </div>
  <!-- 4 regulation & standards -->
  <div class="sc" id="sc4">
    <div class="seg sm" id="rbar"></div>
    <div class="reglist" id="reglist"></div>
  </div>
  <!-- 5 suppliers -->
  <div class="sc" id="sc5">
    <div class="seg sm" id="abar"></div>
    <div class="card ovx"><table class="t" id="atab"></table></div>
    <div class="links" id="links"></div>
  </div>

  <p class="note" id="note"></p>
  <details><summary id="srcsum"></summary><ol id="srclist"></ol></details>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let lang=params.get('lang')||'de';if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const T=()=>TEXTS[lang];
const NSC=6;
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// rough text width (CJK = 1 em) - used to shrink/wrap SVG labels that would overflow their slot
const CJK=/[⺀-鿿＀-￯　-〿]/;
const textW=(t,s,w)=>{let n=0;for(const ch of String(t))n+=CJK.test(ch)?1:/[A-Z0-9%]/.test(ch)?.64:ch===' '?.3:.54;return n*s*(w>=600?1.05:1)};
const TX=(x,y,t,c='var(--fg)',a='middle',w=600,s=12,max=0)=>{
  let sz=s,adj='';
  if(max){const e=textW(t,s,w);if(e>max){sz=Math.max(s*.8,s*max/e);if(textW(t,sz,w)>max)adj=` textLength="${max}" lengthAdjust="spacingAndGlyphs"`}}
  return `<text x="${x}" y="${y}" font-size="${+sz.toFixed(1)}" text-anchor="${a}" fill="${c}" font-weight="${w}"${adj}>${esc(t)}</text>`;
};
// split a label into lines of at most maxW px (latin: by words, CJK: by characters)
function wrap(t,maxW,s,w){
  const toks=String(t).match(/[⺀-鿿＀-￯　-〿]|[^\s⺀-鿿＀-￯　-〿]+|\s+/g)||[];
  const lines=[];let cur='';
  toks.forEach(k=>{
    if(/^\s+$/.test(k)){if(cur)cur+=' ';return}
    const nx=cur+k;
    if(cur.trim()&&textW(nx.trim(),s,w)>maxW){lines.push(cur.trim());cur=k}else cur=nx;
  });
  if(cur.trim())lines.push(cur.trim());
  return lines;
}

// ── language-neutral data (texts in chemical_finishing_texts.js, same order)
// chain stations: key, position/width in the SVG
const CH=[{k:'vor',x:15,y:60,w:150},{k:'far',x:200,y:60,w:150},{k:'aus',x:385,y:60,w:170},{k:'spa',x:590,y:60,w:155},
          {k:'mec',x:395,y:190,w:180},{k:'pru',x:625,y:190,w:120},{k:'pra',x:15,y:190,w:150}];
const CATK=['pfl','sch','hyg','fas','gar'];
const CATC={pfl:'#2386C8',sch:'#E07B39',hyg:'#39A650',fas:'#6A4FC8',gar:'#C2255C'};
const AMP={1:'#39A650',2:'#F08C00',3:'#E03131'};
// effects: key, category, mechanism sketch, regulatory pressure 1..3
const FX=[['soft','pfl','film',2],['dp','pfl','cross',3],['dwr','sch','drop',3],['oil','sch','drop',3],['sr','pfl','film',1],
  ['fr','sch','char',3],['am','hyg','ion',3],['odor','hyg','cap',1],['hyd','hyg','wick',1],['as','hyg','film',1],
  ['uv','sch','film',1],['pil','pfl','film',1],['felt','fas','scale',2],['moth','fas','ion',2],['caps','hyg','cap',1],
  ['coat','sch','film',2],['spin','gar','yarn',1],['avi','gar','yarn',1]].map(([k,c,m,a])=>({k,c,m,a}));
// application methods: key, wet pick-up range in % (null = not in the chart)
const MT=[['aus',null],['fou',[60,100]],['min',[10,40]],['sch',[15,40]],['spr',[15,35]],['bes',null],['pla',[0,5]]].map(([k,pu])=>({k,pu}));
// DWR chemistries: water, oil, wash durability, handle, environmental profile (0..3)
const HM=[[3,3,3,2,0],[3,2,2,2,1],[2,0,1,1,3],[2,0,2,3,2],[3,0,2,2,2],[2,0,2,2,1]];
const GEN=[['C8','#E03131'],['C6','#F08C00'],['C0','#2F8F46']];
// regulation timeline: group, already in force
const RG=[['eu',1],['std',1],['eu',1],['eu',1],['nat',1],['nat',1],['eu',1],['nat',1],['eu',1],['eu',1],['ch',1],['eu',0],['eu',0],['eu',0],['nat',0]];
const RGK=['all','eu','ch','nat','std'];
// suppliers: name, seat (null = "various"), group
const AN=[['Archroma','Pratteln (CH)','chem'],['CHT Group','Tübingen (DE)','chem'],['Rudolf Group','Geretsried (DE)','chem'],
  ['Tanatex Chemicals','Ede (NL)','chem'],['Nicca Chemical','Fukui (JP)','chem'],['Dow / Wacker / Evonik','US / DE / DE','roh'],
  ['Sanitized','Burgdorf (CH)','bio'],['Pulcra Chemicals','Geretsried (DE)','gar'],['Schill+Seilacher','Böblingen (DE)','gar'],
  ['Takemoto Oil & Fat','Gamagori (JP)','gar'],['Matsumoto Yushi','Osaka (JP)','gar'],['Transfar Chemicals','Hangzhou (CN)','chem'],
  ['DyStar · Bozzetto · Zschimmer & Schwarz · Dr. Petry · Sarex · Fineotex',null,'chem'],['Monforts','Mönchengladbach (DE)','mas'],
  ['BW Converting (Baldwin)','Green Bay (US)','mas'],['bluesign · OEKO-TEX · ZDHC','CH / CH / NL','std']];
const ANK=['all','chem','roh','bio','gar','mas','std'];
// related modules (cards in the supplier scene; null = no Knowledge Base module)
const LINKS=['poy_spinning_plants','dty_machines','aty_machines',null];
const LINK_KEYS=['textile_dyeing','poy_spinning_plants','dty_machines','aty_machines'];
const SOURCES=['Beveridge & Diamond – PFHxA limits, FR/DK/US 2026 (bdlaw.com)','Bureau Veritas – REACH entry 79 (PFHxA) (bureauveritas.com)',
  'bluesign – PFHxA and PFAS phase-out (bluesign.com)','TraceForGood – French PFAS decree, Dec. 2025 (traceforgood.com)',
  'TRIS notification France (exemptions 2026/2030) (ec.europa.eu)','SpecialChem – ECHA RAC/SEAC on the PFAS restriction (specialchem.com)',
  'ECHA update at the EFSA Advisory Forum (June 2026) (efsa.europa.eu)','ChemRadar – PFAS restriction timeline (chemradar.com)',
  'SRF – Switzerland tightens ChemRRV (PFAS, formaldehyde) (srf.ch)','SGS – ChemRRV update Dec. 2025 (sgs.com)',
  'SATRA – REACH entry 72 (CMR in textiles) (satra.com)','Intertek – Regulation (EU) 2018/1513 (intertek.com.cn)',
  'Fagus-GreCon – formaldehyde emission (entry 77) (fagus-grecon.com)','University of Bayreuth – textile finishing (DMDHEU, cyclodextrins) (uni-bayreuth.de)',
  'DWI Aachen – formaldehyde-free crosslinkers (IGF 18882N) (rwth-aachen.de)','EPA HERO – formaldehyde release of DMDHEU (epo.gov)',
  'US 6309565 – Proban/Pyrovatex, formaldehyde-free flame retardant (uspto.gov)','Malucelli et al. – phosphorus-based flame retardants (nih.gov)',
  'University of Fribourg – antimicrobial textile agents (review) (unifr.ch)','European Outdoor Group – BPR, treated articles (europeanoutdoorgroup.com)',
  'Implementing Regulation (EU) 2024/2635 – silver zinc zeolite (lawplayer.com)','Notification Authority for Chemicals (CH) – biocides in textiles (admin.ch)',
  'Holmquist et al. 2016 – DWR chemistries compared (chalmers.se)','Centexbel – Patent Alert PFAS-free (2026) (centexbel.be)',
  'Textile World – Nicca/Archroma, ZELAN (Oct. 2026) (textileworld.com)','fibre2fashion – ZELAN R3 launch 2015 (fibre2fashion.com)',
  'R&D World – Nicca NEOSEED (silicone DWR) (rdworldonline.com)','CHT – softener portfolio (silicone quats) (cht.com)',
  'CN102660029B – share of amino silicone in handle modifiers (patsnap.com)','Koruyucu – amino silicone softeners and yellowing (cu.edu.tr)',
  'Rahman et al. – shrink-resist finishing of wool (review) (nih.gov)','EU LIFE SuperWool – plasma instead of chlorine-Hercosett (europa.eu)',
  'textile technology – Baldwin TexCoat at the Monforts ATC (textiletechnology.net)','Knitting Industry – spray application up to 100 m/min (knittingindustry.com)',
  'EP0048348 – foam application, tolerance of liquor add-on (google.com/patents)','EP0198416 – tailing on the pad, minimum application (epo.org)',
  'US6858043 – spin finish for friction texturing (google.com/patents)','US4552671 (Takemoto) – spin finish for high-speed texturing (google.com/patents)',
  'US4069160 – texturing finish, composition (uspto.gov)','Schill+Seilacher – spin finishes POY/DTY (schillseilacher.de)',
  'Textination – Archroma acquires Huntsman Textile Effects (textination.de)','Huntsman – sale price of Textile Effects (theglobeandmail.com)',
  '360iResearch – finishing chemicals market (gii.tw)','TBRC – finishing chemicals market 2025 (gii.tw)',
  'Market overview of textile chemical manufacturers (marketresearch.com)','Apparel Insider – bluesign and ZDHC (apparelinsider.com)',
  'OICompass – ZDHC MRSL 3.0 with PFAS (oicompass.com)'];

let scene=Math.max(0,Math.min(NSC-1,parseInt(params.get('scene')||'0',10)||0));
let chSel='aus', fxCat='all', fxSel='dwr', mt='fou', rg='all', ag='all';

function segBtns(el,items,cur,cb){
  el.innerHTML=items.map(([v,l,c])=>`<button type="button" data-v="${v}" aria-pressed="${v===cur}">${c?`<i style="background:${c}"></i>`:''}${esc(l)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>cb(b.dataset.v));
}
function openModule(key){
  if(EMBED){document.title='open:'+key;return}
  location.href=key+'.html?lang='+encodeURIComponent(lang);
}

// ── 0 finishing chain
function drawChain(){
  const t=T(),u=t.ui;
  $('kpis').innerHTML=t.kpis.map(([b,s])=>`<div class="kpi"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
  let s=`<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="var(--muted)"/></marker></defs>`;
  s+=TX(20,30,u.chainFabric,'var(--muted)','start',600,11.5,340)+TX(20,165,u.chainYarn,'var(--muted)','start',600,11.5,70);
  [[0,1],[1,2],[2,3]].forEach(([a,b])=>{s+=`<line x1="${CH[a].x+CH[a].w}" y1="${CH[a].y+32}" x2="${CH[b].x-4}" y2="${CH[b].y+32}" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ar)"/>`});
  s+=`<path d="M667 124 C667 160 485 150 485 186" fill="none" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ar)"/>`;
  s+=`<line x1="575" y1="222" x2="621" y2="222" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ar)"/>`;
  s+=`<path d="M90 186 C90 140 90 130 90 128" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>`;
  wrap(u.chainWashed,270,10.5,400).slice(0,2).forEach((l,i)=>{s+=TX(100,152+i*13,l,'var(--muted)','start',400,10.5,280)});
  CH.forEach((c,i)=>{
    const on=c.k===chSel,main=c.k==='aus',col=main?'var(--hl)':c.k==='pra'?'var(--twist)':'var(--wind)';
    const n=t.chain[i].n,lines=wrap(n,c.w-16,12.5,700).slice(0,2);
    s+=`<g class="node" data-k="${c.k}"><rect x="${c.x}" y="${c.y}" width="${c.w}" height="64" rx="10" fill="${main?'#E8F5EA':'var(--panel)'}" stroke="${on?'var(--hl)':col}" stroke-width="${on?3:1.6}"/>`+
      lines.map((l,j)=>TX(c.x+c.w/2,c.y+(lines.length>1?28+j*16:37),l,main?'#1F7A36':'var(--fg)','middle',700,12.5,c.w-12)).join('')+`</g>`;
  });
  s+=`<rect x="20" y="285" width="720" height="30" rx="6" fill="var(--soft)" stroke="var(--line)"/>`+TX(380,305,u.chainBar,'var(--fg)','middle',600,12,700);
  const el=$('chainsvg');el.innerHTML=s;el.setAttribute('aria-label',u.ariaChain);
  el.querySelectorAll('.node').forEach(n=>n.onclick=()=>{chSel=n.dataset.k;drawChain()});
  const i=CH.findIndex(x=>x.k===chSel),c=t.chain[i];
  $('chaind').innerHTML=`<h3>${esc(c.n)}</h3><p>${esc(c.d)}</p><div class="row"><span class="lbl">${esc(u.typChem)}</span>${c.ch.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`+
    (chSel==='far'?`<button type="button" class="golink" data-k="${LINK_KEYS[0]}">${esc(u.openDye)}</button>`:'');
  const b=$('chaind').querySelector('.golink');if(b)b.onclick=()=>openModule(b.dataset.k);
  $('dyehint').textContent=u.openDyeHint;$('dyelink').textContent=u.openDye;
}
$('dyelink').onclick=()=>openModule(LINK_KEYS[0]);

// ── 1 effect atlas
function mech(m,col){
  const L=T().mech;let s='';
  const cap=(y,t)=>TX(160,y,t,'var(--muted)','middle',400,11.5,300);
  const fib=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#F1E3C8" stroke="#B08850" stroke-width="1.5"/>`;
  if(m==='film'){s+=fib(160,130,62)+`<circle cx="160" cy="130" r="70" fill="none" stroke="${col}" stroke-width="7" opacity=".7"/>`;for(let i=0;i<16;i++){const a=i/16*6.283;s+=`<line x1="${160+70*Math.cos(a)}" y1="${130+70*Math.sin(a)}" x2="${160+86*Math.cos(a)}" y2="${130+86*Math.sin(a)}" stroke="${col}" stroke-width="2"/>`}s+=cap(240,L.film)}
  if(m==='cross'){for(let r=0;r<3;r++)s+=`<path d="M40 ${70+r*55} Q160 ${60+r*55} 280 ${70+r*55}" stroke="#B08850" stroke-width="5" fill="none"/>`;for(let i=0;i<5;i++){const x=70+i*50;s+=`<line x1="${x}" y1="78" x2="${x+8}" y2="118" stroke="${col}" stroke-width="3"/><line x1="${x+20}" y1="133" x2="${x+28}" y2="173" stroke="${col}" stroke-width="3"/>`}s+=cap(215,L.cross)}
  if(m==='drop'){s+=`<rect x="30" y="160" width="260" height="22" rx="4" fill="#F1E3C8" stroke="#B08850"/><path d="M110 160 A42 42 0 1 1 190 160 Z" fill="#A5D8FF" stroke="var(--air)" stroke-width="2"/><line x1="95" y1="160" x2="135" y2="118" stroke="${col}" stroke-width="2"/>`+TX(78,135,'θ > 90°',col,'middle',700,12)+cap(215,L.drop)}
  if(m==='char'){s+=`<rect x="40" y="150" width="240" height="30" rx="4" fill="#F1E3C8" stroke="#B08850"/><rect x="40" y="132" width="240" height="18" fill="#343A40"/>`;for(let i=0;i<6;i++)s+=`<path d="M${70+i*36} 130 q-10 -30 0 -55 q10 25 0 55" fill="#FFA94D" opacity=".85"/>`;s+=`<line x1="40" y1="122" x2="280" y2="122" stroke="${col}" stroke-dasharray="5 4" stroke-width="2"/>`+cap(205,L.char)}
  if(m==='ion'){s+=fib(160,130,60);[[90,60],[240,70],[250,190],[80,200]].forEach(p=>{s+=`<ellipse cx="${p[0]}" cy="${p[1]}" rx="18" ry="10" fill="#D3F9D8" stroke="#2F8F46"/><line x1="${p[0]-12}" y1="${p[1]-8}" x2="${p[0]+12}" y2="${p[1]+8}" stroke="#E03131" stroke-width="2.5"/>`});for(let i=0;i<10;i++){const a=i/10*6.283;s+=`<circle cx="${160+80*Math.cos(a)}" cy="${130+80*Math.sin(a)}" r="4" fill="${col}"/>`}s+=cap(245,L.ion)}
  if(m==='cap'){s+=`<rect x="30" y="170" width="260" height="22" rx="4" fill="#F1E3C8" stroke="#B08850"/>`;[[80,150,22],[150,140,30],[225,152,20]].forEach(c=>{s+=`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="2"/><circle cx="${c[0]}" cy="${c[1]}" r="${c[2]/2.6}" fill="${col}" opacity=".6"/>`});s+=cap(225,L.cap)}
  if(m==='wick'){s+=`<rect x="30" y="110" width="260" height="40" rx="6" fill="#F1E3C8" stroke="#B08850"/><path d="M60 160 q20 -30 40 0 q20 30 40 0 q20 -30 40 0 q20 30 40 0 q20 -30 40 0" stroke="var(--air)" stroke-width="3" fill="none"/>`;for(let i=0;i<5;i++)s+=`<path d="M${70+i*45} 100 q-6 -18 0 -30" stroke="var(--muted)" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>`;s+=cap(200,L.wick)}
  if(m==='scale'){s+=`<rect x="40" y="110" width="240" height="44" rx="22" fill="#F1E3C8" stroke="#B08850"/>`;for(let i=0;i<9;i++)s+=`<path d="M${60+i*25} 110 l14 12 l0 20 l-14 12" fill="none" stroke="#B08850" stroke-width="1.6"/>`;s+=`<rect x="40" y="104" width="240" height="56" rx="26" fill="none" stroke="${col}" stroke-width="4" opacity=".7"/>`+cap(195,L.scale)}
  if(m==='yarn'){for(let i=0;i<7;i++)s+=`<path d="M30 ${100+i*8} C120 ${92+i*8} 200 ${110+i*8} 290 ${100+i*8}" stroke="#B08850" stroke-width="2.5" fill="none"/>`;s+=`<path d="M30 92 C120 84 200 102 290 92 L290 158 C200 168 120 150 30 158Z" fill="${col}" opacity=".13"/>`+cap(235,L.yarn)}
  return s;
}
function drawFx(){
  const t=T(),u=t.ui;
  $('amplegend').innerHTML=esc(u.ampLegend)+' '+[1,2,3].map(a=>`<span><span class="amp" style="background:${AMP[a]}"></span>${esc(u.ampn[a-1])}</span>`).join('');
  segBtns($('fbar'),[['all',u.all]].concat(CATK.map((k,i)=>[k,t.cats[i],CATC[k]])),fxCat,v=>{
    fxCat=v;const l=FX.filter(f=>fxCat==='all'||f.c===fxCat);if(!l.find(f=>f.k===fxSel))fxSel=l[0].k;drawFx();
  });
  $('fxgrid').innerHTML=FX.map((f,i)=>[f,t.fx[i]]).filter(([f])=>fxCat==='all'||f.c===fxCat).map(([f,x])=>
    `<button type="button" class="fxc ${f.k===fxSel?'sel':''}" style="--c:${CATC[f.c]}" data-k="${f.k}"><b>${esc(x.n)}</b><span><span class="amp" style="background:${AMP[f.a]}"></span>${esc(x.s)}</span></button>`).join('');
  $('fxgrid').querySelectorAll('.fxc').forEach(b=>b.onclick=()=>{fxSel=b.dataset.k;drawFx()});
  const i=FX.findIndex(x=>x.k===fxSel),f=FX[i],x=t.fx[i],col=CATC[f.c];
  $('fxd').innerHTML=`<span class="pill" style="border-color:${col};color:${col}">${esc(t.cats[CATK.indexOf(f.c)])}</span><span class="pill"><span class="amp" style="background:${AMP[f.a]}"></span>${esc(fmt(u.pressure,{p:u.ampn[f.a-1]}))}</span>
   <h3>${esc(x.n)}</h3><svg viewBox="0 0 320 250" role="img" aria-label="${esc(x.n)}">${mech(f.m,col)}</svg>
   <div class="row"><span class="lbl">${esc(u.lblChem)}</span>${x.chem.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</div>
   <div class="row"><span class="lbl">${esc(u.lblHow)}</span><p>${esc(x.wie)}</p></div>
   <div class="row"><span class="lbl">${esc(u.lblPractice)}</span><p>${esc(x.pro)}</p></div>
   <div class="row"><span class="lbl">${esc(u.lblTest)}</span><p>${esc(x.norm)}</p></div>
   <div class="row"><span class="lbl">${esc(u.lblReg)}</span><p>${esc(x.reg)}</p></div>`;
}

// ── 2 application methods
function methodSVG(k){
  const v=T().msv;let s='';
  const fab=d=>`<path d="${d}" fill="none" stroke="var(--yarn)" stroke-width="3"/>`;
  const L=(x,y,t,c='var(--fg)',a='middle',max=300,w=600)=>TX(x,y,t,c,a,w,12.5,max);
  if(k==='aus'){s+=`<ellipse cx="310" cy="170" rx="210" ry="110" fill="var(--bg)" stroke="var(--wind)" stroke-width="2"/><path d="M130 220 Q310 290 490 220" fill="#A5D8FF" opacity=".6"/>`+fab('M150 120 C220 60 400 60 470 120 C520 170 470 240 310 250 C150 240 100 170 150 120')+`<circle cx="310" cy="70" r="18" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/>`+L(310,40,v.reel,'var(--muted)','middle',300)+L(310,300,v.liquor,'var(--air)','middle',560)}
  if(k==='fou'){s+=`<path d="M150 170 L180 260 L300 260 L330 170Z" fill="#A5D8FF" stroke="var(--air)" stroke-width="2"/>`+fab('M40 120 L150 120 L240 240 L330 140 L360 100')+`<circle cx="240" cy="240" r="12" fill="var(--panel)" stroke="var(--wind)"/>`+L(240,290,v.trough,'var(--air)','middle',300);
    s+=`<circle cx="380" cy="72" r="26" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/><circle cx="380" cy="128" r="26" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/>`+fab('M360 100 L580 100')+L(420,60,v.nip,'var(--fg)','start',190)}
  if(k==='min'){s+=`<rect x="200" y="190" width="160" height="60" rx="6" fill="#A5D8FF" stroke="var(--air)"/><circle cx="280" cy="170" r="40" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/><path d="M245 190 A40 40 0 0 0 315 190" stroke="var(--air)" stroke-width="6" fill="none"/>`+fab('M40 130 L580 130')+L(280,285,v.applRoll,'var(--air)','middle',560)}
  if(k==='sch'){s+=`<rect x="70" y="200" width="110" height="70" rx="10" fill="var(--panel)" stroke="var(--wind)"/>`;const fl=wrap(v.foamGen,96,12.5,600).slice(0,3);fl.forEach((l,i)=>{s+=L(125,240-(fl.length-1)*8+i*16,l,'var(--fg)','middle',100)});
    s+=`<path d="M180 230 L270 230 L270 150" stroke="var(--wind)" stroke-width="3" fill="none"/>`;for(let i=0;i<14;i++)s+=`<circle cx="${230+i*6}" cy="${140-(i%3)*4}" r="${4+(i%3)}" fill="#E7F5FF" stroke="var(--air)"/>`;s+=fab('M40 130 L580 130')+L(330,105,v.foamBreaks,'var(--air)','start',280)}
  if(k==='spr'){s+=`<rect x="220" y="40" width="180" height="40" rx="8" fill="var(--panel)" stroke="var(--twist)" stroke-width="2"/>`+L(310,65,v.sprayBar,'var(--twist)','middle',168);for(let i=0;i<9;i++)s+=`<path d="M${240+i*18} 82 L${232+i*19} 126" stroke="var(--air)" stroke-width="1.5" stroke-dasharray="3 4"/>`;
    s+=fab('M40 130 L580 130')+`<rect x="460" y="150" width="130" height="80" rx="8" fill="#FFF4E6" stroke="var(--heat)"/>`+L(525,195,v.stenter,'var(--heat)','middle',120)+L(250,250,v.contactless,'var(--muted)','middle',400,400)}
  if(k==='bes'){s+=fab('M40 200 L580 200')+`<path d="M260 120 L300 196 L340 120Z" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/><path d="M180 196 Q240 160 296 196" fill="#D0BFFF" stroke="var(--twist)"/><rect x="300" y="190" width="280" height="8" fill="#D0BFFF"/>`+L(300,105,v.knife,'var(--fg)','middle',240)+L(440,230,v.film,'var(--twist)','middle',260)}
  if(k==='pla'){s+=`<rect x="140" y="60" width="340" height="170" rx="16" fill="#F3F0FF" stroke="var(--twist)" stroke-width="2"/>`;for(let i=0;i<30;i++)s+=`<circle cx="${160+(i*37)%300}" cy="${80+(i*53)%80}" r="2.5" fill="var(--twist)"/>`;s+=fab('M40 200 L580 200')+`<line x1="160" y1="70" x2="460" y2="70" stroke="var(--twist)" stroke-width="4"/><line x1="160" y1="225" x2="460" y2="225" stroke="var(--twist)" stroke-width="4"/>`+L(310,270,v.plasma,'var(--twist)','middle',560)}
  return s;
}
function drawM(){
  const t=T(),u=t.ui;
  segBtns($('mtabs'),MT.map((m,i)=>[m.k,t.mt[i].short]),mt,k=>{mt=k;drawM();drawPU()});
  $('msvg').innerHTML=methodSVG(mt);$('msvg').setAttribute('aria-label',u.ariaMethod);
  const v=t.mt[MT.findIndex(m=>m.k===mt)];
  $('mdesc').innerHTML=`<h3>${esc(v.t)}</h3><p>${esc(v.d)}</p><span class="lbl" style="color:#1F7A36">${esc(u.pros)}</span>${v.pro.map(x=>`<span class="pill">+ ${esc(x)}</span>`).join('')}`+
    `<span class="lbl" style="margin-top:8px;color:var(--heat)">${esc(u.cons)}</span>${v.con.map(x=>`<span class="pill">− ${esc(x)}</span>`).join('')}`;
}
function drawPU(){
  const t=T(),u=t.ui;
  $('putitle').textContent=u.puTitle;$('punote').textContent=u.puNote;
  const L=MT.map((m,i)=>[m,t.mt[i]]).filter(([m])=>m.pu);
  const x0=250,sc=7.5;let s='';
  [0,20,40,60,80,100].forEach(v=>{s+=`<line x1="${x0+v*sc}" y1="10" x2="${x0+v*sc}" y2="${20+L.length*34}" stroke="var(--line)"/>`+TX(x0+v*sc,34+L.length*34,v+' %','var(--muted)','middle',400,11)});
  L.forEach(([m,x],i)=>{const y=18+i*34,on=m.k===mt;
    s+=TX(x0-12,y+15,x.short,on?'#1F7A36':'var(--fg)','end',on?700:500,12.5,232);
    s+=`<rect x="${x0+m.pu[0]*sc}" y="${y}" width="${Math.max(6,(m.pu[1]-m.pu[0])*sc)}" height="20" rx="5" fill="${on?'var(--hl)':'#CED4DA'}"/>`+TX(x0+m.pu[1]*sc+8,y+15,`${m.pu[0]}–${m.pu[1]} %`,'var(--muted)','start',500,11)});
  $('pusvg').setAttribute('viewBox',`0 0 1100 ${44+L.length*34}`);$('pusvg').setAttribute('aria-label',u.ariaPU);
  $('pusvg').innerHTML=s;
}

// ── 3 PFAS phase-out
function drawPFAS(){
  const t=T(),u=t.ui;
  const sym=v=>v===0?'–':'●'.repeat(v);
  const bg=(v,j)=>(j===4?['#FFE3E3','#FFF3BF','#D3F9D8','#B2F2BB']:['transparent','#E7F5FF','#A5D8FF','#74C0FC'])[v];
  $('hm').innerHTML=`<tr><th>${esc(u.hmHead)}</th>${u.hmCols.map(c=>`<th style="text-align:center">${esc(c)}</th>`).join('')}</tr>`+
    HM.map((r,i)=>`<tr><td>${esc(t.pfasRows[i])}</td>${r.map((v,j)=>`<td class="s" style="background:${bg(v,j)}">${sym(v)}</td>`).join('')}</tr>`).join('');
  $('hmnote').textContent=u.hmNote;
  // generation boxes: height follows the wrapped description
  let s='',y=10;
  GEN.forEach(([n,c],i)=>{
    const g=t.gens[i],lines=wrap(g.d,292,11.5,400),h=Math.max(88,lines.length*16+22);
    s+=`<rect x="10" y="${y}" width="400" height="${h}" rx="8" fill="var(--panel)" stroke="${c}" stroke-width="2"/>`+TX(30,y+34,n,c,'start',700,24)+TX(30,y+56,g.p,'var(--muted)','start',500,11,64);
    lines.forEach((l,j)=>{s+=TX(100,y+24+j*16,l,'var(--fg)','start',400,11.5,300)});
    if(i<2)s+=`<path d="M60 ${y+h} L60 ${y+h+14}" stroke="var(--muted)" stroke-width="2"/>`;
    y+=h+14;
  });
  $('gensvg').setAttribute('viewBox',`0 0 420 ${y-4}`);$('gensvg').setAttribute('aria-label',u.ariaGen);
  $('gensvg').innerHTML=s;
}

// ── 4 regulation
function drawReg(){
  const t=T(),u=t.ui;
  segBtns($('rbar'),RGK.map((k,i)=>[k,u.regGroups[i]]),rg,v=>{rg=v;drawReg()});
  $('reglist').innerHTML=RG.map(([g,p],i)=>[g,p,t.reg[i]]).filter(([g])=>rg==='all'||g===rg).map(([g,p,r])=>
    `<div class="rg ${p?'past':''}"><div class="d">${esc(r.d)}</div><div><b>${esc(r.t)}<span class="gtag">${esc(u.regGroups[RGK.indexOf(g)])}</span></b><span>${esc(r.x)}</span></div></div>`).join('');
}

// ── 5 suppliers
function drawAn(){
  const t=T(),u=t.ui;
  segBtns($('abar'),ANK.map((k,i)=>[k,u.anGroups[i]]),ag,v=>{ag=v;drawAn()});
  $('atab').innerHTML=`<tr>${u.anHead.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`+AN.map((a,i)=>[a,t.an[i]]).filter(([a])=>ag==='all'||a[2]===ag).map(([a,d])=>
    `<tr><td><b>${esc(a[0])}</b></td><td>${esc(a[1]||u.various)}</td><td><span class="pill">${esc(u.anGroups[ANK.indexOf(a[2])])}</span></td><td>${esc(d)}</td></tr>`).join('');
  $('links').innerHTML=LINKS.map((k,i)=>{const l=t.links[i];
    return k?`<button type="button" class="lk" data-k="${k}"><b>${esc(l.b)} →</b><span>${esc(l.s)}</span></button>`:`<div class="lk"><b>${esc(l.b)}</b><span>${esc(l.s)}</span></div>`}).join('');
  $('links').querySelectorAll('button.lk').forEach(b=>b.onclick=()=>openModule(b.dataset.k));
}

// ── scenes / language
function go(i){
  scene=(i+NSC)%NSC;
  for(let k=0;k<NSC;k++)$('sc'+k).classList.toggle('on',k===scene);
  $('scenes').querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-pressed',k===scene));
  const sc=T().scenes[scene];$('ctitle').textContent=sc.title;$('ctext').textContent=sc.text;
  if(EMBED)document.title='scene:'+scene;
}
function applyLang(){
  const t=T(),u=t.ui;document.documentElement.lang=lang;
  $('eyebrow').textContent=u.eyebrow;$('h1').textContent=u.h1;$('lead').textContent=u.lead;$('note').textContent=u.note;
  $('srcsum').textContent=u.sources;$('srclist').innerHTML=SOURCES.map(x=>`<li>${esc(x)}</li>`).join('');
  $('scenes').innerHTML=t.scenes.map((s,i)=>`<button type="button" data-i="${i}">${esc(s.k)}</button>`).join('');
  $('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $('langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  drawChain();drawFx();drawM();drawPU();drawPFAS();drawReg();drawAn();go(scene);
}
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
applyLang();
})();
</script>
