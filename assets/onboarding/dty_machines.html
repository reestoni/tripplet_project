<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DTY Machines</title>
<!-- Knowledge-Base-Modul (ui/screen_onboarding.py), Kategorie DTY.
     Inhalt aus der Recherche-Seite des Nutzers "DTY-Maschinen - Hersteller, Bauformen & Varianten" (Stand Nov. 2026).
     Texte in dty_machines_texts.js (de/en/es/zh). ?lang=xx, window.setLang('xx'), window.goScene(i),
     ?embedded=1 (ohne eigenen Kopf/Kapitel-Knoepfe, meldet das Kapitel per document.title "scene:n"),
     ?scene=n fuer Screenshots. Keine externen Ressourcen (Quellen nur als Text, Herstellerseiten nur als Domain).
     Szene 0 verlinkt das Modul dty_intermingling: eingebettet per document.title "open:<key>", sonst <key>.html.
     Klick im Variantenschema (Szene 1) filtert die Hersteller und springt zu Szene 3. -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --hl:#39A650;--air:#2386C8;--heat:#E07B39;--yarn:#B5651D;--twist:#6A4FC8;--soft:#EEF3EC;
  --cool:#138A8A;--wind:#5A6460;--bad:#C62828;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:80ch}
.langs,.scenes{display:flex;gap:6px;flex-wrap:wrap}
.langs[hidden]{display:none}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 6px}
.caption p{margin:0;color:var(--muted);max-width:90ch}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font-body)}
.sc{display:none;flex-direction:column;gap:12px}
.sc.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.card h3{font-family:var(--font-display);font-size:22px;margin:2px 0 6px}
.card p{margin:6px 0}
.card ul{padding-left:18px;margin:6px 0}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:start}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:5px 10px;font-size:13px}
.lbl{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 4px}
.tag,.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;margin:2px 4px 6px 0;background:var(--soft);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.node{cursor:pointer}
.node:hover rect,.node:hover circle,.node:hover ellipse{stroke-width:2.5}
.node.sel rect:first-child{stroke:var(--hl);stroke-width:2.5;stroke-dasharray:4 3}
.yarn{fill:none;stroke:var(--yarn);stroke-width:2.6;stroke-dasharray:7 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion: reduce){.yarn{animation:none}}
.lk{display:block;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-top:10px}
.lk:hover{border-color:var(--hl)}
.lk b{display:block;font-size:15px;color:var(--hl)}
.lk span{font-size:13px;color:var(--muted)}
/* tree */
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.dim{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.dim h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.dim h4 .num{font-family:var(--font-mono);font-size:11px;background:#000;color:var(--hl);border-radius:4px;padding:2px 6px}
.opt{border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin:6px 0;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--hl)}
.opt b{font-size:14px}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.opt.hl{background:#EAF5EC;border-color:var(--hl)}
/* manufacturers */
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.filters input{font:inherit;font-size:14px;padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--fg);min-width:240px}
.tf{font-size:13px;color:var(--muted)}
.tf b{color:var(--fg)}
.tf button{padding:2px 8px;font-size:12px;margin-left:6px}
.mfr{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.mcard .top{padding:12px 14px 8px;display:flex;gap:10px;align-items:flex-start}
.flag{font-family:var(--font-mono);font-size:11px;padding:3px 7px;border-radius:4px;background:#000;color:var(--hl);white-space:nowrap}
.mcard h3{margin:0;font-size:17px;font-family:var(--font-display)}
.mcard .meta{color:var(--muted);font-size:13px}
.mcard .thumb{background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mcard .thumb svg{height:120px}
.mnote{padding:10px 14px 0;font-size:13.5px}
.models{padding:6px 14px 12px}
.model{border-top:1px dashed var(--line);padding:8px 0}
.model:first-child{border-top:0}
.model .mn{font-weight:600;font-size:14px}
.model .mn span{font-family:var(--font-mono);font-weight:400;color:var(--muted);font-size:12px}
.model .ms{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);margin:3px 3px 0 0;font-family:var(--font-mono)}
.chip.auto{border-color:var(--hl);color:#2B7D3C}
.chip.man,.chip.lg{border-color:var(--muted);color:var(--muted)}
.chip.lg{font-style:italic}
.chip.pa{border-color:var(--twist);color:var(--twist)}
.chip.pes{border-color:var(--air);color:var(--air)}
.srcd{margin-top:8px;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.empty{color:var(--muted);padding:20px}
/* bars */
.bars .row{display:grid;grid-template-columns:330px 1fr 54px;gap:10px;align-items:center;margin:5px 0;font-size:13.5px}
.bars .track{height:18px;background:var(--soft);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;border-radius:4px;transition:width .6s}
.bars .v{font-family:var(--font-mono);text-align:right}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* timeline */
.timeline{position:relative;padding-left:22px;border-left:2px solid var(--line);margin-left:6px}
.tev{margin:0 0 14px;position:relative}
.tev:before{content:"";position:absolute;left:-30px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--hl);border:2px solid var(--panel)}
.tev b{font-family:var(--font-mono);font-size:13px;color:var(--hl)}
.assess li{margin-bottom:8px}
details{font-size:12px;color:var(--muted)}
details ol{columns:2;column-gap:28px;margin:8px 0 0}
details li{break-inside:avoid;margin-bottom:4px}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}header{flex-direction:column}details ol{columns:1}.bars .row{grid-template-columns:150px 1fr 44px;font-size:12px}}
</style>
<script src="dty_machines_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="scenes" id="scenes" role="group"></div>
  <section class="caption" aria-live="polite"><h2 id="ctitle"></h2><p id="ctext"></p></section>

  <!-- 0 yarn path -->
  <div class="sc" id="sc0">
    <div class="grid2">
      <div class="stage">
        <div class="controls" id="controls"></div>
        <svg id="pathsvg" viewBox="0 0 830 430" role="img"></svg>
      </div>
      <div>
        <div class="card" id="detail"></div>
        <button type="button" class="lk" id="lkdty"></button>
      </div>
    </div>
  </div>
  <!-- 1 variant tree -->
  <div class="sc" id="sc1"><div class="tree" id="tree"></div></div>
  <!-- 2 machine profiles -->
  <div class="sc" id="sc2">
    <div class="seg" id="ptabs"></div>
    <div class="grid2">
      <div class="stage"><svg id="profsvg" viewBox="0 0 620 420" role="img"></svg></div>
      <div class="card" id="profdesc"></div>
    </div>
  </div>
  <!-- 3 manufacturers -->
  <div class="sc" id="sc3">
    <div class="filters" id="filters"></div>
    <div class="tf" id="treefilter"></div>
    <div class="mfr" id="mfr"></div>
  </div>
  <!-- 4 positions per machine -->
  <div class="sc" id="sc4">
    <div class="card">
      <div class="seg" id="c-sort" style="margin-bottom:10px"></div>
      <div class="bars" id="bars"></div>
      <div class="legend" id="legend"></div>
      <p class="note" id="barsnote"></p>
    </div>
  </div>
  <!-- 5 market -->
  <div class="sc" id="sc5">
    <div class="grid2">
      <div class="card"><div class="timeline" id="timeline"></div></div>
      <div class="card"><h3 id="assesst"></h3><ul class="assess" id="assess"></ul></div>
    </div>
  </div>

  <p class="note" id="note"></p>
  <details><summary id="srcsum"></summary><ol id="srclist"></ol></details>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let lang=params.get('lang')||'de';if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const T=()=>TEXTS[lang];
const NS=6;
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const TX=(x,y,t,c='var(--fg)',a='middle',w=600,s=12)=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="${a}" fill="${c}" font-weight="${w}">${esc(t)}</text>`;
const LINK_KEYS=['dty_intermingling'];
// yarn-path labels are drawn 2 px larger (that SVG is scaled down most in the embedded pane)
const TP=(x,y,t,c='var(--fg)',a='middle',w=600,s=12)=>TX(x,y,t,c,a,w,s+2);

// ── language-neutral data (texts in dty_machines_texts.js: mfr[id], comp[id], dims[i], prof[id])
// tags drive the variant-tree filter; mat/pos/auto are manufacturer data.
const MFR=[
 {id:'barmag',reg:'EU',country:'DE',city:'Remscheid',dom:'barmag.com',thumb:'vprofile',models:[
   {n:'eAFK Evo',auto:true,mat:['PES','PA'],pos:384,tags:['autodoff','ht','godet','disc','shortzone','vprof']},
   {n:'eAFK HQ',auto:true,mat:['PES'],pos:576,tags:['autodoff','godet','disc','contact','vprof','set']},
   {n:'eAFK Big V Multispindle',auto:true,mat:['PES'],pos:576,tags:['autodoff','godet','disc','contact','vprof','set']},
   {n:'eFK / eFK EvoSmart',auto:false,mat:['PES','PA'],pos:288,tags:['manual','godet','disc','contact','vprof','set','he']},
   {n:'FK6 / AFK / MPS',auto:null,mat:['PES','PA'],pos:null,tags:['legacy','vprof','disc','nip']}]},
 {id:'tmt',reg:'JP',country:'JP',city:'Osaka / Kyoto',dom:'tmt-machinery.jp',thumb:'short',models:[
   {n:'ATF-G1',auto:true,mat:['PES'],pos:480,tags:['autodoff','ht','disc','shortzone']},
   {n:'ATF-1500 (Four, F/V)',auto:true,mat:['PES','PA'],pos:384,tags:['autodoff','ht','contact','disc','shortzone','vprof','set']},
   {n:'ATF-21',auto:true,mat:['PES'],pos:null,tags:['autodoff','contact','vprof','mprof','set']},
   {n:'REIKA',auto:null,mat:['PA','PES'],pos:null,tags:['pa','air','special']},
   {n:'33H (Murata Mach Crimper)',auto:null,mat:['PES','PA'],pos:240,tags:['legacy','belt']}]},
 {id:'ssm',reg:'EU',country:'CH / IT',city:'Wädenswil',dom:'ssm.ch',thumb:'single',models:[
   {n:'DP5-FT',auto:true,mat:['PES','PA','PP'],pos:40,tags:['autodoff','single','godet','disc','set','special']},
   {n:'TG2-FT',auto:true,mat:['PA','PP','PES'],pos:288,tags:['autodoff','hprof','pa','disc','he']},
   {n:'TG1-FT',auto:false,mat:['PA','PP','PES'],pos:null,tags:['manual','hprof','pa','he']},
   {n:'TG30-PES',auto:null,mat:['PES','PA','PP'],pos:null,tags:['hprof','set','godet']},
   {n:'TG30 AE/AEM · TG30-ETC',auto:true,mat:['PA','PP','PES'],pos:null,tags:['autodoff','hprof','pa','air','special','he']}]},
 {id:'himson',reg:'IN',country:'IN',city:'Surat',dom:'indiamart.com',thumb:'vprofile',models:[
   {n:'HSS-AX5-15G',auto:true,mat:['PES'],pos:448,tags:['autodoff','manual','disc','godet']},
   {n:'HSS-AX4-N / AX4-11G',auto:null,mat:['PES','PA'],pos:null,tags:['disc']},
   {n:'HSS-DSR-4G (-TS)',auto:null,mat:['PES'],pos:null,tags:['godet']},
   {n:'ATH-12 F/V (TMT)',auto:true,mat:['PES'],pos:288,tags:['autodoff','legacy','vprof']}]},
 {id:'aalidhra',reg:'IN',country:'IN',city:'Surat',dom:'indiamart.com',thumb:'vprofile',models:[
   {n:'Double Density DTY',auto:false,mat:['PES'],pos:null,tags:['contact','nip','set','double']},
   {n:'ADT-800 (Air Draw Texturising)',auto:false,mat:['PES','PA'],pos:104,tags:['air']}]},
 {id:'hongyuan',reg:'CN',country:'CN',city:'Wuxi, Jiangsu',dom:'made-in-china.com',thumb:'vprofile',models:[
   {n:'HY-6T (Godet)',auto:false,mat:['PES'],pos:384,tags:['godet','set']},
   {n:'HY-7 HLV (Double density)',auto:false,mat:['PES','PA'],pos:312,tags:['double','set']},
   {n:'HY-9',auto:true,mat:['PES'],pos:null,tags:['autodoff','disc']},
   {n:'HY-12T',auto:false,mat:['PA'],pos:240,tags:['pa','he','disc']}]},
 {id:'yuejian',reg:'CN',country:'CN',city:'Shaoxing, Zhejiang',dom:'directindustry.com',thumb:'vprofile',models:[
   {n:'YJ1000V',auto:false,mat:['PES','PP'],pos:288,tags:['contact','set','disc','vprof']},
   {n:'YJ1000V-DSM',auto:false,mat:['PES'],pos:288,tags:['contact','set','disc','double']},
   {n:'YJ800V / YJ800DT / YJ800MLB',auto:false,mat:['PES','PA','PP'],pos:264,tags:['contact','special']}]},
 {id:'jinggong',reg:'CN',country:'CN',city:'Shaoxing, Zhejiang',dom:'chanchao.com.tw',thumb:'vprofile',models:[
   {n:'JGT960M · JGT980M · JGT1000V',auto:false,mat:['PES'],pos:null,tags:['contact','set']}]},
 {id:'jingwei',reg:'CN',country:'CN',city:'Jinzhong, Shanxi',dom:'made-in-china.com',thumb:'vprofile',models:[
   {n:'JWK3604',auto:false,mat:['PES','PA'],pos:null,tags:[]}]},
 {id:'icbt',reg:'EU',country:'FR / UK',city:'Roanne / Macclesfield',dom:'textileworld.com',thumb:'hprofile',models:[
   {n:'ICBT',auto:null,mat:['PA'],pos:null,tags:['legacy','pa','hprof']},
   {n:'Scragg / Rieter-Scragg SDS',auto:null,mat:['PES','PA'],pos:null,tags:['legacy']}]}
];
// tree options: same order as TEXTS[lang].dims[i].o; '__ftt' = main topic (clears the filter)
const DIMK=[['__ftt','air'],['set','he'],['contact','ht'],['vprof','hprof','mprof','shortzone','single'],['manual','autodoff'],['godet','nip','belt','double']];
const PROFK=['vprofile','hprofile','short','single'];
const REG=[['EU','var(--air)'],['JP','var(--heat)'],['CN','var(--bad)'],['IN','var(--hl)']];
const RC=Object.fromEntries(REG);

let scene=Math.max(0,Math.min(NS-1,parseInt(params.get('scene')||'0',10)||0));
const st={heat:'contact',set:'set',tw:'disc',feed:'godet'};
let sel='tw', treeSel=null, prof='vprofile', sortMode='pos';
const flt={reg:'all',auto:'all',q:''};

function segBtns(el,opts,cur,cb){
  el.innerHTML=opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===cur}">${esc(l)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>cb(b.dataset.v));
}
function wrap(text,x,y,max,c,w,s,lines,a='start'){
  // Chinese has no spaces: cut into chunks of characters instead of words
  const str=String(text),cjk=!/\s/.test(str)&&/[　-鿿]/.test(str);
  const words=cjk?(str.match(new RegExp('.{1,'+Math.max(4,Math.floor(max*0.55))+'}','g'))||[]):str.split(' ');
  let out='',line='',n=0;
  const flush=()=>{if(line&&n<lines){out+=TX(x,y+n*(s+3),line.trim(),c,a,w,s);n++}line=''};
  words.forEach(wd=>{if((line+' '+wd).trim().length>max&&line){flush()}line+=' '+wd});flush();return out;
}

// ── scene 0: yarn path of one DTY position
function drawControls(){
  const u=T().ui,c=$('controls');
  const groups=[['heat',u.heater,[['contact',u.optContact],['ht',u.optHt]]],['set',u.yarnType,[['set',u.optSet],['he',u.optHe]]],
    ['tw',u.twister,[['disc',u.optDisc],['belt',u.optBelt]]],['feed',u.feed,[['godet',u.optGodet],['nip',u.optNip]]]];
  c.innerHTML=groups.map(g=>`<div><span class="lbl">${esc(g[1])}</span><div class="seg" id="c-${g[0]}"></div></div>`).join('');
  groups.forEach(([k,,o])=>segBtns($('c-'+k),o,st[k],v=>{st[k]=v;
    sel=k==='heat'?'heat1':k==='set'?(v==='set'?'heat2':'w3'):k==='tw'?'tw':'w1';drawControls();drawPath();showDetail()}));
}
function feedNode(x,y,id,label){
  const g=st.feed==='godet'
   ?`<circle cx="${x}" cy="${y}" r="17" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="4" fill="var(--wind)"/>`
   :`<circle cx="${x-8}" cy="${y}" r="12" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/><circle cx="${x+10}" cy="${y}" r="9" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/>`;
  return `<g class="node" data-id="${id}"><rect x="${x-26}" y="${y-26}" width="52" height="52" rx="10" fill="transparent" stroke="transparent"/>${g}${TP(x,y+40,label)}</g>`;
}
function drawPath(){
  const sv=T().svg,short=st.heat==='ht';
  const hLen=short?150:330, cLen=short?70:150, yTop=60, twx=690;
  const cx2=twx-60, hx2=cx2-cLen-12, hx1=hx2-hLen, x0=hx1-40;
  let s=TP(16,12,sv.zone,'var(--muted)','start',400,11);
  s+=`<line x1="16" y1="18" x2="${twx+30}" y2="18" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  let d=`M60 360 L60 ${yTop+10} L${x0} ${yTop} L${hx1} ${yTop} L${hx2} ${yTop} L${cx2} ${yTop} L${twx} ${yTop} L${twx} 150 L${twx} 190`;
  const w2x=twx, w2y=190;
  const jetx=w2x-120, h2a=w2x-170, h2b=h2a-230, w3x=h2b-50, oilx=w3x+14, windx=160;
  d+=` L${jetx} ${w2y} L${h2a} ${w2y} L${h2b} ${w2y} L${w3x} ${w2y} L${w3x} 290 L${windx} 322 L${windx} 344`;
  s+=`<path d="${d}" fill="none" stroke="var(--line)" stroke-width="7" stroke-linejoin="round"/><path d="${d}" class="yarn" stroke-linejoin="round"/>`;
  // creel
  s+=`<g class="node" data-id="creel"><rect x="28" y="352" width="64" height="58" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
      <ellipse cx="60" cy="368" rx="22" ry="7" fill="#f3c98b" stroke="#b07a2a"/><rect x="38" y="368" width="44" height="26" fill="#f3c98b"/><ellipse cx="60" cy="394" rx="22" ry="7" fill="#e9b36a" stroke="#b07a2a"/>
      ${TP(60,426,sv.creel)}</g>`;
  s+=feedNode(x0,yTop,'w1','W1');
  // primary heater
  s+=`<g class="node" data-id="heat1"><rect x="${hx1}" y="${yTop-16}" width="${hLen}" height="32" rx="6" fill="${short?'#FBD3B5':'#FCE5D3'}" stroke="var(--heat)" stroke-width="1.5"/>
     ${short?`<g opacity=".8">${[...Array(6)].map((_,i)=>`<path d="M${hx1+14+i*24} ${yTop-10} q6 10 0 20" stroke="var(--heat)" fill="none" stroke-width="1.5"/>`).join('')}</g>`:''}
     ${TP(hx1+hLen/2,yTop-24,short?sv.heatHt:sv.heatContact,'var(--heat)')}</g>`;
  // cooling
  s+=`<g class="node" data-id="cool"><rect x="${hx2+12}" y="${yTop-9}" width="${cLen}" height="18" rx="4" fill="#D5F0EF" stroke="var(--cool)" stroke-width="1.5"/>
     ${TP(hx2+12+cLen/2,yTop+30,short?sv.coolActive:sv.coolRail,'var(--cool)')}</g>`;
  // twister
  const ty=118;let tw;
  if(st.tw==='disc')tw=[0,1,2,3,4].map(i=>`<ellipse cx="${twx-10+(i%2)*20}" cy="${ty-30+i*14}" rx="18" ry="5" fill="#E7E1F8" stroke="var(--twist)" stroke-width="1.5"/>`).join('');
  else tw=`<rect x="${twx-34}" y="${ty-28}" width="68" height="12" rx="6" fill="#E7E1F8" stroke="var(--twist)" stroke-width="1.5" transform="rotate(25 ${twx} ${ty})"/><rect x="${twx-34}" y="${ty-4}" width="68" height="12" rx="6" fill="#D6CCF3" stroke="var(--twist)" stroke-width="1.5" transform="rotate(-25 ${twx} ${ty})"/>`;
  const twl=st.tw==='disc'?sv.disc:sv.belt;
  s+=`<g class="node" data-id="tw"><rect x="${twx-40}" y="${ty-44}" width="80" height="84" rx="10" fill="transparent" stroke="transparent"/>${tw}
     ${TP(twx+44,ty-4,twl[0],'var(--twist)','start')}${TP(twx+44,ty+12,twl[1],'var(--twist)','start')}</g>`;
  // twist zone marker
  s+=`<path d="M${hx1} ${yTop+44} L${twx-14} ${yTop+44}" stroke="var(--twist)" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar2)"/>`+
     TP((hx1+twx)/2,yTop+58,sv.twistBack,'var(--twist)','middle',400,11);
  s+=feedNode(w2x,w2y,'w2','W2');
  // jet
  s+=`<g class="node" data-id="jet"><rect x="${jetx-20}" y="${w2y-14}" width="40" height="28" rx="6" fill="#DCEFFA" stroke="var(--air)" stroke-width="1.5"/>
      <path d="M${jetx} ${w2y-26} l0 10 M${jetx-5} ${w2y-21} l5 5 l5 -5" stroke="var(--air)" fill="none" stroke-width="1.5"/>
      ${TP(jetx,w2y+30,sv.jet,'var(--air)')}</g>`;
  // set heater
  if(st.set==='set')s+=`<g class="node" data-id="heat2"><rect x="${h2b}" y="${w2y-12}" width="${h2a-h2b}" height="24" rx="6" fill="#FCE5D3" stroke="var(--heat)" stroke-width="1.5" stroke-dasharray="4 3"/>
      ${TP((h2a+h2b)/2,w2y+30,sv.setHeater,'var(--heat)')}</g>`;
  else s+=TP((h2a+h2b)/2,w2y+30,sv.noSet,'var(--muted)','middle',400,11);
  s+=feedNode(w3x,w2y,'w3','W3');
  s+=`<g class="node" data-id="oil"><circle cx="${oilx}" cy="262" r="14" fill="#FFF3BF" stroke="#E67700" stroke-width="1.5"/>${TP(oilx+22,266,sv.oil,'var(--fg)','start')}</g>`;
  // take-up
  s+=`<g class="node" data-id="wind"><rect x="${windx-44}" y="340" width="88" height="10" rx="3" fill="var(--panel)" stroke="var(--wind)"/>
      <rect x="${windx-40}" y="352" width="80" height="42" rx="12" fill="#E9ECEF" stroke="var(--wind)" stroke-width="1.5"/>
      ${TP(windx,414,sv.wind)}</g>`;
  if(short)s+=TP((60+x0)/2,yTop+22,sv.shorter,'var(--muted)','middle',400,11);
  s=`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="var(--twist)"/></marker><marker id="ar2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8z" fill="var(--twist)"/></marker></defs>`+s;
  const svg=$('pathsvg');svg.innerHTML=s;
  svg.querySelectorAll('.node').forEach(n=>{n.classList.toggle('sel',n.dataset.id===sel);
    n.onclick=()=>{sel=n.dataset.id;drawPath();showDetail()}});
}
function showDetail(){
  const t=T(),c=t.comp[sel];if(!c)return;
  $('detail').innerHTML=`<span class="lbl">${esc(t.ui.component)}</span><h3>${esc(c.t)}</h3>${c.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<p>${esc(c.p)}</p>`+
    (c.l.length?`<ul>${c.l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'')+`<p class="note">${esc(t.ui.tip)}</p>`;
}

// ── scene 1: variant tree
function drawTree(){
  const t=T();
  $('tree').innerHTML=t.dims.map((d,i)=>`<div class="dim"><h4><span class="num">${String(i+1).padStart(2,'0')}</span>${esc(d.t)}</h4>`+
    d.o.map((o,j)=>{const k=DIMK[i][j];return `<div class="opt ${treeSel===k?'hl':''}" data-k="${k}"><b>${esc(o.b)}</b><small>${esc(o.s)}</small></div>`}).join('')+`</div>`).join('');
  $('tree').querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;treeSel=(treeSel===k||k==='__ftt')?null:k;drawTree();drawMfr();
    if(treeSel)go(3);
  });
}
function treeLabel(k){const t=T();for(let i=0;i<DIMK.length;i++){const j=DIMK[i].indexOf(k);if(j>=0)return t.dims[i].o[j].b}return k}

// ── scene 2: machine profiles (cross section)
function profSVG(k){
  const sv=T().svg;
  const lab=(x,y,t,c='var(--fg)',a='middle')=>TX(x,y,t,c,a);
  const creel=(x,y,n=3)=>[...Array(n)].map((_,i)=>`<rect x="${x}" y="${y+i*48}" width="40" height="30" rx="5" fill="#f3c98b" stroke="#b07a2a"/>`).join('');
  const wind=(x,y,n=3)=>[...Array(n)].map((_,i)=>`<rect x="${x}" y="${y+i*44}" width="54" height="30" rx="9" fill="#E9ECEF" stroke="var(--wind)"/>`).join('');
  const person=x=>`<g fill="var(--muted)"><circle cx="${x}" cy="292" r="10"/><rect x="${x-9}" y="304" width="18" height="44" rx="6"/><rect x="${x-8}" y="346" width="7" height="34"/><rect x="${x+1}" y="346" width="7" height="34"/></g>`;
  let s=`<rect x="0" y="380" width="620" height="6" fill="var(--line)"/>`;
  if(k==='vprofile'){
    s+=creel(30,200)+lab(50,190,sv.pCreel);
    s+=wind(200,232)+lab(227,224,sv.pWind);
    s+=person(330)+lab(330,400,sv.pAisle,'var(--muted)');
    s+=`<rect x="470" y="40" width="60" height="340" fill="var(--soft)" stroke="var(--line)"/>`+lab(500,30,sv.pFrame);
    s+=`<line x1="120" y1="40" x2="460" y2="40" stroke="var(--line)" stroke-width="3"/>`+lab(140,30,sv.pPlatform,'var(--muted)','start');
    s+=`<rect x="300" y="70" width="190" height="20" rx="6" fill="#FCE5D3" stroke="var(--heat)" transform="rotate(-28 395 80)"/>`+lab(470,150,sv.pHeat1,'var(--heat)','end');
    s+=`<rect x="250" y="155" width="110" height="12" rx="4" fill="#D5F0EF" stroke="var(--cool)" transform="rotate(-28 305 160)"/>`+lab(250,140,sv.pCool,'var(--cool)');
    s+=`<g>${[0,1,2].map(i=>`<ellipse cx="${262+(i%2)*14}" cy="${196+i*10}" rx="13" ry="4" fill="#E7E1F8" stroke="var(--twist)"/>`).join('')}</g>`+lab(300,214,sv.pTwist,'var(--twist)','start');
    s+=`<rect x="380" y="250" width="16" height="120" rx="5" fill="#FCE5D3" stroke="var(--heat)" stroke-dasharray="4 3"/>`+lab(404,320,sv.pSet,'var(--heat)','start');
    s+=`<path d="M70 200 C110 120 380 40 480 50 L485 60 L285 190 L270 210 L392 250 L392 370 L260 300" class="yarn"/>`;
  }
  if(k==='hprofile'){
    s+=creel(20,210)+lab(40,200,sv.pCreel);
    s+=`<circle cx="110" cy="90" r="12" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/>`+lab(110,70,'W1');
    s+=`<rect x="130" y="82" width="190" height="16" rx="5" fill="#FCE5D3" stroke="var(--heat)"/>`+lab(225,74,sv.pHeater,'var(--heat)');
    s+=`<rect x="326" y="85" width="90" height="10" rx="4" fill="#D5F0EF" stroke="var(--cool)"/>`+lab(371,74,sv.pCooling,'var(--cool)');
    s+=`<g>${[0,1,2].map(i=>`<ellipse cx="438" cy="${80+i*10}" rx="5" ry="13" fill="#E7E1F8" stroke="var(--twist)"/>`).join('')}</g>`+lab(440,128,sv.pTwist,'var(--twist)');
    s+=`<circle cx="490" cy="90" r="12" fill="var(--panel)" stroke="var(--wind)" stroke-width="2"/>`+lab(490,70,'W2');
    s+=`<path d="M120 105 L480 105" stroke="var(--hl)" stroke-dasharray="2 4"/>`+lab(300,124,sv.pStraight,'var(--hl)');
    s+=wind(470,230)+lab(497,222,sv.pWind);
    s+=person(330)+lab(330,400,sv.pAisle,'var(--muted)');
    s+=`<path d="M60 210 L110 102 L490 90 L540 160 L500 230" class="yarn"/>`;
  }
  if(k==='short'){
    s+=creel(20,170,4)+lab(40,160,sv.pCreel);
    s+=wind(190,160,4)+lab(217,150,sv.pDecks);
    s+=person(330)+lab(330,400,sv.pAisle,'var(--muted)');
    s+=`<rect x="470" y="90" width="60" height="290" fill="var(--soft)" stroke="var(--line)"/>`;
    s+=`<rect x="400" y="110" width="100" height="20" rx="6" fill="#FBD3B5" stroke="var(--heat)" transform="rotate(-20 450 120)"/>`+lab(440,82,sv.pHt,'var(--heat)');
    s+=`<rect x="340" y="150" width="46" height="12" rx="4" fill="#D5F0EF" stroke="var(--cool)" transform="rotate(-20 363 156)"/>`+lab(300,140,sv.pActive,'var(--cool)');
    s+=`<g>${[0,1,2].map(i=>`<ellipse cx="${318+(i%2)*14}" cy="${178+i*10}" rx="13" ry="4" fill="#E7E1F8" stroke="var(--twist)"/>`).join('')}</g>`+lab(350,212,sv.pTwist,'var(--twist)','start');
    s+=`<line x1="590" y1="90" x2="590" y2="380" stroke="var(--muted)"/><text x="604" y="235" font-size="12" fill="var(--muted)" transform="rotate(-90 604 235)" text-anchor="middle">${esc(sv.pHeight)}</text>`;
    s+=`<path d="M60 170 C120 100 400 90 495 100 L460 125 L330 180 L320 200 L250 300" class="yarn"/>`;
  }
  if(k==='single'){
    [0,1,2].forEach(i=>{const x=60+i*180;
      s+=`<rect x="${x}" y="60" width="150" height="320" rx="10" fill="var(--panel)" stroke="var(--line)"/>`;
      s+=`<rect x="${x+20}" y="80" width="110" height="34" rx="5" fill="#f3c98b" stroke="#b07a2a"/>`;
      s+=`<rect x="${x+66}" y="130" width="18" height="90" rx="5" fill="#FCE5D3" stroke="var(--heat)"/>`;
      s+=`<g>${[0,1,2].map(j=>`<ellipse cx="${x+75}" cy="${238+j*9}" rx="13" ry="4" fill="#E7E1F8" stroke="var(--twist)"/>`).join('')}</g>`;
      s+=`<circle cx="${x+75}" cy="290" r="15" fill="#FBD3B5" stroke="var(--heat)" stroke-width="2"/>`;
      s+=`<rect x="${x+38}" y="320" width="74" height="40" rx="12" fill="#E9ECEF" stroke="var(--wind)"/>`;
      s+=`<path d="M${x+75} 114 L${x+75} 320" class="yarn"/>`;
      s+=`<rect x="${x+8}" y="68" width="22" height="10" rx="3" fill="var(--hl)"/>`;
      s+=lab(x+75,52,sv.pPos[i]);
    });
    s+=lab(118,180,sv.pHeater,'var(--heat)','end')+lab(118,310,sv.pGodet,'var(--heat)','end');
  }
  return s;
}
function drawProf(){
  const t=T();
  segBtns($('ptabs'),PROFK.map(k=>[k,t.prof[k].tab]),prof,v=>{prof=v;drawProf()});
  $('profsvg').innerHTML=profSVG(prof);
  const p=t.prof[prof],u=t.ui;
  $('profdesc').innerHTML=`<h3>${esc(p.t)}</h3><p>${esc(p.d)}</p><span class="lbl">${esc(u.examples)}</span>${p.ex.map(e=>`<span class="pill">${esc(e)}</span>`).join('')}`+
   `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div><span class="lbl" style="color:#2B7D3C">${esc(u.pros)}</span><ul style="padding-left:16px;margin:0">${p.pro.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`+
   `<div><span class="lbl" style="color:var(--bad)">${esc(u.cons)}</span><ul style="padding-left:16px;margin:0">${p.con.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
}

// ── scene 3: manufacturers & models
function drawFilters(){
  const u=T().ui,f=$('filters');
  f.innerHTML=`<div><span class="lbl">${esc(u.search)}</span><input id="q" placeholder="${esc(u.searchPh)}" value="${esc(flt.q)}"></div>`+
    `<div><span class="lbl">${esc(u.region)}</span><div class="seg" id="f-reg"></div></div>`+
    `<div><span class="lbl">${esc(u.operation)}</span><div class="seg" id="f-auto"></div></div>`;
  segBtns($('f-reg'),[['all',u.all],...REG.map(([r])=>[r,u.reg[r]])],flt.reg,v=>{flt.reg=v;drawFilters();drawMfr()});
  segBtns($('f-auto'),[['all',u.all],['auto',u.autodoff],['man',u.manual]],flt.auto,v=>{flt.auto=v;drawFilters();drawMfr()});
  $('q').oninput=e=>{flt.q=e.target.value.toLowerCase();drawMfr()};
}
function modelOk(m,i,M,X){
  if(flt.auto==='auto'&&m.auto!==true&&!m.tags.includes('autodoff'))return false;
  if(flt.auto==='man'&&m.auto!==false&&!m.tags.includes('manual'))return false;
  if(treeSel&&!m.tags.includes(treeSel)&&!(treeSel==='pa'&&m.mat.includes('PA')))return false;
  if(flt.q){const hay=(X.name+' '+M.city+' '+X.note+' '+X.models[i][0]+' '+X.models[i][1]+' '+m.mat.join(' ')).toLowerCase();if(!hay.includes(flt.q))return false}
  return true;
}
function drawMfr(){
  const t=T(),u=t.ui,tf=$('treefilter');
  if(treeSel){tf.innerHTML=fmt(esc(u.treeFilter),{name:`<b>${esc(treeLabel(treeSel))}</b>`})+`<button type="button" id="clr">${esc(u.reset)}</button>`;
    $('clr').onclick=()=>{treeSel=null;drawTree();drawMfr()}}else tf.innerHTML='';
  const out=[];
  MFR.forEach(M=>{
    if(flt.reg!=='all'&&M.reg!==flt.reg)return;
    const X=t.mfr[M.id];
    const ms=M.models.map((m,i)=>[m,i]).filter(([m,i])=>modelOk(m,i,M,X));if(!ms.length)return;
    out.push(`<div class="mcard"><div class="top"><span class="flag">${esc(M.country)}</span><div><h3>${esc(X.name)}</h3><div class="meta">${esc(M.city)} · ${esc(X.owner)}</div></div></div>`+
      `<div class="thumb"><svg viewBox="0 0 620 420" preserveAspectRatio="xMidYMid meet">${profSVG(M.thumb)}</svg></div>`+
      `<div class="mnote">${esc(X.note)}</div><div class="models">`+
      ms.map(([m,i])=>`<div class="model"><div class="mn">${esc(X.models[i][0])}${m.pos?` <span>· ${esc(fmt(u.upTo,{n:m.pos}))}</span>`:''}</div>`+
        `<div class="ms">${esc(X.models[i][1])}</div><div>`+
        (m.auto===true?`<span class="chip auto">${esc(u.chipAuto)}</span>`:m.auto===false?`<span class="chip man">${esc(u.chipMan)}</span>`:'')+
        (m.tags.includes('legacy')?`<span class="chip lg">${esc(u.chipLegacy)}</span>`:'')+
        m.mat.map(x=>`<span class="chip ${x==='PA'?'pa':x==='PES'?'pes':''}">${x}</span>`).join('')+`</div></div>`).join('')+
      `<div class="srcd">${esc(fmt(u.srcLabel,{d:M.dom}))}</div></div></div>`);
  });
  $('mfr').innerHTML=out.join('')||`<div class="empty">${esc(u.empty)}</div>`;
}

// ── scene 4: positions per machine
function drawBars(){
  const t=T(),u=t.ui;
  segBtns($('c-sort'),[['pos',u.sortPos],['mfr',u.sortMfr]],sortMode,v=>{sortMode=v;drawBars()});
  const rows=[];
  MFR.forEach(M=>{const X=t.mfr[M.id];M.models.forEach((m,i)=>{if(m.pos&&!m.tags.includes('legacy'))
    rows.push({l:`${X.name.split(/ ?[(（]/)[0].split(' /')[0]} · ${m.n.split(' (')[0]}`,v:m.pos,r:M.reg,mf:X.name})})});
  rows.sort(sortMode==='pos'?(a,b)=>b.v-a.v:(a,b)=>a.mf.localeCompare(b.mf)||b.v-a.v);
  const max=600;
  $('bars').innerHTML=rows.map(r=>`<div class="row"><div>${esc(r.l)}</div><div class="track"><div class="fill" style="width:${r.v/max*100}%;background:${RC[r.r]}"></div></div><div class="v">${r.v}</div></div>`).join('');
  $('legend').innerHTML=REG.map(([r,c])=>`<span><i style="background:${c}"></i>${esc(u.reg[r])}</span>`).join('');
  $('barsnote').textContent=u.barsNote;
}

// ── scene 5: market
function drawMarket(){
  const t=T();
  $('timeline').innerHTML=t.timeline.map(([y,x])=>`<div class="tev"><b>${esc(y)}</b><div>${esc(x)}</div></div>`).join('');
  $('assesst').textContent=t.ui.assess;
  $('assess').innerHTML=t.assess.map(([b,x])=>`<li><b>${esc(b)}</b> ${esc(x)}</li>`).join('');
}

function openModule(key){
  if(EMBED){document.title='open:'+key;return}
  location.href=key+'.html?lang='+encodeURIComponent(lang);
}

// ── scenes / language
function go(i){
  scene=(i+NS)%NS;
  for(let k=0;k<NS;k++)$('sc'+k).classList.toggle('on',k===scene);
  $('scenes').querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-pressed',k===scene));
  const sc=T().scenes[scene];$('ctitle').textContent=sc.title;$('ctext').textContent=sc.text;
  if(EMBED)document.title='scene:'+scene;
}
function applyLang(){
  const t=T(),u=t.ui;document.documentElement.lang=lang;
  $('eyebrow').textContent=u.eyebrow;$('h1').textContent=u.h1;$('lead').textContent=u.lead;$('note').textContent=u.note;
  $('srcsum').textContent=u.sources;$('srclist').innerHTML=t.sources.map(x=>`<li>${esc(x)}</li>`).join('');
  $('pathsvg').setAttribute('aria-label',t.scenes[0].title);$('profsvg').setAttribute('aria-label',t.scenes[2].title);
  $('lkdty').innerHTML=`<b>${esc(u.linkDty)}</b><span>${esc(u.linkDtyHint)}</span>`;
  $('scenes').innerHTML=t.scenes.map((s,i)=>`<button type="button" data-i="${i}">${esc(s.k)}</button>`).join('');
  $('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $('langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  drawControls();drawPath();showDetail();drawTree();drawProf();drawFilters();drawMfr();drawBars();drawMarket();go(scene);
}
$('lkdty').onclick=()=>openModule(LINK_KEYS[0]);
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
applyLang();
})();
</script>
</body>
