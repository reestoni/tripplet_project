<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCF Spinning</title>
<!-- Onboarding-Modul (ui/screen_onboarding.py), gleiches Muster wie dty_intermingling.html.
     Texte in bcf_spinning_texts.js (de/en/es/zh). ?lang=xx, window.setLang('xx'), window.goScene(i),
     ?embedded=1 (ohne eigenen Kopf/Szenen-Knoepfe, meldet die Szene per document.title "scene:n"),
     ?scene=n&paused=1&station=n fuer Screenshots. Keine externen Ressourcen. Szenen wechseln nie automatisch.
     Szene 1: Erklaerung im Kasten rechts oben. -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --yarn:#6E6556;--yarn-rgb:110,101,86;--air:#2386C8;--air-rgb:35,134,200;--heat:#E07B39;--hl:#39A650;
  --melt:#E08A2E;--poy:#C08A1E;--fdy:#2E9C7A;--fdy-rgb:46,156,122;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:70ch}
.langs{display:flex;gap:4px;flex-shrink:0}
.langs[hidden]{display:none}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:16/9}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.scenes{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.scenes button span{font-family:var(--font-mono);font-size:12px;opacity:.7}
.right{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.slider{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.slider[hidden]{display:none}
.slider input{accent-color:var(--hl);width:160px}
.slider output{min-width:6.5em;color:var(--fg)}
.play{min-width:120px;justify-content:center}
.caption{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;border-top:1px solid var(--line);padding-top:16px}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 8px}
.caption p{margin:0 0 10px;max-width:70ch}
.now{font-family:var(--font-mono);font-size:13px;color:var(--hl);min-height:1.5em}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.facts li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.facts b{font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.note{font-size:12px;color:var(--muted);margin:0}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:760px){.caption{grid-template-columns:1fr;gap:14px}.facts li{grid-template-columns:96px minmax(0,1fr)}header{flex-direction:column}}
</style>
<script src="bcf_spinning_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="stage"><canvas id="cv" width="1600" height="900"></canvas></div>
  <div class="controls">
    <div class="scenes" id="scenes" role="group"></div>
    <div class="right">
      <label class="slider" id="mwrap"><span id="mlab"></span>
        <input id="mixr" type="range" min="0" max="1" step="0.01" value="0.5"><output id="mout"></output></label>
      <button class="play" id="play" type="button"></button>
    </div>
  </div>
  <section class="caption" aria-live="polite">
    <div><h2 id="ctitle"></h2><p class="now" id="cnow"></p><p id="ctext"></p></div>
    <ul class="facts" id="cfacts"></ul>
  </section>
  <p class="note" id="note"></p>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');const W=1600,H=900;
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={bg:css('--panel'),line:css('--line'),fg:css('--fg'),muted:css('--muted'),yarn:css('--yarn'),air:css('--air'),heat:css('--heat'),hl:css('--hl'),
  melt:css('--melt'),poy:css('--poy'),fdy:css('--fdy')};
const YRGB=css('--yarn-rgb'),ARGB=css('--air-rgb'),FRGB=css('--fdy-rgb');
const MONO=css('--font-mono'),DISP=css('--font-display'),SANS=css('--font-body');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const params=new URLSearchParams(location.search);
let lang=(params.get('lang')||'de');if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const T=()=>TEXTS[lang];
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
let fitW=0;function fit(){const w=cv.getBoundingClientRect().width||W;if(w===fitW&&cv.width>0)return;fitW=w;const d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(w*d));cv.height=Math.max(1,Math.round(w*9/16*d))}
addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);fit();
const smooth=(a,b,x)=>{const q=Math.max(0,Math.min(1,(x-a)/(b-a)));return q*q*(3-2*q)},lerp=(a,b,q)=>a+(b-a)*q;
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(c1,c2,q)=>{const a=hx(c1),b=hx(c2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],q))).join(',')})`};
const hsh=(a,b,c)=>{const v=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return v-Math.floor(v)};

/* Stationen: nur Geometrie (a = Textausrichtung), Texte aus TEXTS[lang].stations */
const ST=[{x:245,y:203,lx:245,ly:150},{x:525,y:126,lx:610,ly:110,a:'left'},{x:525,y:300,lx:560,ly:300,a:'left'},{x:525,y:440,lx:440,ly:440,a:'right'},
 {x:525,y:492,lx:440,ly:492,a:'right'},{x:745,y:545,lx:690,ly:640},{x:930,y:420,lx:900,ly:330},{x:1030,y:560,lx:1030,ly:700},
 {x:1290,y:620,lx:1290,ly:560},{x:1450,y:775,lx:1450,ly:840}];
const NSC=6;

/* ---------- UI ---------- */
const sceneEl=$('scenes'),play=$('play'),min=$('mixr');
/* auto = Bewegung laeuft (Pause friert sie ein). Szenen wechseln nie von selbst. */
let scene=0,sceneT=0,auto=!reduce,t=0,MIX=.5,selSt=-1,hoverSt=-1;
function setPlay(){play.setAttribute('aria-pressed',auto);play.textContent=auto?T().ui.pause:T().ui.play}
play.onclick=()=>{auto=!auto;setPlay()};
min.oninput=()=>{MIX=+min.value;const u=T().ui;$('mout').textContent=MIX<.33?u.low:MIX<.66?u.mid:u.high};
function showStation(){const S=T().stations;
  $('cnow').textContent=scene!==0?'':selSt>=0?`▸ ${S[selSt].n}: ${S[selSt].d}`:`▸ ${T().ui.clickHint}`}
function go(i){const n=(i+NSC)%NSC;if(n!==scene){selSt=-1;hoverSt=-1}scene=n;sceneT=0;if(EMBED)document.title='scene:'+scene;
  [...sceneEl.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===scene));
  const s=T().scenes[scene];$('ctitle').textContent=`${scene+1}  ·  ${s.title}`;$('ctext').textContent=s.text;
  $('cfacts').innerHTML='';s.facts.forEach(f=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=f[0];const sp=document.createElement('span');sp.textContent=f[1];li.append(b,sp);$('cfacts').appendChild(li)});
  showStation();$('mwrap').hidden=scene!==4}
function applyLang(){const u=T().ui;document.documentElement.lang=lang;
  ['eyebrow','h1','lead','note'].forEach(k=>$(k).textContent=u[k]);$('mlab').textContent=u.mix;
  sceneEl.setAttribute('aria-label',u.scenes);sceneEl.innerHTML='';
  T().scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span>${i+1}</span>`;b.append(s.k);b.onclick=()=>go(i);sceneEl.appendChild(b)});
  [...$('langs').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  min.oninput();setPlay();const keep=sceneT;go(scene);sceneT=keep}
function stName(i){const s=T().stations[i];return `${i+1}  ${s.s||s.n}`}
function hitStation(ev){const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height;
  for(let i=0;i<ST.length;i++){const p=ST[i];if(Math.hypot(x-p.x,y-p.y)<34)return i;
    ctx.font=`500 18px ${MONO}`;const w=ctx.measureText(stName(i)).width;const x0=p.a==='left'?p.lx-8:p.a==='right'?p.lx-w-8:p.lx-w/2-8,x1=p.a==='left'?p.lx+w+8:p.a==='right'?p.lx+8:p.lx+w/2+8;
    if(x>=x0&&x<=x1&&Math.abs(y-p.ly)<16)return i}return -1}
cv.addEventListener('mousemove',ev=>{if(scene!==0){cv.style.cursor='';return}hoverSt=hitStation(ev);cv.style.cursor=hoverSt>=0?'pointer':''});
cv.addEventListener('mouseleave',()=>{hoverSt=-1;cv.style.cursor=''});
cv.addEventListener('click',ev=>{if(scene!==0)return;const i=hitStation(ev);selSt=(i===selSt)?-1:i;showStation()});
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(scene+1);if(e.key==='ArrowLeft')go(scene-1);if(e.key===' '){e.preventDefault();auto=!auto;setPlay()}});

/* ---------- Helfer ---------- */
function label(s,x,y,o={}){ctx.font=`${o.w||500} ${o.s||20}px ${o.f||MONO}`;ctx.fillStyle=o.c||C.muted;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.globalAlpha=o.al??1;ctx.fillText(s,x,y);ctx.globalAlpha=1}
function leader(x1,y1,x2,y2,c){ctx.strokeStyle=c||C.line;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function wrap(txt,maxW){const parts=/\s/.test(txt)?txt.split(/(\s+)/):[...txt];const lines=[];let cur='';
  parts.forEach(w=>{const tryS=cur+w;if(ctx.measureText(tryS).width>maxW&&cur.trim()&&!/^[，。、；：）！？,.;:)]/.test(w)){lines.push(cur.trim());cur=w.trimStart()}else cur=tryS});
  if(cur.trim())lines.push(cur.trim());return lines}
/* Erklaerung im Kasten rechts */
function sideBox(head,body){const x=1170,y=100,w=390,h=270;
  ctx.fillStyle=head?'#E9F6E9':'#F4F6F3';ctx.strokeStyle=head?C.hl:C.line;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();ctx.stroke();
  let ty=y+30;if(head){ctx.font=`700 22px ${SANS}`;wrap(head,w-32).forEach(l=>{label(l,x+16,ty,{a:'left',s:22,c:C.hl,f:SANS,w:700});ty+=30});ty+=6}
  ctx.font=`400 19px ${SANS}`;wrap(body,w-32).slice(0,8).forEach(l=>{label(l,x+16,ty,{a:'left',s:19,c:head?C.fg:C.muted,f:SANS,w:400});ty+=26})}
function godet(x,y,r,o={}){if(o.heat){const g=ctx.createRadialGradient(x,y,r*.4,x,y,r*1.6);g.addColorStop(0,`rgba(224,123,57,${o.heat*.45})`);g.addColorStop(1,'rgba(224,123,57,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.6,0,7);ctx.fill()}
  ctx.lineWidth=3;ctx.strokeStyle=o.hl?C.hl:o.heat?C.heat:C.muted;ctx.fillStyle=C.bg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  for(let k=0;k<3;k++){const a=t*(o.spd||4)+k*2.094;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.8);ctx.stroke()}}
function flow(pts,col,w,spd){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=Math.max(1,w-1);ctx.setLineDash([10,16]);ctx.lineDashOffset=-t*spd;ctx.stroke();ctx.setLineDash([])}
function winder(x,y,col,hl){ctx.fillStyle='#EEF1ED';ctx.strokeStyle=hl?C.hl:C.muted;ctx.lineWidth=hl?3:2;ctx.beginPath();ctx.roundRect(x-110,y-10,220,90,8);ctx.fill();ctx.stroke();
  for(let k=0;k<3;k++){const px=x-70+k*70,g=14+((t*3)%14);ctx.fillStyle=col;ctx.globalAlpha=.85;ctx.beginPath();ctx.roundRect(px-24,y-10-g-26,48,g+26,6);ctx.fill();ctx.globalAlpha=1}
  const tr=x+60*Math.sin(t*5);ctx.fillStyle=C.fg;ctx.fillRect(tr-3,y-6,6,10)}
function quench(x0,x1,y0,y1,a=1){ctx.fillStyle=`rgba(${ARGB},${.07*a})`;ctx.fillRect(x0,y0,x1-x0,y1-y0);
  for(let k=0;k<26;k++){const yy=y0+((k*37)%(y1-y0)),xx=x1-((t*120+k*53)%(x1-x0+40));if(xx<x0)continue;ctx.fillStyle=`rgba(${ARGB},${.6*a})`;ctx.beginPath();ctx.arc(xx,yy,2.4,0,7);ctx.fill()}}
/* Molekuelketten: phi 0 = Knaeuel, 1 = ausgerichtet; cry = Anteil kristalliner Bereiche */
function mol(x,y,w,h,phi,cry,seed,title){ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.clip();ctx.fillStyle='#FAFBFA';ctx.fillRect(x,y,w,h);
  const n=16;for(let i=0;i<n;i++){let px=x+hsh(i,seed,1)*w,py=y+12+(i+.5)/n*(h-24),ang=(hsh(i,seed,2)-.5)*6.28*(1-phi);
    ctx.strokeStyle=`rgba(${YRGB},${.55+.3*hsh(i,seed,3)})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px-w*.6,py);
    let qx=px-w*.6,qy=py;for(let s=0;s<60;s++){ang+=(hsh(i,s,seed)-.5)*1.6*(1-phi)-ang*.15*phi;ang+=.02*Math.sin(t*2+i+s)*(1-phi);qx+=Math.cos(ang)*9;qy+=Math.sin(ang)*9*(1-.5*phi);qy=Math.max(y+4,Math.min(y+h-4,qy));ctx.lineTo(qx,qy)}ctx.stroke()}
  const nc=Math.round(cry*7);for(let k=0;k<nc;k++){const cx=x+30+hsh(k,seed,7)*(w-90),cy=y+20+hsh(k,seed,8)*(h-60);ctx.fillStyle=`rgba(${FRGB},.15)`;ctx.strokeStyle=C.fdy;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(cx,cy,56,30,4);ctx.fill();ctx.stroke();
    for(let l=0;l<4;l++){ctx.beginPath();ctx.moveTo(cx+4,cy+6+l*6);ctx.lineTo(cx+52,cy+6+l*6);ctx.stroke()}}
  ctx.restore();ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.stroke();if(title)label(title,x,y-20,{a:'left',s:17,c:C.fg,f:SANS,w:600})}
function bar(x,y,w,v,max,col,lb,val){label(lb,x,y-16,{a:'left',s:15,f:SANS});ctx.fillStyle=C.line;ctx.fillRect(x,y,w,12);ctx.fillStyle=col;ctx.fillRect(x,y,w*Math.min(1,v/max),12);label(val,x+w+12,y+6,{a:'left',s:16,c:C.fg})}
const eg=x=>fmt(T().cv.eg,{x});

const TRI=['#D9607C',C.fdy,C.poy];
function jetBox(x,y,type,al=1){ctx.globalAlpha=al;ctx.fillStyle='#DCE8F0';ctx.strokeStyle=type==='mig'?C.melt:C.air;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x-20,y-14,40,28,5);ctx.fill();ctx.stroke();
  ctx.strokeStyle=C.air;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x,y-30);ctx.stroke();for(let k=0;k<2;k++){const yy=y-30+((t*40+k*8)%16);ctx.fillStyle=C.air;ctx.beginPath();ctx.arc(x,yy,2.5,0,7);ctx.fill()}ctx.globalAlpha=1}
function bundleJet(x0,x1,jx,cy,mode){const N=10;
  ctx.fillStyle='#DCE8F0';ctx.strokeStyle=mode==='mig'?C.melt:C.air;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(jx-70,cy-50,140,100,8);ctx.fill();ctx.stroke();
  ctx.fillStyle=C.bg;ctx.fillRect(jx-72,cy-18,144,36);ctx.fillRect(jx-9,cy-80,18,62);
  ctx.strokeStyle=C.air;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(jx,cy-110);ctx.lineTo(jx,cy-80);ctx.stroke();
  for(let k=0;k<(mode==='mig'?3:6);k++){const yy=cy-110+((t*(mode==='mig'?40:90)+k*15)%95);ctx.fillStyle=C.air;ctx.beginPath();ctx.arc(jx,yy,3,0,7);ctx.fill()}
  const sh=t*70,L=150;
  for(let i=0;i<N;i++){const lane=(i/(N-1)-.5)*2;ctx.strokeStyle=`rgba(${YRGB},.8)`;ctx.lineWidth=1.8;ctx.beginPath();
    for(let x=x0;x<=x1;x+=3){const b=Math.exp(-((x-jx)**2)/(2*40*40));let y=cy+lane*9;
      if(mode==='mig')y+=lane*14*b+3*b*Math.sin(t*14+i*1.3+x*.05);
      else{y+=lane*20*b+8*b*Math.sin(t*16+i*1.9+x*.07);const a=smooth(jx+30,jx+110,x);if(a>0){const s=x-sh,m=((s%L)+L)%L,dk=Math.min(m,L-m),tight=Math.exp(-(dk*dk)/(2*14*14));
        const yk=cy+(1-.85*tight)*lane*12*Math.cos(i+s*.02)+tight*5*Math.sin(i*2.1+s*.25);y=y*(1-a)+yk*a}}
      x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
  if(mode==='mig')for(let k=0;k<70;k++){const xs=((k*29+sh)%(x1-x0))+x0,lane=hsh(k,3,1)*2-1;const inside=smooth(jx-40,jx+60,xs),side=lane>0?1:-1;
    const yOut=cy+side*(9+3*hsh(k,3,2)),yIn=cy+lane*9;const y=yOut*(1-inside)+yIn*inside;ctx.fillStyle=C.melt;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(xs,y,2.6,0,7);ctx.fill();ctx.globalAlpha=1}}

/* ---------- Bausteine ---------- */
function crimp(x0,x1,cy,n,sh,o={}){const amp=o.amp??10,fr=o.fr??.18;for(let i=0;i<n;i++){ctx.strokeStyle=o.cols?o.cols(i):(o.col||C.yarn);ctx.lineWidth=o.lw||1.8;ctx.globalAlpha=.85;ctx.beginPath();
  for(let x=x0;x<=x1;x+=2){const s=x+sh,ph=i*1.9,zz=Math.abs(((s*fr*.9+ph)/Math.PI)%2-1)*2-1;const y=cy+(i-(n-1)/2)*(o.sp??3)+amp*(.6*zz+.4*Math.sin(s*fr*2.3+ph*1.7))*(o.env?o.env(s):1);x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}ctx.globalAlpha=1}
