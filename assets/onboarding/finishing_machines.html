<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finishing Machines</title>
<!-- Knowledge Base module (ui/screen_onboarding.py), category finishing.
     Content from the user's research page "Ausruestungsmaschinen - Funktionsprinzipien und Hersteller" (as of Nov 2026).
     Texts in finishing_machines_texts.js (de/en/es/zh). ?lang=xx, window.setLang('xx'), window.goScene(i),
     ?embedded=1 (no own header/scene buttons, reports the scene via document.title "scene:n"),
     ?scene=n&paused=1&machine=<id> for screenshots. No external resources (sources as plain text only).
     Links to other modules (LINK_KEYS): embedded via document.title "open:<key>", otherwise <key>.html directly.
     No canvas - SVG/DOM; machine schemas are animated with CSS (pause button stops them). -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --hl:#39A650;--air:#2386C8;--heat:#E07B39;--cool:#2386C8;--twist:#6A4FC8;--soft:#EEF3EC;
  --fab:#1864AB;--pin:#C62828;--ok:#1F7A36;--wind:#495057;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:80ch}
.langs,.scenes{display:flex;gap:6px;flex-wrap:wrap}
.langs[hidden]{display:none}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 6px}
.caption p{margin:0;color:var(--muted);max-width:90ch}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font-body)}
.sc{display:none;flex-direction:column;gap:12px}
.sc.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.card h3{font-family:var(--font-display);font-size:22px;margin:2px 0 6px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg.sm button{font-size:13px;padding:5px 10px}
.lbl{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.note{font-size:12px;color:var(--muted);margin:0}
.muted{color:var(--muted);font-size:13px;margin:0}
/* 0 line + kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font-family:var(--font-display);font-size:27px;line-height:1.1;color:var(--ok)}
.kpi span{color:var(--muted);font-size:13px}
.node{cursor:pointer}
.node:hover rect{stroke:var(--hl);stroke-width:2.5}
.node.sel rect{stroke:var(--hl);stroke-width:3}
/* 1 machines: animation */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes flowS{to{stroke-dashoffset:-8}}
@keyframes airf{to{stroke-dashoffset:-14}}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(34px);opacity:0}}
.rot{transform-box:view-box;animation:spin 4s linear infinite}
.rot.rev{animation-direction:reverse}
.rot.fast{animation-duration:1.2s}
.fab{fill:none;stroke:var(--fab);stroke-width:4;stroke-dasharray:10 6;animation:flow 1s linear infinite;stroke-linejoin:round}
.fab2{fill:none;stroke:var(--fab);stroke-width:5;stroke-dasharray:4 4;animation:flowS 1.4s linear infinite}
.air{fill:none;stroke:var(--heat);stroke-width:2;stroke-dasharray:5 4;animation:airf .8s linear infinite}
.air.c{stroke:var(--cool)}
.drop{animation:drop 1.2s linear infinite}
body.paused .rot,body.paused .fab,body.paused .fab2,body.paused .air,body.paused .drop{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.rot,.fab,.fab2,.air,.drop{animation:none}}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.mhead h3{margin:0}
.mhead .de{color:var(--muted);font-size:13.5px}
#msvg,#asvg,#csvg{background:var(--bg);border-radius:6px}
.steps{counter-reset:s;list-style:none;padding:0;margin:4px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 4px 30px;font-size:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0}
.figs div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.figs b{display:block;font-size:17px;color:var(--ok);font-family:var(--font-display)}
.figs span{font-size:12px;color:var(--muted)}
.st{font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.st.h{border-color:var(--ok);color:var(--ok)}
.st.p{border-color:var(--fab);color:var(--fab)}
.st.m{border-color:var(--muted);color:var(--muted)}
.legendrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);align-items:center;margin:2px 0 6px}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
table.t tr:last-child td{border-bottom:0}
/* 2 comparisons */
.ctl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:8px 0}
.ctl label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.ctl input[type=range]{width:200px;accent-color:var(--hl)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.cmp .c{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;border-top:4px solid var(--hl)}
.cmp .c h4{margin:0 0 4px;font-size:15px}
.cmp .c p{margin:4px 0;font-size:13.5px}
.cmp .c .k{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cpanel{display:none}
.cpanel.on{display:block}
/* 3 matrix */
table.mx{border-collapse:collapse;width:100%;font-size:13px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center}
table.mx th{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;vertical-align:bottom}
table.mx th[data-id]{cursor:pointer}
table.mx th[data-id]:hover{color:var(--ok)}
table.mx td:first-child,table.mx th:first-child,table.mx td:nth-child(2),table.mx th:nth-child(2){text-align:left}
table.mx td.y{color:var(--ok);font-weight:700}
table.mx td.l{color:var(--muted)}
table.mx tr:hover td{background:#F0F7F2}
table.mx th.hl,table.mx td.hl{background:#E6F2E9}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lk{display:block;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.lk:hover{border-color:var(--hl)}
.lk b{display:block;font-size:16px;margin-bottom:2px;color:var(--ok)}
.lk span{font-size:13px;color:var(--muted)}
.lk em{display:block;font-style:normal;font-size:12px;color:var(--hl);margin-top:6px;font-family:var(--font-mono)}
details{font-size:12px;color:var(--muted)}
details ol{columns:2;column-gap:28px;margin:8px 0 0}
details li{break-inside:avoid;margin-bottom:4px}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:820px){header{flex-direction:column}details ol{columns:1}.grid2{grid-template-columns:1fr}}
</style>
<script src="finishing_machines_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="scenes" id="scenes" role="group"></div>
  <section class="caption" aria-live="polite"><h2 id="ctitle"></h2><p id="ctext"></p></section>

  <!-- 0 finishing line -->
  <div class="sc" id="sc0">
    <div class="kpis" id="kpis"></div>
    <div class="stage"><svg id="linesvg" viewBox="0 0 1100 250" role="img"></svg></div>
    <p class="muted" id="linehint"></p>
  </div>
  <!-- 1 machines in detail -->
  <div class="sc" id="sc1">
    <div class="seg sm" id="mtabs"></div>
    <div class="card">
      <div class="mhead"><div><h3 id="mname"></h3><div class="de" id="mde"></div></div>
        <button type="button" id="pause"></button></div>
      <div class="seg sm" id="mvar" style="margin-top:10px"></div>
      <svg id="msvg" viewBox="0 0 760 320" role="img" style="margin-top:8px"></svg>
      <div class="grid2" style="margin-top:12px">
        <div><span class="lbl" id="howlbl"></span><ol class="steps" id="msteps"></ol></div>
        <div><span class="lbl" id="figlbl"></span><div class="figs" id="mfigs"></div></div>
      </div>
      <span class="lbl" style="margin-top:10px" id="mklbl"></span>
      <div class="legendrow" id="stlegend"></div>
      <div class="tblwrap"><table class="t" id="mtab"></table></div>
      <p class="note" id="mnote" style="margin-top:8px"></p>
    </div>
  </div>
  <!-- 2 differences between manufacturers -->
  <div class="sc" id="sc2">
    <div class="seg sm" id="ctabs"></div>
    <div class="card cpanel" id="cpA">
      <h3 id="atitle"></h3><p class="note" id="anote"></p>
      <div class="ctl"><div class="seg sm" id="aseg"></div>
        <label><span id="arlbl"></span> <input type="range" id="aratio" min="20" max="80" value="50"><b id="aratiov">50 %</b></label></div>
      <svg id="asvg" viewBox="0 0 1000 295" role="img"></svg>
      <div class="cmp" id="atxt"></div>
    </div>
    <div class="card cpanel" id="cpB">
      <h3 id="btitle"></h3>
      <div class="cmp" id="btxt"></div>
    </div>
    <div class="card cpanel" id="cpC">
      <h3 id="ctitle2"></h3><p class="note" id="cnote"></p>
      <div class="ctl"><label><span id="cplbl"></span> <input type="range" id="cp" min="10" max="100" value="60"><b id="cpv">60 %</b></label></div>
      <svg id="csvg" viewBox="0 0 1000 300" role="img"></svg>
      <div class="cmp" id="ctxt"></div>
    </div>
    <div class="card cpanel" id="cpD">
      <h3 id="dtitle"></h3>
      <div class="tblwrap"><table class="t" id="dtab"></table></div>
      <p class="note" id="dnote" style="margin-top:8px"></p>
    </div>
  </div>
  <!-- 3 manufacturer matrix -->
  <div class="sc" id="sc3">
    <div class="card tblwrap"><table class="mx" id="mx"></table></div>
    <div class="links" id="links"></div>
  </div>

  <p class="note" id="note"></p>
  <details><summary id="srcsum"></summary><ol id="srclist"></ol></details>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let lang=params.get('lang')||'de';if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const T=()=>TEXTS[lang];
const NSC=4;
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// rough text width (CJK = 1 em) - used to shrink / wrap SVG labels that would overflow their slot
const CJK=/[⺀-鿿＀-￯　-〿]/;
const textW=(t,s,w)=>{let n=0;for(const ch of String(t))n+=CJK.test(ch)?1:/[A-Z0-9%]/.test(ch)?.64:ch===' '?.3:.54;return n*s*(w>=600?1.05:1)};
const TX=(x,y,t,c='var(--fg)',a='middle',w=600,s=12,max=0)=>{
  let sz=s,adj='';
  if(max){const e=textW(t,s,w);if(e>max){sz=Math.max(s*.8,s*max/e);if(textW(t,sz,w)>max)adj=` textLength="${max}" lengthAdjust="spacingAndGlyphs"`}}
  return `<text x="${x}" y="${y}" font-size="${+sz.toFixed(1)}" text-anchor="${a}" fill="${c}" font-weight="${w}"${adj}>${esc(t)}</text>`;
};
// wrap into lines of at most max px (CJK may break between any two characters)
const wrap=(t,s,max,w)=>{
  const tok=String(t).match(/[⺀-鿿＀-￯　-〿]|[^\s⺀-鿿＀-￯　-〿]+|\s+/g)||[];
  const out=[];let cur='';
  tok.forEach(k=>{if(cur.trim()&&textW((cur+k).trim(),s,w)>max){out.push(cur.trim());cur=k.trimStart()}else cur+=k});
  if(cur.trim())out.push(cur.trim());return out;
};
// multi-line label; va = top (first line at y) | mid (block centred on y) | bottom (last line at y)
const TW=(x,y,t,max,c='var(--muted)',a='middle',w=400,s=11,lh=13,va='top')=>{
  const L=wrap(t,s,max,w),y0=va==='mid'?y-(L.length-1)*lh/2:va==='bottom'?y-(L.length-1)*lh:y;
  return L.map((l,i)=>TX(x,y0+i*lh,l,c,a,w,s,max)).join('');
};
const Tm=(x,y,t,a='middle',max=0)=>TX(x,y,t,'var(--muted)',a,400,11,max);

// ── language-neutral data (texts in finishing_machines_texts.js, same order)
const MID=['foulard','hotflue','spann','sanfor','kompakt','kalander','rauen','dekatur','tumbler','beschicht'];
const TOP=['foulard','hotflue','spann','sanfor','kompakt','kalander'],BOT=['rauen','dekatur','tumbler','beschicht'];
// evidence per manufacturer row (TEXTS.m[i].mk, same order): h manufacturer, p trade press, m market list only
const MKS={foulard:'phhhhh',hotflue:'h',spann:'hhhhpm',sanfor:'hphh',kompakt:'hhhhp',kalander:'hh',rauen:'phm',dekatur:'p',tumbler:'hph',beschicht:'hph'};
const MX=[["Brückner","DE",{spann:1,beschicht:1}],["Monforts","DE",{foulard:1,hotflue:1,spann:1,sanfor:1,beschicht:1}],["Monforts Fong's","HK/CN",{spann:1}],
 ["Santex Rimar","CH/IT",{spann:1,sanfor:1,kompakt:1,tumbler:1}],["Sperotto Rimar (Santex Rimar Group)","IT",{sanfor:1,kompakt:1,dekatur:1}],
 ["Andritz (Küsters, ramisch)","AT/DE",{foulard:1,kalander:1}],["Navis TubeTex","US",{foulard:1,spann:1,kompakt:1,tumbler:1}],
 ["Ferraro","IT",{foulard:1,sanfor:1,kompakt:1,kalander:1}],["Lafer","IT",{kompakt:1,rauen:1}],["Xetma Vollenweider","CH/DE",{rauen:1}],
 ["Zimmer Austria","AT",{beschicht:1}],["Biancalani","IT",{tumbler:1}],["Suchy","DE",{foulard:1}],["Beta Machinery","IT",{foulard:1}],
 ["Il Sung","KR",{spann:2}],["Harish Tex-Mach","IN",{spann:2}],["DMS Dilmenler","TR",{spann:2}]];
const AK=[['br','Brückner SPLIT-FLOW'],['mo','Monforts TwinAir'],['sa','Santex AERO-SURF']];
const LINK_KEYS=['mechanical_finishing','chemical_finishing'];
const SOURCES=['German Pavilion – Brückner POWER-FRAME, Split-Flow, dual heating (german-pavilion.com)','Techtextil – Brückner SFP-4, up to 35 % savings (messefrankfurt.com)',
  'TEXtalks – Brückner thermal zones every 1.5 m (textalks.com)','Textile World – Todtnau Bernauer, alternating thermal zones (textileworld.com)',
  'texdata – SFP-4 at ITMA 2023 (electric/H₂ heating) (texdata.com)','Kitmondo – Brückner SFP 2018, 8 fields of 3 m, 80 m/min (kitmondo.com)',
  'Innovation in Textiles – Montex 8000, TwinAir, Thermal Split +30 °C (innovationintextiles.com)','Indian Textile Journal – Montex 8500, split up to 70 °C, Montex XXL (indiantextilejournal.com)',
  'Textile World – Montex XXL 7 m, CADstream nozzles (textileworld.com)','Textile World – Eco Booster HRC up to 35 % (textileworld.com)',
  'texdata – Monforts: 80 % share in Pakistan, Montex®Coat (texdata.com)','ATE – Monforts Fong\'s Montex 6500c (ategroup.com)',
  'Indian Textile Magazine – Santaframe, air cushion, heating above the fabric web (indiantextilemagazine.in)','texdata – Santex ESC up to 25 %, Santacompact RD Plus (texdata.com)',
  'Indian Textile Journal – Santaframe, late 1990s (indiantextilejournal.com)','Monforts – Matex padder (monforts.de)',
  'Fibre2Fashion – Küsters S-Roll, 12–50 N/mm (fibre2fashion.com)','DirectIndustry – S-Roll without crowning (directindustry.com)',
  'Beta Machinery – Beta-Roll, crowned roll only at design pressure (issuu.com)','Suchy – padder up to 6000 mm, active deflection compensation (suchy-textil.de)',
  'Monforts/ATE – Thermex 6500/7000 brochure (ategroup.com)','Textile World – Thermex 6500, Econtrol Knit (textileworld.com)',
  'Textile World – Thermex 6500, 51 m, Exxotherm (textileworld.com)','Monforts – shrinkage ranges Monfortex/Toptex (monforts.de)',
  'Monforts – rubber-belt shrinking ranges (monforts.de)','texdata – Sperotto Rimar Compas, indirect cooling (texdata.com)',
  'Rieter/Accotex – shrinkage rubber belts (rieter.com)','Santex Rimar – company presentation (Santacompact, Santasynpact) (slideshare.net)',
  'Navis TubeTex – C-2500 MC+ brochure (messefrankfurt.com)','Navis TubeTex – Pak Nit II e3+ (plantautomation-technology.com)',
  'Textile World – Navis at Pinto (P5V, TM-100) (textileworld.com)','Textile Study Center – compactors, shoe parameters (textilestudycenter.com)',
  'Machines Italia – Ferraro range (machinesitalia.org)','Ferraro – catalogue (machinesitalia.org)',
  'Lafer – felt compactors (directindustry.com)','Lafer – raising machines (directindustry.com)',
  'Atoka – Lafer SpA company data (atoka.io)','Gi-Tex – Lafer GRV90, 2×24 raising rollers (gi-tex.it)',
  'texdata – Xetma Vollenweider, Gessner 1853 (texdata.com)','Andritz – textile calenders (andritz.com)',
  'PTJ – Andritz teXcal Raconip (issuu.com)','texdata – Sperotto Rimar Decofast (texdata.com)',
  'Biancalani – AIRO brochure (netetrade.com)','Textile World – Biancalani Airo 24 (textileworld.com)',
  'Textile World – Santex Santashrink (textileworld.com)','Zimmer Austria – MAGNOROLL (zimmer-austria.com)',
  'Textile World – 500th MAGNOROLL (textileworld.com)','Zimmer Austria – Coating Systems 2015, 500–5600 mm (zimmer-austria.com)',
  '360iResearch – market for heat-setting stenters (marketresearch.com)'];

let scene=Math.max(0,Math.min(NSC-1,parseInt(params.get('scene')||'0',10)||0));
let cur=MID.includes(params.get('machine'))?params.get('machine'):'spann',curV=null,ak='br',ctab=params.get('cmp')||'A';
if(!'ABCD'.includes(ctab)||ctab.length!==1)ctab='A';
if(params.get('paused')==='1')document.body.classList.add('paused');

function openModule(key){
  if(EMBED){document.title='open:'+key;return}
  location.href=key+'.html?lang='+encodeURIComponent(lang);
}
function segBtns(el,items,curv,cb){
  el.innerHTML=items.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===curv}">${esc(l)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>cb(b.dataset.v));
}
const mi=id=>MID.indexOf(id);

  $('aratio').disabled=ak==='sa';
  MP='a';let s=DEFS();const top=ak==='sa'?0.3:r,bot=1-top;
  for(let i=0;i<4;i++){const x=40+i*235,w=225;
    s+=`<rect x="${x}" y="30" width="${w}" height="210" rx="6" fill="${HEATBG2}" stroke="#495057"/>`;
    s+=`<rect x="${x+10}" y="70" width="${w-20}" height="24" rx="3" fill="#dee2e6" stroke="#868e96"/><rect x="${x+10}" y="176" width="${w-20}" height="24" rx="3" fill="#dee2e6" stroke="#868e96"/>`;
    const n=7;
    for(let j=0;j<n;j++){const xx=x+22+j*(w-44)/(n-1),lt=8+30*top,lb=8+30*bot;
      s+=`<path d="M${xx} 95 L${xx} ${95+lt}" class="air" stroke-width="${1+3*top}" marker-end="url(#${MP}ah)"/>`;
      s+=`<path d="M${xx} 175 L${xx} ${175-lb}" class="air" stroke-width="${1+3*bot}" marker-end="url(#${MP}ah)"/>`;}
    if(ak==='br'){const Lf=i%2===0;s+=`<rect x="${Lf?x+6:x+w-36}" y="38" width="30" height="24" rx="4" fill="url(#${MP}hot)" stroke="#495057"/>`+Tm(x+w/2,228,Lf?L[0]:L[1],'middle',w-16);}
    if(ak==='mo'){s+=Tm(x+w/2,64,top>bot?L[2]:L[3],'middle',w-16)+`<rect x="${x+w/2-15}" y="206" width="30" height="20" rx="4" fill="url(#${MP}hot)" stroke="#495057" opacity=".8"/><rect x="${x+w/2-15}" y="40" width="30" height="12" rx="3" fill="url(#${MP}hot)" stroke="#495057"/>`;}
    if(ak==='sa'){s+=`<rect x="${x+w/2-40}" y="36" width="80" height="22" rx="4" fill="url(#${MP}hot)" stroke="#495057"/>`+Tm(x+w/2,228,L[4],'middle',w-16);}
  }
  let d='M20 135';const k=ak==='sa'?-14:(bot-top)*60;
  for(let i=0;i<4;i++){const x=40+i*235,w=225;d+=` L${x+8} 135 Q${x+w/2} ${135-k*1.2} ${x+w-8} 135`;}
  d+=' L990 135';s+=fab(d);
  s+=Tm(500,276,ak==='br'?L[5]:ak==='mo'?L[6]:L[7],'middle',940);
  const svg=$('asvg');svg.innerHTML=s;svg.setAttribute('aria-label',a.title);
  $('atxt').innerHTML=a.items[ak].map(x=>`<div class="c"><div class="k">${esc(x[0])}</div><p>${esc(x[1])}</p></div>`).join('');
}
$('aratio').oninput=drawA;
function drawB(){
  const b=T().b;$('btitle').textContent=b.title;
  $('btxt').innerHTML=b.items.map(x=>`<div class="c"><h4>${esc(x[0])}</h4><div class="k">${esc(x[1])}</div><p>${esc(x[2])}</p></div>`).join('');
}
function drawC(){
  const c=T().c,L=c.sv;
  $('ctitle2').textContent=c.title;$('cnote').textContent=c.note;$('cplbl').textContent=c.press;
  const P=+$('cp').value/100;$('cpv').textContent=Math.round(P*100)+' %';
  const W=270,x0=575,y0=250,H=190,cx=270;
  const f={zyl:x=>P*(1-0.55*P*(1-x*x)),bomb:x=>P*(1-0.9*(P-0.6)*(1-x*x)),komp:x=>P};
  const col={zyl:'#868e96',bomb:'var(--heat)',komp:'var(--ok)'};
  MP='c';let s=DEFS()+`<line x1="${x0}" y1="${y0}" x2="${x0+W}" y2="${y0}" stroke="var(--line)"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0-H}" stroke="var(--line)"/>`;
  s+=Tm(x0+W/2,y0+18,L[0],'middle',W+40)+`<text x="${x0-12}" y="${y0-H/2}" font-size="11" fill="var(--muted)" transform="rotate(-90 ${x0-12} ${y0-H/2})" text-anchor="middle">${esc(L[1])}</text>`;
  Object.keys(f).forEach(k=>{let d='';for(let i=0;i<=60;i++){const x=-1+i/30,v=f[k](x);d+=(i?'L':'M')+(x0+(x+1)/2*W).toFixed(1)+' '+(y0-v*H*0.95).toFixed(1);}s+=`<path d="${d}" fill="none" stroke="${col[k]}" stroke-width="3"/>`;});
  [['komp',L[2]],['bomb',L[3]],['zyl',L[4]]].forEach((l,i)=>{s+=`<line x1="${x0+W+10}" y1="${74+i*18}" x2="${x0+W+26}" y2="${74+i*18}" stroke="${col[l[0]]}" stroke-width="3"/>`+TX(x0+W+30,78+i*18,l[1],col[l[0]],'start',600,11,1000-(x0+W+32));});
  const sag=40*P,bsag=40*(P-0.6)*1.5;
  const rowY=[60,140,220],lab=[[L[5],'#868e96'],[L[6],'var(--heat)'],[L[2],'var(--ok)']];
  lab.forEach((l,i)=>{const y=rowY[i],g=i===0?sag:i===1?bsag:0;
    s+=`<path d="M40 ${y-24} Q${cx} ${y-24-g} 500 ${y-24} L500 ${y-4} Q${cx} ${y-4-g} 40 ${y-4} Z" fill="#dee2e6" stroke="#495057"/>`;
    s+=`<path d="M40 ${y+4} Q${cx} ${y+4+g} 500 ${y+4} L500 ${y+24} Q${cx} ${y+24+g} 40 ${y+24} Z" fill="#dee2e6" stroke="#495057"/>`;
    s+=TX(cx,y-30-Math.max(0,g)/2,l[0],l[1],'middle',600,11,440);
    if(Math.abs(g)>3)s+=TX(cx,y+3.5,g>0?L[7]:L[8],'var(--muted)','middle',400,9.5,300);});
  const svg=$('csvg');svg.innerHTML=s;svg.setAttribute('aria-label',c.title);
  $('ctxt').innerHTML=c.cards.map(x=>`<div class="c"><h4>${esc(x[0])}</h4><p>${esc(x[1])}</p></div>`).join('');
}
$('cp').oninput=drawC;
function drawD(){
  const d=T().d;$('dtitle').textContent=d.title;$('dnote').textContent=d.note;
  $('dtab').innerHTML=`<tr>${d.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`+d.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td>${r.slice(1).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('');
}

// ── 3 matrix + module links
function drawMx(){
  const t=T(),u=t.ui;
  $('mx').innerHTML=`<tr><th>${esc(u.mxHead[0])}</th><th>${esc(u.mxHead[1])}</th>${MID.map((id,i)=>`<th class="${id===cur?'hl':''}" data-id="${id}" title="${esc(t.m[i].n)}">${esc(t.mx[i])}</th>`).join('')}</tr>`+
    MX.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td>${MID.map(id=>{const v=r[2][id];return `<td class="${v===1?'y':v===2?'l':''}${id===cur?' hl':''}">${v===1?'●':v===2?'○':''}</td>`}).join('')}</tr>`).join('');
  $('mx').querySelectorAll('th[data-id]').forEach(th=>th.onclick=()=>{showM(th.dataset.id);go(1)});
}
function drawLinks(){
  const t=T();
  $('links').innerHTML=t.links.map((l,i)=>`<button type="button" class="lk" data-k="${LINK_KEYS[i]}"><b>${esc(l[0])} →</b><span>${esc(l[1])}</span><em>${esc(t.ui.open)}</em></button>`).join('');
  $('links').querySelectorAll('.lk').forEach(b=>b.onclick=()=>openModule(b.dataset.k));
}

// ── scenes / language
function go(i){
  scene=(i+NSC)%NSC;
  for(let k=0;k<NSC;k++)$('sc'+k).classList.toggle('on',k===scene);
  $('scenes').querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-pressed',k===scene));
  const sc=T().scenes[scene];$('ctitle').textContent=sc.title;$('ctext').textContent=sc.text;
  if(EMBED)document.title='scene:'+scene;
  window.scrollTo(0,0);
}
function applyLang(){
  const t=T(),u=t.ui;document.documentElement.lang=lang;
  $('eyebrow').textContent=u.eyebrow;$('h1').textContent=u.h1;$('lead').textContent=u.lead;$('note').textContent=u.note;
  $('srcsum').textContent=u.sources;$('srclist').innerHTML=SOURCES.map(x=>`<li>${esc(x)}</li>`).join('');
  $('scenes').innerHTML=t.scenes.map((s,i)=>`<button type="button" data-i="${i}">${esc(s.k)}</button>`).join('');
  $('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $('langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  $('kpis').innerHTML=t.kpis.map(k=>`<div class="kpi"><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join('');
  showM(cur);drawCmpTabs();drawA();drawB();drawC();drawD();drawLinks();go(scene);
}
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
applyLang();
})();
</script>
</body>
</html>
