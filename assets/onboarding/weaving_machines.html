<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weaving Machines</title>
<!-- Knowledge Base module (ui/screen_onboarding.py), category Weaving, group "Machines & manufacturers".
     Content from the user's research page "Schaft-, Jacquard- und Wilton-Weben: Maschinen, Hersteller, Schusseintrag".
     Texts in weaving_machines_texts.js (de/en/es/zh). ?lang=xx, window.setLang('xx'), window.goScene(i),
     ?embedded=1 (no own header/scene buttons, reports the scene via document.title "scene:n"),
     ?scene=n&paused=1 for screenshots. No external resources (sources as plain text only).
     Scene 6 links the other weaving modules: embedded via document.title "open:<key>", otherwise <key>.html.
     SVG/DOM, animations: shed formation (scene 0), weft insertion + rapier transfer zoom (scene 1), carpet (scene 4).
     Scenes never change automatically. -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --hl:#39A650;--air:#2386C8;--heat:#E07B39;--twist:#6A4FC8;--soft:#EEF3EC;
  --acc:#E07B39;--acc2:#2386C8;--ok:#2F8F45;--bad:#C92A2A;--cool:#1C7ED6;--wind:#495057;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:80ch}
.langs,.scenes{display:flex;gap:6px;flex-wrap:wrap}
.langs[hidden]{display:none}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"],.seg button[aria-pressed="true"],.mtabs button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 6px}
.caption p{margin:0;color:var(--muted);max-width:90ch}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font-body)}
svg.bg{background:var(--bg);border-radius:6px}
.sc{display:none;flex-direction:column;gap:12px}
.sc.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.card h3{font-family:var(--font-display);font-size:19px;margin:0 0 6px}
.seg,.mtabs{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.mtabs button{font-size:13.5px;padding:6px 11px}
.lbl{display:block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.muted{color:var(--muted);font-size:13px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;color:var(--hl)}
.kpi span{color:var(--muted);font-size:13px}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.pbtn{font-size:13px;padding:5px 11px}
.ins{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cmp .c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;border-top:4px solid var(--acc)}
.cmp .c h4{margin:0 0 4px;font-size:15px}
.cmp .c p{margin:4px 0;font-size:13.5px}
.cmp .c .k{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mhead h3{margin:0;font-size:21px;font-family:var(--font-display)}
.mhead .de{color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:12px}
.steps{counter-reset:s;list-style:none;padding:0;margin:4px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 4px 30px;font-size:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0}
.figs div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.figs b{display:block;font-size:17px;color:#1F7A36}
.figs span{font-size:12px;color:var(--muted)}
.pc{display:grid;grid-template-columns:1fr 1fr .8fr;gap:12px;margin:12px 0 14px}
.pcc{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)}
.pcc ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.pcc li{margin:3px 0}
.pcc p{margin:4px 0 0;font-size:13.5px}
.pcc.pro{border-left:5px solid var(--ok)}
.pcc.con{border-left:5px solid var(--bad)}
.pcc.when{border-left:5px solid var(--acc2)}
.st{font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.st.h{border-color:var(--ok);color:var(--ok)}
.st.p{border-color:var(--acc2);color:var(--acc2)}
.st.m{border-color:var(--muted);color:var(--muted)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
table.t tr:last-child td{border-bottom:0}
table.mx{border-collapse:collapse;width:100%;font-size:13px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center}
table.mx th{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;vertical-align:bottom}
table.mx td:first-child,table.mx th:first-child{text-align:left}
table.mx tr:hover td{background:#E07B390F}
table.mx tr.clk{cursor:pointer}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
.dot.y{background:var(--ok)}
.dot.l{border:2px solid var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}
.opt b{font-size:14px}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.legendrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lk{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.lk:hover{border-color:var(--hl)}
.lk b{display:block;font-size:16px;margin-bottom:2px}
.lk span{font-size:13px;color:var(--muted)}
.lk em{display:block;font-style:normal;font-size:12px;color:var(--hl);margin-top:6px;font-family:var(--font-mono)}
details{font-size:12px;color:var(--muted)}
details ol{columns:2;column-gap:28px;margin:8px 0 0}
details li{break-inside:avoid;margin-bottom:4px}
@keyframes spin{to{transform:rotate(360deg)}}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:860px){.grid2,.pc,.big3{grid-template-columns:1fr}}
@media (max-width:760px){header{flex-direction:column}details ol{columns:1}}
</style>
<script src="weaving_machines_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>

      <p class="lead" id="lead"></p>

  </header>
  <div class="scenes" id="scenes" role="group"></div>

      <div id="zoomwrap" style="display:none;margin-top:12px">
        <span class="lbl" id="zlbl"></span>

  <!-- 2 shaft weaving -->
  <div class="sc" id="sc2">

  <!-- 3 jacquard -->
  <div class="sc" id="sc3">
    <div class="card"><span class="lbl" id="hkL"></span><svg id="hsvg" viewBox="0 0 1000 300" role="img"></svg></div>
    <div class="card tblwrap"><table class="t" id="jtab"></table><p class="note" id="jnote"></p></div>
    <p class="note" id="stleg3"></p>

  <!-- 4 wilton -->
  <div class="sc" id="sc4">

  <p class="note" id="note"></p>
  <details><summary id="srcsum"></summary><ol id="srclist"></ol></details>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let lang=params.get('lang')||'de';if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const PAUSED=params.get('paused')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches&&params.get('paused')!=='0';
const T=()=>TEXTS[lang];
const NSC=7;
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// rough text width (CJK = 1 em) - used to shrink SVG labels that would overflow their slot
const textW=(t,s,w)=>{let n=0;for(const ch of String(t))n+=/[⺀-鿿＀-￯　-〿]/.test(ch)?1:/[A-Z0-9%]/.test(ch)?.64:ch===' '?.3:.54;return n*s*(w>=600?1.05:1)};
const TX=(x,y,t,c='var(--fg)',a='middle',w=600,s=12,max=0)=>{
  let sz=s,adj='';
  if(max){const e=textW(t,s,w);if(e>max){sz=Math.max(s*.8,s*max/e);if(textW(t,sz,w)>max)adj=` textLength="${max}" lengthAdjust="spacingAndGlyphs"`}}
  return `<text x="${x}" y="${y}" font-size="${+sz.toFixed(1)}" text-anchor="${a}" fill="${c}" font-weight="${w}"${adj}>${esc(t)}</text>`;
};
const Tm=(x,y,t,a='middle',max=0)=>TX(x,y,t,'var(--muted)',a,400,11,max);
const Tb=(x,y,t,a='middle')=>{const w=textW(t,11,400)+10,x0=a==='middle'?x-w/2:a==='end'?x-w:x;
  return `<rect x="${x0-2}" y="${y-12}" width="${w}" height="17" rx="4" fill="var(--bg)" opacity=".92"/>`+Tm(a==='start'?x+3:a==='end'?x-5:x,y,t,a);};
const num=v=>T().ui.loc==='none'?String(v):v.toLocaleString(T().ui.loc).replace(/[’'  ]/g,' ');
const ST=k=>`<span class="st ${k}">${esc(T().ui.st[k])}</span>`;
const WARP='#2386C8',WEFT='#E07B39';

// ── language-neutral data (texts in weaving_machines_texts.js, same order)
const FK=['ex','sch','jac'];
const INS=['schuetzen','projektil','greifer','luft','wasser'];
const INS_ST={schuetzen:['p'],projektil:['p'],greifer:['h','h','h','h','m'],luft:['h','h','p','h','h','m'],wasser:['p','p','m']};
const VARS=['neg','pos','ein'];            // rapier variants (texts in ins.sys[2].v)
const HV={schuetzen:[1,2,4,2,3,5],projektil:[3,5,4,3,4,3],greifer:[3,4,5,5,3,3],luft:[5,3,3,3,1,3],wasser:[5,2,1,1,4,3]};
const SPD=[[140,'#A07D50'],[403,'#495057'],[800,'#E07B39'],[1200,'#1C7ED6'],[1350,'#2386C8']];
const SCH_ST=[['h','p','h','h'],['h','h','p'],['h','h','p','p']];
const HK=[[1,96,'#868E96'],[1344,12000,'#6A4FC8'],[1920,17280,'#2386C8'],[2304,31104,'#E07B39'],[2688,2688,'#2F8F45']];
const J_ST=['h','h','p','h'];
const WK=['rute','f2f','axm'];
const W_ST=['h','h','h','h','h','h','h','h','p'];
const MXC=['g','l','w','p','s','j','f','r','a'];
const MXR=[['BE',{g:1,l:1,s:1}],['IT',{g:1,l:1,p:1}],['DE',{g:1,l:1}],['JP',{l:1,w:1,s:1}],['JP',{l:1,w:1}],['IT',{g:1,l:1}],['CH/DE',{s:1,j:1,f:1}],['BE',{j:1,f:1,r:1,a:1}],['DE/CN',{j:1}],['CN',{g:2,l:2}],['CN',{g:2,l:2,w:2}]];
const LINK_KEYS=['shaft_weaving','weave_structures','jacquard_weaving','wilton_weaving'];
const SOURCES=['Textile World – Picanol 400,000th weaving machine, speeds','Picanol – OmniPlus-i Connect, EcoBoost, 1,350 rpm','Picanol – AirStream, +100 rpm','Picanol – OmniPlus-i Connect brochure',
 'Indian Textile Magazine – Picanol > 130,000 rapier machines, Ultimax','Indian Textile Magazine – Supermax, Ultimax ~410 rpm','Picanol – shedding options','Lenze – Picanol SmartShed, 8–16 servo axes',
 'Techtextil – Itema: rapier, air, projectile','TEXtalks – projectile production moved to Colzate, 655 cm','Itema – P7300HP, 1,570 m/min','Textile World – Sulzer: > 150,000 projectile machines',
 'Itema – R9500², market launch 2012','Itema – Hercules, convertible positive/negative','Textile World – ITMA 2015: Dornier P2, Panter Hercules','Textile World – Dornier: founded 1950, P2, A2',
 'Textile World – Dornier P2 sailcloth, 320 picks/min','Textile World – Dornier SyncroDrive','texdata – Toyota JAT910','Toyota Industries – JAT910, LWT810, water jet for synthetics only',
 'Toyota – JAT910 catalogue, E-shed since 2000','Textilegence – Tsudakoma ZAX001neo, ZW8200','Student presentation – Toyota LWT810 vs Tsudakoma ZW8100','texdata – SMIT GS980, free-flight rapier',
 'SMIT ONE – single rapier','Textile World – SMIT since 1938, 2FAST','ITU – lecture rapier weaving (Gabler, Dewas, positive/negative)','Wikipedia – Rapier loom (Gabler 1922)',
 'IJCST – relay nozzles up to 80 % of compressed air','Annals Hunedoara – profile reed as market standard','Stäubli – rotary dobby S3200','Stäubli – S3000/S3200 for water-jet, air-jet, rapier machines',
 'Textile World – > 20,000 S3000/S3200','texdata – Stäubli ALPHA 560, S3292','PTJ – Stäubli CX 860 (1987)','Stäubli – LXL PRO','Stäubli – UNIVALETTE, own drive',
 'Indian Textile Journal – Stäubli SX 2,688 hooks','Bonas – about us (1983, 31,104 hooks)','Bonas – Si, 12 to 36 knives','Vandewiele – Bonas Ji, 1,920–17,280 hooks',
 'Indian Textile Journal – Bonas Ji 1,920–5,760','Vandewiele – Bonas H3D','Textile World – GITEC Grosse, UniShed','Textiles in Depth – UniShed leaf springs',
 'Vandewiele – carpet weaving machines','Vandewiele – RCF, 250 rpm','Textile World – Van de Wiele UCL83, three rapiers','Textile World – Van de Wiele CRX, MAX63',
 'texdata – Schönherr ALPHA 500, Bayreuth/Chemnitz','Indian Textile Journal – ALPHA 500, 5.3 m','Stäubli – ALPHA 500 SINGLELOOP','Stäubli – ALPHA 500 LEANTEC',
 'Britannica – Wilton, Axminster, colour selection','Britannica – Brussels, Wilton, spool/gripper Axminster','Brintons – Wilton construction','ITMF via Textile Excellence – shipments 2025',
 'Market study – manufacturers of shuttleless looms','ITU – productivity of insertion systems (1980s)','UPTTI – limits of the shuttle loom','Fibre2Fashion – projectile: tuck-in selvedge, small shed',
 'Blog – projectile: yarn range, energy','Teaching material – rapier pros and cons','Govt. Polytechnic Bhadrak – air jet pros and cons','Teaching material – jet weaving, width limit',
 'SVITS – shuttle vs. shuttleless comparison','Wikipedia – Water-jet loom','Textile Learner – water jet pros and cons','Teaching material – water jet, two weft colours',
 'University of Arizona – dobby vs. Jacquard'];

let scene=Math.max(0,Math.min(NSC-1,parseInt(params.get('scene')||'0',10)||0));

// ── step bars (back / play-pause / forward + label)
const bars=[];
function mkBar(id,o){
  const el=$(id);
  el.innerHTML=`<button type="button" class="pbtn" data-a="p"></button><button type="button" class="pbtn" data-a="t"></button><button type="button" class="pbtn" data-a="n"></button><span class="ins" data-a="l"></span>`;
  const q=a=>el.querySelector(`[data-a=${a}]`);
  let last={};
  const set=(a,v)=>{if(last[a]!==v){last[a]=v;q(a).textContent=v}};
  const upd=()=>{const u=T().ui;set('p',u.prev);set('n',u.next);set('t',o.isPlay()?u.pause:u.play);set('l',o.label())};
  q('p').onclick=()=>{o.prev();upd()};q('n').onclick=()=>{o.next();upd()};q('t').onclick=()=>{o.toggle();upd()};
  bars.push(upd);upd();return upd;
}
function segBtns(el,keys,labels,cur,cb){
  el.innerHTML=keys.map((k,i)=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${esc(labels[i])}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>cb(b.dataset.k));

const cmpCards=a=>a.map(x=>`<div class="c"><div class="k">${esc(x[0])}</div><p>${esc(x[1])}</p></div>`).join('');

  s+=Tm(600,16,t.hkNote,'middle',620);
  $('hsvg').innerHTML=s;$('hsvg').setAttribute('aria-label',t.hkL);$('hkL').textContent=t.hkL;
  $('jtab').innerHTML=`<tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`+t.rows.map((r,j)=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${ST(J_ST[j])}</td></tr>`).join('');
  $('jnote').textContent=t.note;
}

// ── 4 wilton
let wk='rute',wph=0,wPlay=!PAUSED;
function drawW(){
  const L=T().wil.svg;let s='';const sh=(wph%1)*40;
  if(wk==='rute'){
    for(let i=-1;i<26;i++){const x=40+i*40-sh;if(x<0||x>960)continue;
      s+=`<circle cx="${x}" cy="220" r="5" fill="${WEFT}"/><circle cx="${x+20}" cy="236" r="5" fill="${WEFT}"/>`}
    s+=`<line x1="0" y1="228" x2="1000" y2="228" stroke="#a07d50" stroke-width="3"/>`+Tm(980,256,L.ground,'end',400);
    const cut=480;
    for(let i=-1;i<26;i++){const x=40+i*40-sh;if(x<-40||x>980)continue;
      if(x<cut)s+=`<path d="M${x+6} 222 L${x+2} 150 M${x+14} 222 L${x+18} 150" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/>`;
      else s+=`<path d="M${x-4} 224 Q${x-4} 140 ${x+10} 140 Q${x+24} 140 ${x+24} 224" fill="none" stroke="var(--acc)" stroke-width="4"/><rect x="${x-8}" y="150" width="36" height="10" rx="2" fill="url(#steelw)" stroke="#495057"/>`}
    s+=`<line x1="${cut}" y1="40" x2="${cut}" y2="270" stroke="var(--line)" stroke-dasharray="4 4"/>`+TX(cut,32,L.cutMsg,'var(--fg)','middle',600,12,900);
    s+=Tb(240,110,L.cutPile)+Tb(740,110,L.loops);
  }else if(wk==='f2f'){
    for(let i=-1;i<26;i++){const x=40+i*40-sh;if(x<-40||x>990)continue;
      s+=`<circle cx="${x}" cy="62" r="5" fill="${WEFT}"/><circle cx="${x}" cy="238" r="5" fill="${WEFT}"/>`}
    s+=`<line x1="0" y1="70" x2="1000" y2="70" stroke="#a07d50" stroke-width="3"/><line x1="0" y1="230" x2="1000" y2="230" stroke="#a07d50" stroke-width="3"/>`;
    const kx=520;
    for(let i=-1;i<26;i++){const x=40+i*40-sh;if(x<-40||x>990)continue;
      if(x<kx)s+=`<path d="M${x} 74 L${x+10} 145 M${x+20} 226 L${x+10} 155" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/>`;
      else s+=`<path d="M${x} 74 L${x+20} 226" stroke="var(--acc)" stroke-width="4"/>`}
    s+=`<g transform="translate(${kx} 150)"><path d="M-14 -6 L16 0 L-14 6 Z" fill="#495057"/></g>`+TX(kx,30,L.knife,'var(--fg)','middle',600,12,900);
    s+=Tb(980,96,L.upper,'end')+Tb(980,262,L.lower,'end');
    s+=Tb(250,154,L.twoCarpets)+Tb(760,154,L.pendulum);
  }else{
    for(let i=-1;i<26;i++){const x=40+i*40-sh;if(x<-40||x>990)continue;s+=`<circle cx="${x}" cy="220" r="5" fill="${WEFT}"/><circle cx="${x+20}" cy="236" r="5" fill="${WEFT}"/>`}
    s+=`<line x1="0" y1="228" x2="1000" y2="228" stroke="#a07d50" stroke-width="3"/>`;
    const cols=['var(--acc)','var(--acc2)','var(--ok)','var(--twist)','var(--bad)'];
    for(let i=-1;i<26;i++){const x=40+i*40-sh;if(x<-40||x>720)continue;const c=cols[(i*7+3)%5<0?0:(i*7+3)%5];
      s+=`<path d="M${x+2} 150 L${x+6} 226 Q${x+10} 232 ${x+14} 226 L${x+18} 150" fill="none" stroke="${c}" stroke-width="4"/>`}
    s+=`<path d="M760 60 l30 40 l-14 6 l-26 -36z" fill="#495057"/><path d="M772 108 L776 190" stroke="var(--acc)" stroke-width="4" stroke-dasharray="3 2"/>`+TX(800,70,L.grip1,'var(--fg)','start',600,12,190)+TX(800,86,L.grip2,'var(--fg)','start',600,12,190);
    s+=Tm(360,120,L.each,'middle',640)}
  $('wsvg').innerHTML=`<defs><linearGradient id="steelw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dee2e6"/><stop offset="1" stop-color="#868e96"/></linearGradient></defs>`+s;
  $('wsvg').setAttribute('aria-label',T().wil.seg[WK.indexOf(wk)]);
}
function setW(k){wk=k;drawWil()}
function drawWil(){
  const t=T().wil;
  segBtns($('wseg'),WK,t.seg,wk,setW);
  $('wtxt').innerHTML=cmpCards(t.cards[wk]);drawW();
  $('wtab').innerHTML=`<tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`+t.rows.map((r,j)=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${ST(W_ST[j])}</td></tr>`).join('');
  $('wnote').textContent=t.note;
}
setInterval(()=>{if(!wPlay||scene!==4)return;wph+=0.025;drawW()},50);
mkBar('wbar',{isPlay:()=>wPlay,toggle:()=>{wPlay=!wPlay},prev:()=>{wPlay=false;wph=Math.max(0,wph-0.25);drawW()},next:()=>{wPlay=false;wph+=0.25;drawW()},label:()=>T().wil.step});

// ── 5 differences
function drawDiff(){
  const t=T().diff;
  $('dcards').innerHTML=t.cards.map(c=>`<div class="c"><h4>${esc(c[0])}</h4><p>${esc(c[1])}</p><p style="color:var(--muted)"><b style="color:var(--fg)">${esc(t.follow)}</b> ${esc(c[2])}</p></div>`).join('');
}

// ── 6 matrix + links
function drawMx(){
  const t=T().mx;
  $('mxleg').innerHTML=`<span><i class="dot y"></i> = ${esc(t.legend[0])}</span><span><i class="dot l"></i> = ${esc(t.legend[1])}</span><span>${esc(t.legend[2])}</span>`;
  $('mx').innerHTML=`<tr><th>${esc(t.head[0])}</th><th>${esc(t.head[1])}</th>${t.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+
    MXR.map(([cc,d],i)=>`<tr><td><b>${esc(t.firms[i])}</b></td><td style="text-align:left">${cc}</td>${MXC.map(c=>`<td>${d[c]===1?'<i class="dot y"></i>':d[c]===2?'<i class="dot l"></i>':''}</td>`).join('')}</tr>`).join('');
  $('lkL').textContent=t.lkL;
  $('links').innerHTML=t.links.map((l,i)=>`<button type="button" class="lk" data-k="${LINK_KEYS[i]}"><b>${esc(l[0])} →</b><span>${esc(l[1])}</span><em>${esc(T().ui.open)}</em></button>`).join('');
  $('links').querySelectorAll('.lk').forEach(b=>b.onclick=()=>openModule(b.dataset.k));
}

// ── scenes / language
function go(i){
  scene=(i+NSC)%NSC;
  for(let k=0;k<NSC;k++)$('sc'+k).classList.toggle('on',k===scene);
  $('scenes').querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-pressed',k===scene));
  const sc=T().scenes[scene];$('ctitle').textContent=sc.title;$('ctext').textContent=sc.text;
  if(scene===0){drawF();fUpd()}
  if(scene===4)drawW();
  if(EMBED)document.title='scene:'+scene;
}
function applyLang(){
  const t=T(),u=t.ui;document.documentElement.lang=lang;
  $('eyebrow').textContent=u.eyebrow;$('h1').textContent=u.h1;$('lead').textContent=u.lead;$('note').textContent=u.note;
  $('srcsum').textContent=u.sources;$('srclist').innerHTML=SOURCES.map(x=>`<li>${esc(x)}</li>`).join('');
  $('kpis').innerHTML=t.kpis.map(k=>`<div class="kpi"><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join('');
  [1,2,3,4].forEach(i=>$('stleg'+i).textContent=u.stLegend);
  $('scenes').innerHTML=t.scenes.map((s,i)=>`<button type="button" data-i="${i}">${esc(s.k)}</button>`).join('');
  $('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $('langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  drawFach();drawInsStatic();drawSchaft();drawJac();drawWil();drawDiff();drawMx();
  bars.forEach(f=>f());go(scene);
}
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
applyLang();
requestAnimationFrame(now=>{if(!PAUSED){lastP=now;t0=now}drawI(now)});
})();
</script>
</body>
