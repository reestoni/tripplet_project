<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knot Stability</title>
<!-- Onboarding-Modul (ui/screen_onboarding.py), gleiches Muster wie dty_intermingling.html.
     Texte in knot_stability_texts.js (de/en/es/zh). ?lang=xx, window.setLang('xx'), window.goScene(i),
     ?embedded=1 (ohne eigenen Kopf/Szenen-Knoepfe, meldet die Szene per document.title "scene:n"),
     ?scene=n&paused=1 fuer Screenshots. Keine externen Ressourcen. Szenen wechseln nie automatisch.
     Szene 1: Schritte 1-4 anklickbar. Szenen 2/3: Zugversuch live (startet nach dem Bruch in derselben Szene neu), Szene 4: Regler Knotenstabilitaet. -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --yarn:#6E6556;--yarn-rgb:110,101,86;--air:#2386C8;--air-rgb:35,134,200;--heat:#E07B39;--hl:#39A650;
  --melt:#E08A2E;--poy:#C08A1E;--fdy:#2E9C7A;--fdy-rgb:46,156,122;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:70ch}
.langs{display:flex;gap:4px;flex-shrink:0}
.langs[hidden]{display:none}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:16/9}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.scenes{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.scenes button span{font-family:var(--font-mono);font-size:12px;opacity:.7}
.right{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.slider{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.slider[hidden]{display:none}
.slider input{accent-color:var(--hl);width:160px}
.slider output{min-width:6.5em;color:var(--fg)}
.play{min-width:120px;justify-content:center}
.caption{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;border-top:1px solid var(--line);padding-top:16px}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 8px}
.caption p{margin:0 0 10px;max-width:70ch}
.now{font-family:var(--font-mono);font-size:13px;color:var(--hl);min-height:1.5em}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.facts li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.facts b{font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.note{font-size:12px;color:var(--muted);margin:0}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:760px){.caption{grid-template-columns:1fr;gap:14px}.facts li{grid-template-columns:96px minmax(0,1fr)}header{flex-direction:column}}
</style>
<script src="knot_stability_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="stage"><canvas id="cv" width="1600" height="900"></canvas></div>
  <div class="controls">
    <div class="scenes" id="scenes" role="group"></div>
    <div class="right">
<style>button[hidden]{display:none}</style>
      <label class="slider" id="kwrap" hidden><span id="klab"></span>
        <input id="ks" type="range" min="0" max="1" step="0.01" value="0.6"><output id="kout"></output></label>
      <button type="button" id="again" hidden></button>
      <button class="play" id="play" type="button"></button>
    </div>
  </div>
  <section class="caption" aria-live="polite">
    <div><h2 id="ctitle"></h2><p class="now" id="cnow"></p><p id="ctext"></p></div>
    <ul class="facts" id="cfacts"></ul>
  </section>
  <p class="note" id="note"></p>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');const W=1600,H=900;
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={bg:css('--panel'),line:css('--line'),fg:css('--fg'),muted:css('--muted'),yarn:css('--yarn'),air:css('--air'),heat:css('--heat'),hl:css('--hl'),
  melt:css('--melt'),poy:css('--poy'),fdy:css('--fdy')};
const YRGB=css('--yarn-rgb'),ARGB=css('--air-rgb'),FRGB=css('--fdy-rgb');
const MONO=css('--font-mono'),DISP=css('--font-display'),SANS=css('--font-body');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const params=new URLSearchParams(location.search);
let lang=(params.get('lang')||'de');if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const T=()=>TEXTS[lang];
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
let fitW=0;function fit(){const w=cv.getBoundingClientRect().width||W;if(w===fitW&&cv.width>0)return;fitW=w;const d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(w*d));cv.height=Math.max(1,Math.round(w*9/16*d))}
addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);fit();
const smooth=(a,b,x)=>{const q=Math.max(0,Math.min(1,(x-a)/(b-a)));return q*q*(3-2*q)},lerp=(a,b,q)=>a+(b-a)*q;
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(c1,c2,q)=>{const a=hx(c1),b=hx(c2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],q))).join(',')})`};
const hsh=(a,b,c)=>{const v=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return v-Math.floor(v)};

const NSC=4;
C.red='#D6453D';
/* ---------- Modell: Messstrecke mit M Segmenten in Serie, M-1 Knoten ----------
   s[j][i]: Ueberlaenge von Filament i im Segment j. Knoten q (zwischen Segment q und q+1) hat Oeffnungsgrad o[q] 0..1.
   Oeffnet ein Knoten, wird die darin gebundene Laenge REL frei (je Haelfte an beide Nachbarsegmente).
   Ist o[q]=1, verschmelzen die Nachbarsegmente: die Filamente rutschen durch und gleichen sich ueber beide Segmente aus.
   Alle Gruppen tragen dieselbe Kraft F (Serienschaltung). Reisst ein Filament, reisst es nur in einem Segment. */
const N=12,M=5,REL=.08;
let rs=1;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function makeYarn(seed){rs=seed;for(let j=0;j<5;j++)rnd();
  const s=[];for(let j=0;j<M;j++){const sl=[];for(let i=0;i<N;i++)sl.push(.18*(i+.8*rnd())/N);const mn=Math.min(...sl);
    const perm=[...Array(N).keys()].map(i=>[i,rnd()]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);s.push(perm.map(p=>sl[p]-mn))}
  const lanes=[...Array(N).keys()].map(i=>[i,rnd()]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);
  const f=[...Array(N).keys()].map(i=>({eb:.2+.03*rnd(),lane:(lanes[i]/(N-1)-.5)*2,dir:i%2?1:-1,bp:.25+.5*rnd(),ph:rnd()*6.28}));
  const Tb=[...Array(M-1).keys()].map(()=>.7+.6*rnd());return{s,f,Tb}}
const Tk=(Y,k,q)=>lerp(.2,2.2,k)*Y.Tb[q];
function newState(Y,k){return{Y,k,U:0,F:0,o:Array(M-1).fill(0),br:[...Array(N)].map(()=>Array(M).fill(false)),bt:[...Array(N)].map(()=>Array(M).fill(-9))}}
function groups(st){const g=[];let a=0;for(let q=0;q<M-1;q++){if(st.o[q]>=1)continue;g.push([a,q]);a=q+1}g.push([a,M-1]);
  return g.map(([a,b])=>{const n=b-a+1,L=[],al=[];for(let i=0;i<N;i++){let l=0,ok=true;for(let j=a;j<=b;j++){
      l+=1+st.Y.s[j][i]+.5*REL*((j>0?st.o[j-1]:0)+(j<M-1?st.o[j]:0));if(st.br[i][j])ok=false}L.push(l);al.push(ok)}
    let e0=Infinity;for(let i=0;i<N;i++)if(al[i])e0=Math.min(e0,L[i]/n-1);return{a,b,n,L,al,e0}})}
function Fg(G,eps){let f=0;for(let i=0;i<N;i++)if(G.al[i]){const e=(G.n*(1+eps)-G.L[i])/G.L[i];if(e>0)f+=e}return f}
function epsOf(G,F){if(F<=0)return G.e0;let lo=G.e0,hi=G.e0+.5;while(Fg(G,hi)<F&&hi<9)hi+=.5;for(let j=0;j<24;j++){const m=(lo+hi)/2;if(Fg(G,m)<F)lo=m;else hi=m}return(lo+hi)/2}
function solveF(st,U){const gs=groups(st);if(gs.some(G=>G.e0===Infinity))return{F:0,gs,eps:gs.map(()=>U),broken:true};
  const tot=M*(1+U),base=gs.reduce((a,G)=>a+G.n*(1+G.e0),0);
  if(tot<=base){const r=tot/base;return{F:0,gs,eps:gs.map(G=>(1+G.e0)*r-1)}}
  let lo=0,hi=1;const ext=F=>gs.reduce((a,G)=>a+G.n*(1+epsOf(G,F)),0);while(ext(hi)<tot&&hi<20)hi*=2;
  for(let j=0;j<24;j++){const m=(lo+hi)/2;if(ext(m)<tot)lo=m;else hi=m}const F=(lo+hi)/2;return{F,gs,eps:gs.map(G=>epsOf(G,F))}}
function weakest(st,r){let best=null,v=1;r.gs.forEach((G,g)=>{for(let i=0;i<N;i++)if(G.al[i]){const e=(G.n*(1+r.eps[g])-G.L[i])/G.L[i],q=e/st.Y.f[i].eb;if(q>=v){v=q;best={i,G}}}});return best}
function breakIt(st,w,now){const G=w.G,j=clamp(G.a+Math.floor(st.Y.f[w.i].bp*G.n),G.a,G.b);st.br[w.i][j]=true;st.bt[w.i][j]=now;return j}
const oTarget=(st,q,F)=>clamp((F-Tk(st.Y,st.k,q))/.3,0,1);
function simStatic(Y,k,dU=.003){const st=newState(Y,k),tr=[[0,0]];let Fmax=0,Umax=0;
  for(let U=dU;U<1.5;U+=dU){let r=solveF(st,U);
    for(let it=0;it<4;it++){let ch=false;for(let q=0;q<M-1;q++){const tg=oTarget(st,q,r.F);if(tg>st.o[q]+1e-4){st.o[q]=tg;ch=true}}if(!ch)break;r=solveF(st,U)}
    if(r.F>Fmax){Fmax=r.F;Umax=U}tr.push([U,r.F]);let w;
    while(!r.broken&&(w=weakest(st,r))){breakIt(st,w,0);r=solveF(st,U);tr.push([U,r.F])}
    if(r.broken)break}
  return{tr,Fmax,Umax}}

const loadCol=r=>r<=0?'rgba(110,101,86,.45)':r<.75?mix('#8C8474','#E07B39',r/.75):mix('#E07B39','#D6453D',(r-.75)/.25);
const Y=makeYarn(7),KH=1,KW=.15,RATE=.032,XMAX=.5,YMAX=2.5;
const HARD=simStatic(Y,KH),SOFT=simStatic(Y,KW);
let CUR=null;const famQ=[...Array(11).keys()].map(j=>({k:j/10,seeds:[...Array(6).keys()].map(s=>101+s*37),u:0,f:0,n:0}));
function famStep(){const p=famQ.find(p=>p.n<p.seeds.length);if(!p)return;const r=simStatic(makeYarn(p.seeds[p.n]),p.k,.006);p.u+=r.Umax;p.f+=r.Fmax;p.n++}
const famDone=()=>famQ.every(p=>p.n===p.seeds.length);
const famAt=(k,key)=>{const x=k*10,j=Math.min(9,Math.floor(x));const v=p=>(key==='ru'?p.u:p.f)/(key==='ru'?famQ[0].u:famQ[0].f);return lerp(v(famQ[j]),v(famQ[j+1]),x-j)};
const SIM=[null,KH,KW,null];

/* ---------- Live-Zugversuch ---------- */
let S=null;
function newSim(k){const st=newState(Y,k);Object.assign(st,{segD:Array(M).fill(1),done:false,doneT:0,tr:[[0,0]],hold:0,lastBreak:-9,chain:0,adv:1,opening:-1,openT:-9,lastSeg:-1,r:null});S=st;S.r=solveF(S,0)}
function stepSim(st,dt){
  if(st.done){st.doneT+=dt;syncSeg(st,.3);return}
  if(dt<=0)return;
  if(st.hold>0)st.hold-=dt;else{st.U+=RATE*dt;st.adv+=RATE*dt}
  let r=solveF(st,st.U);
  let ch=false;for(let q=0;q<M-1;q++){const tg=oTarget(st,q,r.F);if(tg>st.o[q]){const n=Math.min(tg,st.o[q]+dt*1.4);if(n>st.o[q]+1e-5){st.o[q]=n>=.999?1:n;ch=true;st.opening=q;st.openT=t}}}
  if(ch)r=solveF(st,st.U);
  if(st.hold<=0&&!r.broken){const w=weakest(st,r);
    if(w){st.tr.push([st.U,r.F]);const j=breakIt(st,w,t);st.chain=st.adv<.0015?st.chain+1:1;st.adv=0;st.lastBreak=t;st.lastSeg=j;st.hold=.24;r=solveF(st,st.U)}}
  st.r=r;st.F=r.F;st.tr.push([st.U,r.F]);if(r.broken)st.done=true;syncSeg(st,.35)}
function syncSeg(st,a){const r=st.r;r.gs.forEach((G,g)=>{for(let j=G.a;j<=G.b;j++)st.segD[j]=lerp(st.segD[j],Math.min(1.9,1+r.eps[g]),a)})}

/* ---------- UI ---------- */
const sceneEl=$('scenes'),play=$('play'),kin=$('ks'),again=$('again');
/* auto = Bewegung laeuft (Pause friert sie ein, auch den Zugversuch). Szenen wechseln nie von selbst;
   ein fertiger Zugversuch startet nach ein paar Sekunden in derselben Szene neu. */
let scene=0,sceneT=0,auto=!reduce,t=0,kS=.6,hoverStep=-1;
function setPlay(){play.setAttribute('aria-pressed',auto);play.textContent=auto?T().ui.pause:T().ui.play}
play.onclick=()=>{auto=!auto;setPlay()};
kin.oninput=()=>{kS=+kin.value;$('kout').textContent=Math.round(kS*100)+' %';CUR=simStatic(Y,kS)};
again.onclick=()=>{if(SIM[scene]!==null)newSim(SIM[scene])};
function go(i,keep){scene=(i+NSC)%NSC;if(!keep)sceneT=0;hoverStep=-1;if(EMBED)document.title='scene:'+scene;
  [...sceneEl.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===scene));
  const s=T().scenes[scene];$('ctitle').textContent=`${scene+1}  ·  ${s.title}`;$('ctext').textContent=s.text;
  $('cfacts').innerHTML='';s.facts.forEach(f=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=f[0];const sp=document.createElement('span');sp.textContent=f[1];li.append(b,sp);$('cfacts').appendChild(li)});
  $('cnow').textContent='';$('kwrap').hidden=scene!==3;again.hidden=SIM[scene]===null;
  if(!keep&&SIM[scene]!==null)newSim(SIM[scene]);if(scene===3&&!CUR)CUR=simStatic(Y,kS)}
function applyLang(){const u=T().ui;document.documentElement.lang=lang;
  ['eyebrow','h1','lead','note'].forEach(k=>$(k).textContent=u[k]);$('klab').textContent=u.stab;again.textContent=u.again;
  sceneEl.setAttribute('aria-label',u.scenes);sceneEl.innerHTML='';
  T().scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span>${i+1}</span>`;b.append(s.k);b.onclick=()=>go(i);sceneEl.appendChild(b)});
  [...$('langs').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  kin.oninput();setPlay();go(scene,true)}
/* Szene 1: Schritte 1-4 anklicken = dorthin springen und erklaeren */
const STEP_X=k=>80+k*365,STEP_Y=600,STEP_W=340,STEP_H=120,STEP_DUR=5;
function hitStep(ev){const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height;
  for(let k=0;k<4;k++)if(x>=STEP_X(k)&&x<=STEP_X(k)+STEP_W&&y>=STEP_Y&&y<=STEP_Y+STEP_H)return k;return -1}
cv.addEventListener('mousemove',ev=>{if(scene!==0){cv.style.cursor='';hoverStep=-1;return}hoverStep=hitStep(ev);cv.style.cursor=hoverStep>=0?'pointer':''});
cv.addEventListener('mouseleave',()=>{hoverStep=-1;cv.style.cursor=''});
cv.addEventListener('click',ev=>{if(scene!==0)return;const k=hitStep(ev);if(k>=0)sceneT=k*STEP_DUR+.01});
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(scene+1);if(e.key==='ArrowLeft')go(scene-1);if(e.key===' '){e.preventDefault();auto=!auto;setPlay()}});

/* ---------- Zeichnen ---------- */
function label(s,x,y,o={}){let sz=o.s||20;const f=()=>`${o.w||500} ${sz}px ${o.f||MONO}`;ctx.font=f();
  if(o.mw)while(sz>11&&ctx.measureText(s).width>o.mw){sz--;ctx.font=f()}
  ctx.fillStyle=o.c||C.muted;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.globalAlpha=o.al??1;ctx.fillText(s,x,y);ctx.globalAlpha=1}
function wrap(txt,maxW){const parts=/\s/.test(txt)?txt.split(/(\s+)/):[...txt];const lines=[];let cur='';
  parts.forEach(w=>{const tryS=cur+w;if(ctx.measureText(tryS).width>maxW&&cur.trim()&&!/^[，。、；：）！？,.;:)]/.test(w)){lines.push(cur.trim());cur=w.trimStart()}else cur=tryS});
  if(cur.trim())lines.push(cur.trim());return lines}
function leader(x1,y1,x2,y2,c){ctx.strokeStyle=c||C.line;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function hatch(x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.strokeStyle='rgba(90,100,96,.35)';ctx.lineWidth=1.5;for(let k=-h;k<w+h;k+=12){ctx.beginPath();ctx.moveTo(x+k,y+h);ctx.lineTo(x+k+h,y);ctx.stroke()}ctx.restore()}
const X0=110,CY=300,PX=130,FAN=24,KW0=20;
/* Knoten als Verschlingung: im Knotenbereich laufen die Filamente als enger Zopf umeinander (vorne kraeftig, hinten blass).
   Oeffnet der Knoten, wird der Bereich laenger, die Windungen loesen sich und die Filamente laufen gestreckt nebeneinander. */
const hwOf=o=>lerp(30,40,o);
const KN=(()=>{rs=999;return[...Array(M-1)].map(()=>[...Array(N)].map(()=>({ph:rnd()*6.283,T:1.4+1.4*rnd(),r:.45+.55*rnd(),ph2:rnd()*6.283})))})();
function braidOff(i,q,v,o){const k=KN[q][i],env=.75+.25*Math.cos(Math.PI*v/2);
  const loop=14*k.r*env*Math.sin(k.ph+k.T*Math.PI*v)+3*Math.sin(k.ph2+5*v);
  return lerp(loop,Y.f[i].lane*KW0+2.5*Math.sin(k.ph2+v*7),o)}
function braidZ(i,q,v,o){const k=KN[q][i];return Math.cos(k.ph+k.T*Math.PI*v)*(1-o)}
