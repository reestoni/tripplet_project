<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staple Fibre Spinning</title>
<!-- Knowledge Base module (ui/screen_onboarding.py), category Staple fibre spinning.
     Content from the user's research page "Stapelfaserspinnerei: von der Faserflocke zum Garn".
     Texts in staple_spinning_texts.js (de/en/es/zh). ?lang=xx, window.setLang('xx'), window.goScene(i),
     ?embedded=1 (no own header/scene buttons, reports the scene via document.title "scene:n"),
     ?scene=n&paused=1 for screenshots. No external resources (sources as plain text only).
     Scene 4 links other modules: embedded via document.title "open:<key>", otherwise <key>.html.
     SVG/DOM: process lines (scene 0, click a stage = scene 1), 8 animated process diagrams with
     step control (scene 1), yarn structures (scene 2), twist/speed calculator (scene 3).
     Scenes never change automatically. -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --hl:#39A650;--air:#2386C8;--heat:#E07B39;--twist:#6A4FC8;--soft:#EEF3EC;
  --acc:#E07B39;--acc2:#2386C8;--ok:#2F8F45;--bad:#C92A2A;--cool:#1C7ED6;--wind:#495057;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:80ch}
.langs,.scenes{display:flex;gap:6px;flex-wrap:wrap}
.langs[hidden]{display:none}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"],.seg button[aria-pressed="true"],.mtabs button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 6px}
.caption p{margin:0;color:var(--muted);max-width:90ch}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font-body)}
svg.bg{background:var(--bg);border-radius:6px}
.sc{display:none;flex-direction:column;gap:12px}
.sc.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.seg,.mtabs{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.mtabs button{font-size:13.5px;padding:6px 11px}
.lbl{display:block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;color:var(--hl)}
.kpi span{color:var(--muted);font-size:13px}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.pbtn{font-size:13px;padding:5px 11px}
.ins{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cmp .c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;border-top:4px solid var(--acc)}
.cmp .c h4{margin:0 0 4px;font-size:15px}
.cmp .c p{margin:4px 0;font-size:13.5px}
.mhead h3{margin:0;font-size:21px;font-family:var(--font-display)}
.mhead .de{color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:12px}
.steps{counter-reset:s;list-style:none;padding:0;margin:4px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 4px 30px;font-size:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0}
.figs div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.figs b{display:block;font-size:17px;color:#1F7A36}
.figs span{font-size:12px;color:var(--muted)}
.pc{display:grid;grid-template-columns:1fr 1fr .8fr;gap:12px;margin:12px 0 4px}
.pcc{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)}
.pcc ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.pcc li{margin:3px 0}
.pcc p{margin:4px 0 0;font-size:13.5px}
.pcc.pro{border-left:5px solid var(--ok)}
.pcc.con{border-left:5px solid var(--bad)}
.pcc.when{border-left:5px solid var(--acc2)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
table.t tr:last-child td{border-bottom:0}
.ctl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:2px 0 8px}
.ctl label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.ctl label b{color:var(--fg);font-weight:600;min-width:92px;font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:170px;accent-color:var(--hl)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.lk{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.lk:hover{border-color:var(--hl)}
.lk b{display:block;font-size:16px;margin-bottom:2px}
.lk span{font-size:13px;color:var(--muted)}
.lk em{display:block;font-style:normal;font-size:12px;color:var(--hl);margin-top:6px;font-family:var(--font-mono)}
details{font-size:12px;color:var(--muted)}
details ol{columns:2;column-gap:28px;margin:8px 0 0}
details li{break-inside:avoid;margin-bottom:4px}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:860px){.grid2,.pc{grid-template-columns:1fr}}
@media (max-width:760px){header{flex-direction:column}details ol{columns:1}}
</style>
<script src="staple_spinning_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="scenes" id="scenes" role="group"></div>
  <section class="caption" aria-live="polite"><h2 id="ctitle"></h2><p id="ctext"></p></section>

  <!-- 0 process lines -->
  <div class="sc" id="sc0">
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <div class="seg" id="rseg"></div>
      <svg id="rsvg" viewBox="0 0 1100 250" role="img" style="margin-top:10px"></svg>
      <p class="note" id="rtxt"></p>
    </div>
  </div>
  <!-- 1 processes in detail -->
  <div class="sc" id="sc1">
    <div class="mtabs" id="ptabs"></div>
    <div class="card">
      <div class="mhead"><h3 id="pname"></h3><div class="de" id="pde"></div></div>
      <div class="mtabs" id="pvar" style="margin-top:10px"></div>
      <svg class="bg" id="psvg" viewBox="0 0 900 320" role="img" style="margin-top:8px"></svg>
      <div class="stepbar" id="pbar"></div>
      <div class="grid2">
        <div><span class="lbl" id="lhow"></span><ol class="steps" id="psteps"></ol></div>
        <div><span class="lbl" id="lfigs"></span><div class="figs" id="pfigs"></div></div>
      </div>
      <div class="pc" id="ppc"></div>
    </div>
  </div>
  <!-- 2 spinning systems compared -->
  <div class="sc" id="sc2">
    <div class="card"><svg id="ysvg" viewBox="0 0 1000 200" role="img"></svg></div>
    <div class="card tblwrap"><table class="t" id="vtab"></table><p class="note" id="vnote"></p></div>
  </div>
  <!-- 3 twist and speed -->
  <div class="sc" id="sc3">
    <div class="card">
      <div class="ctl">
        <label><span id="twL"></span> <input type="range" id="tw" min="400" max="1200" step="20" value="800"><b id="twv"></b></label>
        <label><span id="spL"></span> <input type="range" id="sp" min="8000" max="25000" step="500" value="18000"><b id="spv"></b></label>
        <label><span id="roL"></span> <input type="range" id="ro" min="60000" max="150000" step="5000" value="120000"><b id="rov"></b></label>
      </div>
      <svg id="dsvg" viewBox="0 0 1000 170" role="img"></svg>
      <p class="note" id="dnote"></p>
    </div>
  </div>
  <!-- 4 wool + module links -->
  <div class="sc" id="sc4">
    <div class="cmp" id="wcards"></div>
    <span class="lbl" id="lkL" style="margin-top:6px"></span>
    <div class="links" id="links"></div>
  </div>

  <p class="note" id="note"></p>
  <details><summary id="srcsum"></summary><ol id="srclist"></ol></details>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let lang=params.get('lang')||'de';if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const PAUSED=params.get('paused')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches&&params.get('paused')!=='0';
const T=()=>TEXTS[lang];
const NSC=5;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// rough text width (CJK = 1 em) - used to shrink SVG labels that would overflow their slot
const isCJK=ch=>/[⺀-鿿＀-￯　-〿]/.test(ch);
const textW=(t,s,w)=>{let n=0;for(const ch of String(t))n+=isCJK(ch)?1:/[A-Z0-9%]/.test(ch)?.64:ch===' '?.3:.54;return n*s*(w>=600?1.05:1)};
const TX=(x,y,t,c='var(--fg)',a='middle',w=600,s=12,max=0)=>{
  let sz=s,adj='';
  if(max){const e=textW(t,s,w);if(e>max){sz=Math.max(s*.8,s*max/e);if(textW(t,sz,w)>max)adj=` textLength="${max}" lengthAdjust="spacingAndGlyphs"`}}
  return `<text x="${x}" y="${y}" font-size="${+sz.toFixed(1)}" text-anchor="${a}" fill="${c}" font-weight="${w}"${adj}>${esc(t)}</text>`;
};
const Tm=(x,y,t,a='middle',max=0)=>TX(x,y,t,'var(--muted)',a,400,11,max);
// muted label on a background plate (centred), e.g. where a line runs through
const Tb=(x,y,t,max=0)=>{const w=Math.min(max||1e9,textW(t,11,400))+10;return `<rect x="${x-w/2}" y="${y-12}" width="${w}" height="17" rx="4" fill="var(--bg)" opacity=".94"/>`+Tm(x,y,t,'middle',max)};
// split a text into lines of at most max px (words; CJK per character)
function wrapT(t,s,w,max){
  const parts=/\s/.test(t)?t.split(/\s+/):Array.from(t);const sep=/\s/.test(t)?' ':'';
  const out=[];let cur='';
  parts.forEach(p=>{const n=cur?cur+sep+p:p;if(cur&&textW(n,s,w)>max){out.push(cur);cur=p}else cur=n});
  if(cur)out.push(cur);return out;
}
const num=(v,d=0)=>T().ui.loc==='none'?v.toFixed(d):v.toLocaleString(T().ui.loc,{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/[’'  ]/g,' ');
const FIB='#1864AB',HL='var(--acc)',HLF='#FBEBDD',HLR='#F6D9C2';

// ── language-neutral data (texts in staple_spinning_texts.js, same order)
const PIDS=['putzerei','karde','strecke','kaemmen','flyer','ring','rotor','luft'];
const STT={putzerei:[0,.22,.42,.62,.82],karde:[0,.18,.36,.62,.8],strecke:[0,.2,.4,.62,.82],kaemmen:[0,.25,.5,.7,.9],
  flyer:[0,.25,.5,.75],ring:[0,.25,.5,.75],rotor:[0,.2,.4,.6,.8],luft:[0,.3,.55,.8]};
const VARS=['konv','kompakt'];
const NODES={putzerei:[70,130],karde:[225,130],strecke1:[380,80],kvor:[380,195],kaemmen:[535,195],strecke:[690,80],flyer:[845,40],ring:[1020,40],rotor:[1020,135],luft:[1020,220]};
const NLINK={putzerei:'putzerei',karde:'karde',strecke1:'strecke',strecke:'strecke',kvor:'kaemmen',kaemmen:'kaemmen',flyer:'flyer',ring:'ring',rotor:'rotor',luft:'luft'};
const RK=['kard','gek','rotor','luft'];
const ROUTES={kard:[['putzerei','karde'],['karde','strecke1'],['strecke1','strecke'],['strecke','flyer'],['flyer','ring']],
  gek:[['putzerei','karde'],['karde','kvor'],['kvor','kaemmen'],['kaemmen','strecke'],['strecke','flyer'],['flyer','ring']],
  rotor:[['putzerei','karde'],['karde','strecke1'],['strecke1','rotor']],
  luft:[['putzerei','karde'],['karde','strecke1'],['strecke1','strecke'],['strecke','luft']]};
const EDGES=[['putzerei','karde'],['karde','strecke1'],['karde','kvor'],['kvor','kaemmen'],['kaemmen','strecke'],['strecke1','strecke'],['strecke1','rotor'],['strecke','flyer'],['strecke','luft'],['flyer','ring']];
const LINK_KEYS=['air_jet_spinning','filament_spinning','weaving_preparation','circular_knitting','textile_dyeing'];
const SOURCES=['Textiles Committee (India) – process sequence carded, combed, open-end','Teaching material blow room – opening, cleaning, fibre loss','Teaching material – tuft sizes in the blow room',
 'Teaching material – bale plucking, 200 kg → 10 g','Textile Details – blow-room line, cleaning principle','Lecture carding – 40,000 fibres, 1 % short fibres',
 'Carding machine – operating principle, point against point','Fibre2Fashion – the carding process, flats','Teaching material – licker-in, stripping action',
 'Lecture – cleaning efficiency of blow room + card 95–99 %','Teaching material draw frame – 4–8 slivers, draft 4–8','Teaching material draw frame – 350–800 m/min, autolevelling',
 'Teaching material – autolevelling CV 4–6 % → 1–2 %','NPTEL – introduction to combing, noil','Teaching material – combing cycle, noil 8–25 %',
 'US patent 7845054 – nipper, circular comb, top comb','Teaching material roving frame – draft, twist','Teaching material – protective twist 25–70 T/m',
 'US patent 7661259 – roving frame 20–25 m/min, protective twist','Principles of Short Staple Spinning – ring spinning, spinning triangle','Rings and travellers – friction rises with speed',
 'FTEE 2019 – compact spinning, spinning triangle','Teaching material compact spinning – 10 % less twist','FTEE – compact yarn: 20 % less twist',
 'Textile Learner – rotor spinning, wrapper fibres','Textile Learner – rotor 32.5–54 mm, Ne 5–40','Open-end rotor spinning – twist = rotor speed ÷ delivery speed',
 'Teaching material – ring Ne 6–200, rotor Ne 3–60','Textile World – spinning with an air jet, speeds','Textile Learner – vortex spinning, core-sheath',
 'Fibre2Fashion – air-jet spinning not coarser than Ne 12','Teaching material wool spinning – wool on the short-staple line','Woolwise – worsted, woollen, semi-worsted',
 'Woolmark – worsted top making'];

let scene=Math.max(0,Math.min(NSC-1,parseInt(params.get('scene')||'0',10)||0));

// ── helpers
const bars=[];
function mkBar(id,o){
  const el=$(id);
  el.innerHTML=`<button type="button" class="pbtn" data-a="p"></button><button type="button" class="pbtn" data-a="t"></button><button type="button" class="pbtn" data-a="n"></button><span class="ins" data-a="l"></span>`;
  const q=a=>el.querySelector(`[data-a=${a}]`);
  let last={};
  const set=(a,v)=>{if(last[a]!==v){last[a]=v;q(a).textContent=v}};
  const upd=()=>{const u=T().ui;set('p',u.prev);set('n',u.next);set('t',o.isPlay()?u.pause:u.play);set('l',o.label())};
  q('p').onclick=()=>{o.prev();upd()};q('n').onclick=()=>{o.next();upd()};q('t').onclick=()=>{o.toggle();upd()};
  bars.push(upd);upd();return upd;
}
function segBtns(el,keys,labels,cur,cb){
  el.innerHTML=keys.map((k,i)=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${esc(labels[i])}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>cb(b.dataset.k));
}
function openModule(key){
  if(EMBED){document.title='open:'+key;return}
  location.href=key+'.html?lang='+encodeURIComponent(lang);
}
const lerp=(a,b,u)=>a+(b-a)*Math.max(0,Math.min(1,u));
const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const tri=u=>1-Math.abs((u%1)*2-1);
function roll(x,y,r,ang,o={}){let s=`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||'#e9ecef'}" stroke="${o.s||'#495057'}" stroke-width="${o.w||1.5}"/>`;
  const n=o.n||2;for(let i=0;i<n;i++){const a=ang+i*Math.PI/n;s+=`<line x1="${x-Math.cos(a)*(r-3)}" y1="${y-Math.sin(a)*(r-3)}" x2="${x+Math.cos(a)*(r-3)}" y2="${y+Math.sin(a)*(r-3)}" stroke="#868e96" stroke-width="1"/>`}
  if(o.teeth){for(let i=0;i<o.teeth;i++){const a=ang+i*2*Math.PI/o.teeth;s+=`<line x1="${x+Math.cos(a)*r}" y1="${y+Math.sin(a)*r}" x2="${x+Math.cos(a)*(r+5)}" y2="${y+Math.sin(a)*(r+5)}" stroke="#495057" stroke-width="1.2"/>`}}
  return s;}
const box=(x,y,w,h,on,lab,max=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${on?HLF:'var(--panel)'}" stroke="${on?HL:'#495057'}" stroke-width="${on?2:1.3}"/>`+(lab?Tm(x+w/2,y+h+15,lab,'middle',max):'');
const zoneOf=(st,t)=>{let k=0;st.forEach((a,i)=>{if(t>=a-0.004)k=i});return k};
const cap=(y,txt)=>TX(450,y,txt,HL,'middle',600,14,860);
const PR=id=>T().proc[PIDS.indexOf(id)];
const prof=(x0,y,len,amp,seed,off,col,w)=>{let d=`M${x0} ${y}`;for(let i=0;i<=len;i+=6){const v=Math.sin((i+off)*0.05+seed)*amp+Math.sin((i+off)*0.13+seed*2)*amp*0.6;d+=` L${x0+i} ${y+v}`}return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`};

// ── 1 process diagrams (t = 0..1 cycle, z = step index)
const D={};
D.putzerei=(t,z)=>{
  const P=PR('putzerei'),L=P.lab;let s='';
  for(let i=0;i<5;i++){const h=50+((i*37)%25);s+=`<rect x="${30+i*62}" y="${290-h}" width="54" height="${h}" fill="#fff4e6" stroke="#868e96"/>`}
  s+=Tm(185,310,L.bales,'middle',320);
  const px=40+tri(t*2)*250;
  s+=box(px-10,175,70,40,z===0,'')+roll(px+25,222,10,t*60,{teeth:10});
  s+=`<path d="M${px+25} 175 L${px+25} 60 L430 60 L430 100" fill="none" stroke="${z===1?HL:'#adb5bd'}" stroke-width="10" opacity=".55" stroke-linejoin="round"/>`;
  for(let k=0;k<6;k++){const u=(t*3+k/6)%1;const h1=115,h2=430-px-25,tot=h1+h2+40;const d=u*tot;let p;
    if(d<h1)p=[px+25,175-d];else if(d<h1+h2)p=[px+25+(d-h1),60];else p=[430,60+(d-h1-h2)];
    s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#868e96"/>`}
  s+=box(380,100,140,120,z===2,L.clean,190);
  s+=roll(450,150,32,t*40,{teeth:16});
  for(let i=0;i<9;i++)s+=`<line x1="${410+i*10}" y1="196" x2="${414+i*10}" y2="204" stroke="#495057" stroke-width="2"/>`;
  if(z===2)for(let k=0;k<5;k++){const y=205+((t*600+k*17)%15);s+=`<circle cx="${415+k*16}" cy="${y}" r="2.2" fill="#8d6e63"/>`}

  const dt=Math.min(100,now-last);last=now;
  if(play){tt=(tt+dt/SPD)%1;if(scene===1)drawP()}
  requestAnimationFrame(loop);
}

// ── 0 process lines
let rk='kard';
function drawRoute(){
  const t=T().route,E=ROUTES[rk],on=new Set(E.flat());
  segBtns($('rseg'),RK,t.seg,rk,k=>{rk=k;drawRoute()});
  let s=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E07B39"/></marker></defs>`;
  EDGES.forEach(([a,b])=>{const A=NODES[a],B=NODES[b],o=E.some(e=>e[0]===a&&e[1]===b);
    s+=`<path d="M${A[0]+66} ${A[1]} C ${A[0]+100} ${A[1]}, ${B[0]-100} ${B[1]}, ${B[0]-70} ${B[1]}" fill="none" stroke="${o?HL:'#DDE2DB'}" stroke-width="${o?3:2}" ${o?'marker-end="url(#ar)"':''}/>`});
  Object.entries(NODES).forEach(([id,[x,y]])=>{const o=on.has(id),sel=NLINK[id]===cur;
    s+=`<g class="node" data-id="${id}" style="cursor:pointer"><rect x="${x-66}" y="${y-21}" width="132" height="42" rx="8" fill="${o?'var(--panel)':'var(--bg)'}" stroke="${sel&&o?'#000':o?HL:'var(--line)'}" stroke-width="${sel&&o?2.6:o?2:1}" opacity="${o?1:.65}"/>`+
      TX(x,y+5,t.nodes[id],o?'var(--fg)':'var(--muted)','middle',o?700:500,13,120)+`</g>`});
  $('rsvg').innerHTML=s;$('rsvg').setAttribute('aria-label',T().scenes[0].k);$('rtxt').textContent=t.txt[RK.indexOf(rk)];
  $('rsvg').querySelectorAll('.node').forEach(g=>g.onclick=()=>{showP(NLINK[g.dataset.id]);go(1)});
}

// ── 2 comparison
function drawCmp(){
  const t=T().cmp;let s='';
  t.struct.forEach((p,k)=>{const x0=20+k*245,y=90;
    s+=TX(x0+110,25,p[0],'var(--fg)','middle',700,14,230);
    wrapT(p[1],11,400,225).slice(0,3).forEach((ln,i)=>{s+=Tm(x0+110,162+i*16,ln,'middle',230)});
    if(k<3)for(let i=0;i<16;i++)s+=`<line x1="${x0+i*13}" y1="${y+18}" x2="${x0+14+i*13}" y2="${y-18}" stroke="${FIB}" stroke-width="3"/>`;
    if(k===0)for(let i=0;i<14;i++){const xx=x0+8+i*15,up=i%2;s+=`<path d="M${xx} ${up?y-18:y+18} q 5 ${up?-14:14} 14 ${up?-20:20}" fill="none" stroke="${FIB}" stroke-width="1.2"/>`}
    if(k===1)for(let i=0;i<3;i++){const xx=x0+30+i*70;s+=`<path d="M${xx} ${y-18} q 4 -6 10 -9" fill="none" stroke="${FIB}" stroke-width="1.2"/>`}
    if(k===2)for(let i=0;i<4;i++){const xx=x0+20+i*55;s+=`<rect x="${xx}" y="${y-22}" width="10" height="44" rx="3" fill="${HL}" opacity=".85"/>`}
    if(k===3){for(let i=0;i<7;i++)s+=`<line x1="${x0}" y1="${y-15+i*5}" x2="${x0+215}" y2="${y-15+i*5}" stroke="${FIB}" stroke-width="2"/>`;
      for(let i=0;i<10;i++)s+=`<line x1="${x0+5+i*21}" y1="${y+20}" x2="${x0+17+i*21}" y2="${y-20}" stroke="${HL}" stroke-width="2.2"/>`}});
  $('ysvg').innerHTML=s;$('ysvg').setAttribute('aria-label',T().scenes[2].k);
  $('vtab').innerHTML=`<tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`+t.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td>${r.slice(1).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  $('vnote').textContent=t.note;
}

// ── 3 twist and speed
function calc(){
  const t=T().twist,tw=+$('tw').value,sp=+$('sp').value,ro=+$('ro').value;
  $('twL').textContent=t.tw;$('spL').textContent=t.sp;$('roL').textContent=t.ro;
  $('twv').textContent=num(tw)+' '+t.tpm;$('spv').textContent=num(sp)+' '+t.rpm;$('rov').textContent=num(ro)+' '+t.rpm;
  const vr=sp/tw,vo=ro/tw,mx=Math.max(vo,450);
  const bar=(y,l,v,c,why)=>{const w=Math.max(2,v/mx*420);
    return TX(220,y+18,l,'var(--fg)','end',600,13,210)+`<rect x="230" y="${y}" width="${w}" height="26" rx="4" fill="${c}"/>`+
      TX(238+w,y+18,`${num(v,v<100?1:0)} m/min`,'var(--fg)','start',700,12)+Tm(238+w+textW(`${num(v,v<100?1:0)} m/min`,12,700)+8,y+18,why,'start',Math.max(80,990-(246+w+textW(`${num(v,v<100?1:0)} m/min`,12,700))))};
  $('dsvg').innerHTML=bar(15,t.bars[0],vr,'var(--acc2)',t.why[0])+bar(65,t.bars[1],vo,'var(--acc)',t.why[1])+bar(115,t.bars[2],450,'var(--ok)',t.why[2]);
  $('dsvg').setAttribute('aria-label',T().scenes[3].k);$('dnote').textContent=t.note;
}
['tw','sp','ro'].forEach(i=>$(i).oninput=calc);

// ── 4 wool + links
function drawWool(){
  const t=T();
  $('wcards').innerHTML=t.wool.map(c=>`<div class="c"><h4>${esc(c[0])}</h4><p>${esc(c[1])}</p></div>`).join('');
  $('lkL').textContent=t.ui.lkL;
  $('links').innerHTML=t.links.map((l,i)=>`<button type="button" class="lk" data-k="${LINK_KEYS[i]}"><b>${esc(l[0])} →</b><span>${esc(l[1])}</span><em>${esc(t.ui.open)}</em></button>`).join('');
  $('links').querySelectorAll('.lk').forEach(b=>b.onclick=()=>openModule(b.dataset.k));
}

// ── scenes / language
function go(i){
  scene=(i+NSC)%NSC;
  for(let k=0;k<NSC;k++)$('sc'+k).classList.toggle('on',k===scene);
  $('scenes').querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-pressed',k===scene));
  const sc=T().scenes[scene];$('ctitle').textContent=sc.title;$('ctext').textContent=sc.text;
  if(scene===1)drawP();
  if(EMBED)document.title='scene:'+scene;
}
function applyLang(){
  const t=T(),u=t.ui;document.documentElement.lang=lang;
  $('eyebrow').textContent=u.eyebrow;$('h1').textContent=u.h1;$('lead').textContent=u.lead;$('note').textContent=u.note;
  $('srcsum').textContent=u.sources;$('srclist').innerHTML=SOURCES.map(x=>`<li>${esc(x)}</li>`).join('');
  $('kpis').innerHTML=t.kpis.map(k=>`<div class="kpi"><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join('');
  $('scenes').innerHTML=t.scenes.map((s,i)=>`<button type="button" data-i="${i}">${esc(s.k)}</button>`).join('');
  $('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $('langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  const keepT=tt;showP(cur);tt=keepT;drawP();
  drawCmp();calc();drawWool();
  bars.forEach(f=>f());go(scene);
}
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
if(PAUSED)tt=STEP0(cur);
applyLang();
requestAnimationFrame(now=>{last=now;loop(now)});
})();
</script>
</body>
</html>
