<title>Coating and Laminating</title>
<!-- Knowledge-Base-Modul (ui/screen_onboarding.py), Oberkapitel "Textiles Wissen" > Beschichten und Kaschieren (Nutzerwunsch 2026-11-09,
     Inhalt aus Internet-Recherche: Auftragsmenge, Rakelverfahren, Transferbeschichtung, PVC-Plastisol, Polymere, Membranen,
     Kaschierverfahren, Lagenaufbau und Pruefwerte). Gleiches Muster wie textile_dyeing.html. Texte in coating_texts.js (de/en/es/zh).
     ?lang=xx, window.setLang('xx'), window.goScene(i), ?embedded=1 (ohne eigenen Kopf/Szenen-Knoepfe, meldet die Szene per
     document.title "scene:n"), ?scene=n&paused=1 fuer Screenshots. Keine externen Ressourcen. Szenen wechseln nie automatisch.
     Regler pro Szene (Auftrag, Rakel, Traeger, Temperatur, Polymer, Membran, Verfahren, Lagen). Quiz ueber quiz.js (TEXTS[lang].quiz).
     Links unten oeffnen andere Module (LINK_KEYS): eingebettet per document.title "open:<key>", sonst <key>.html. -->
<style>
:root{
  --bg:#F4F6F3;--panel:#FFFFFF;--line:#DADFD8;--fg:#1C2321;--muted:#5A6460;
  --hl:#39A650;--air:#2386C8;--heat:#E07B39;--indigo:#27408B;
  --font-display:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft YaHei",sans-serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:Consolas,"Microsoft YaHei",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 36px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:70ch}
.langs{display:flex;gap:4px;flex-shrink:0}
.langs[hidden]{display:none}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:16/9}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.scenes{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.scenes button[aria-pressed="true"],.langs button[aria-pressed="true"]{background:#000;color:var(--hl);border-color:#000}
.scenes button span{font-family:var(--font-mono);font-size:12px;opacity:.7}
.right{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.slider{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.slider[hidden]{display:none}
.slider input{accent-color:var(--hl);width:170px}
.slider output{min-width:7em;color:var(--fg)}
.play{min-width:120px;justify-content:center}
.caption{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;border-top:1px solid var(--line);padding-top:16px}
.caption h2{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 8px}
.caption p{margin:0 0 10px;max-width:70ch}
.now{font-family:var(--font-mono);font-size:13px;color:var(--hl);min-height:1.5em}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.facts li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.facts b{font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.note{font-size:12px;color:var(--muted);margin:0}
.lkL{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lk{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.lk:hover{border-color:var(--hl)}
.lk b{display:block;font-size:16px;margin-bottom:2px}
.lk span{font-size:13px;color:var(--muted)}
.lk em{display:block;font-style:normal;font-size:12px;color:var(--hl);margin-top:6px;font-family:var(--font-mono)}
body.quizmode .lkL,body.quizmode .links{display:none}
body.embedded header,body.embedded .scenes{display:none}
body.embedded{padding-top:12px}
@media (max-width:760px){.caption{grid-template-columns:1fr;gap:14px}.facts li{grid-template-columns:96px minmax(0,1fr)}header{flex-direction:column}}
</style>

<script src="coating_texts.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="stage"><canvas id="cv" width="1600" height="900"></canvas></div>
  <div class="controls">
    <div class="scenes" id="scenes" role="group"></div>
    <div class="right">
      <label class="slider" id="swrap"><span id="slab"></span>
        <input id="sl" type="range" min="0" max="4" step="1" value="0"><output id="sout"></output></label>

    </div>

    <div><h2 id="ctitle"></h2><p class="now" id="cnow"></p><p id="ctext"></p></div>
    <ul class="facts" id="cfacts"></ul>
  </section>
  <div class="lkL" id="lkL"></div>
  <div class="links" id="links"></div>
  <p class="note" id="note"></p>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');const W=1600,H=900;
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={bg:css('--panel'),line:css('--line'),fg:css('--fg'),muted:css('--muted'),hl:css('--hl'),air:css('--air'),heat:css('--heat'),indigo:css('--indigo'),
  fab:'#F7F4EC',fabLine:'#C9BFAA',steel:'#8C979B',steelD:'#5F6A6E',belt:'#3E4A4F',ink:'#C2185B',inkL:'#F3C4D6',paper:'#FBF8F0',steam:'#DDE7EE',nickel:'#B8C0C4'};
const PC=['#C2185B','#1E88C8','#F2B705','#2E7D32','#6A1B9A','#E65100'];
const MONO=css('--font-mono'),DISP=css('--font-display'),SANS=css('--font-body');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const params=new URLSearchParams(location.search);
let lang=params.get('lang')||'de';if(!TEXTS[lang])lang='de';
const EMBED=params.get('embedded')==='1';if(EMBED){$('langs').hidden=true;document.body.classList.add('embedded')}
const T=()=>TEXTS[lang],CV=()=>TEXTS[lang].cv;
const fmt=(s,o)=>String(s).replace(/\{(\w+)\}/g,(_,k)=>o[k]);
let fitW=0;function fit(){const w=cv.getBoundingClientRect().width||W;if(w===fitW&&cv.width>0)return;fitW=w;const d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(w*d));cv.height=Math.max(1,Math.round(w*9/16*d))}
addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);fit();
const smooth=(a,b,x)=>{const q=Math.max(0,Math.min(1,(x-a)/(b-a)));return q*q*(3-2*q)},lerp=(a,b,q)=>a+(b-a)*q,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hx=c=>c[0]==='#'?[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)):c.match(/[\d.]+/g).slice(0,3).map(Number);
const hsh=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const mix=(c1,c2,q)=>{const a=hx(c1),b=hx(c2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],q))).join(',')})`};
let rs=1;const rnd=()=>{rs=(rs*16807)%2147483647;return(rs-1)/2147483646};

// ── scenes: slider config (key into ui texts, min, max, default) ─────────────
const NSC=8;
const SL=[{k:'add',min:10,max:600,def:120,step:10},{k:'knife',min:0,max:2,def:0},{k:'sub',min:0,max:1,def:1},{k:'temp',min:140,max:220,def:190,step:10},
  {k:'poly',min:0,max:3,def:0},{k:'mem',min:0,max:1,def:0},{k:'lam',min:0,max:3,def:0},{k:'lay',min:0,max:2,def:0}];
const SV=SL.map(s=>s?s.def:0);
let scene=clamp(parseInt(params.get('scene')||'0',10)||0,0,NSC-1),sceneT=0,t=0,auto=!reduce&&params.get('paused')!=='1',lastNow='';

// ── text helpers ──────────────────────────────────────────────────────────────
function label(s,x,y,o={}){ctx.font=`${o.w||500} ${o.s||20}px ${o.f||SANS}`;ctx.fillStyle=o.c||C.muted;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.globalAlpha=o.al??1;
  if(o.mw&&ctx.measureText(s).width>o.mw){const k=o.mw/ctx.measureText(s).width;ctx.font=`${o.w||500} ${Math.max(10,(o.s||20)*k)}px ${o.f||SANS}`}
  ctx.fillText(s,x,y);ctx.globalAlpha=1}
// wraps text into lines of max width; Chinese wraps per character
function wrap(s,x,y,mw,o={}){ctx.font=`${o.w||500} ${o.s||18}px ${o.f||SANS}`;const cjk=/[　-鿿]/.test(s);const parts=cjk?[...s]:String(s).split(' ');
  const lines=[];let line='';for(const p of parts){const tst=line?(cjk?line+p:line+' '+p):p;if(ctx.measureText(tst).width>mw&&line){lines.push(line);line=p}else line=tst}if(line)lines.push(line);
  const lh=o.lh||(o.s||18)*1.35;lines.forEach((l,i)=>label(l,x,y+i*lh,{...o,a:o.a||'left'}));return lines.length*lh}
function now(s){if(s!==lastNow){lastNow=s;$('cnow').textContent='▸ '+s}}
function box(x,y,w,h,fill,stroke,r=10,lw=1.5){ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();if(stroke)ctx.stroke()}
function arrow(x1,y1,x2,y2,c,lw=2.5){ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-12*Math.cos(a-.4),y2-12*Math.sin(a-.4));ctx.lineTo(x2-12*Math.cos(a+.4),y2-12*Math.sin(a+.4));ctx.closePath();ctx.fill()}
function circ(x,y,r,fill,stroke,lw=1.5){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
// woven fabric texture in a rectangle
function weave(x,y,w,h,col=C.fab,ln=C.fabLine,step=14){box(x,y,w,h,col,ln,4,1.2);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.strokeStyle=ln;ctx.globalAlpha=.35;ctx.lineWidth=1;
  for(let i=x+step/2;i<x+w;i+=step){ctx.beginPath();ctx.moveTo(i,y);ctx.lineTo(i,y+h);ctx.stroke()}for(let j=y+step/2;j<y+h;j+=step){ctx.beginPath();ctx.moveTo(x,j);ctx.lineTo(x+w,j);ctx.stroke()}ctx.restore()}
// flower motif path (used on swatches)
function flower(x,y,r){ctx.beginPath();for(let k=0;k<5;k++){const a=k/5*Math.PI*2-Math.PI/2;ctx.moveTo(x+Math.cos(a)*r*.55+r*.42,y+Math.sin(a)*r*.55);ctx.arc(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,r*.42,0,Math.PI*2)}}
// motif element j inside a repeat tile (flat + rotary screen)
function element(j,x,y,w,h){ctx.fillStyle=PC[j];ctx.beginPath();
  if(j===0)ctx.roundRect(x+w*.08,y+h*.12,w*.84,h*.22,6);
  else if(j===1){ctx.arc(x+w*.32,y+h*.6,Math.min(w,h)*.2,0,Math.PI*2)}
  else if(j===2){ctx.moveTo(x+w*.62,y+h*.42);ctx.lineTo(x+w*.9,y+h*.88);ctx.lineTo(x+w*.36,y+h*.88);ctx.closePath()}
  else if(j===3)ctx.rect(x+w*.08,y+h*.82,w*.84,h*.07);
  else if(j===4){ctx.arc(x+w*.32,y+h*.6,Math.min(w,h)*.08,0,Math.PI*2)}
  else {ctx.arc(x+w*.8,y+h*.5,Math.min(w,h)*.07,0,Math.PI*2)}
  ctx.globalAlpha=.88;ctx.fill();ctx.globalAlpha=1}

const PCOL={pvc:'#3F7CC4',pu:'#E07B39',sil:'#9C7BC0',ptfe:'#7FB8B0',glue:'#E0A100'};
// fabric cross-section: row of yarn ellipses
function fabricX(x0,x1,y,col,ry=14,rx=17){for(let x=x0+rx;x<x1;x+=rx*2.1){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=col||C.fab;ctx.fill();ctx.strokeStyle=C.fabLine;ctx.lineWidth=1.2;ctx.stroke()}
  ctx.strokeStyle=C.fabLine;ctx.lineWidth=3;ctx.beginPath();for(let x=x0;x<=x1;x+=4){const y2=y+Math.sin((x-x0)/(rx*2.1)*Math.PI)*ry*.9;x===x0?ctx.moveTo(x,y2):ctx.lineTo(x,y2)}ctx.stroke()}
function drop(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y-r*1.6);ctx.quadraticCurveTo(x+r,y-r*.2,x+r,y+r*.2);ctx.arc(x,y+r*.2,r,0,Math.PI);ctx.quadraticCurveTo(x-r,y-r*.2,x,y-r*1.6);ctx.fill()}

// ── 1 Grundlagen ──────────────────────────────────────────────────────────────
function scene1(){const a=SV[0],c=CV(),f=c.gr,x0=100,x1=740,th=6+a/600*150;
  label(f.coat,x0,150,{a:'left',s:18,c:C.fg,w:600});
  const y=330;ctx.fillStyle=mix(PCOL.pvc,'#ffffff',.25);ctx.beginPath();ctx.moveTo(x0,y-th);ctx.lineTo(x1,y-th);ctx.lineTo(x1,y+4);ctx.lineTo(x0,y+4);ctx.closePath();ctx.fill();
  fabricX(x0,x1,y+20);label(fmt(f.thick,{g:a}),x1+20,y-th/2,{a:'left',s:16,c:PCOL.pvc,w:600});label(f.fabric,x1+20,y+22,{a:'left',s:15,c:C.fg});
  // ranges
  const sy=470,X=g=>x0+g/600*(x1-x0);label(f.ranges,x0,sy-34,{a:'left',s:16,c:C.fg,w:600});ctx.fillStyle='#EEF0EE';ctx.fillRect(x0,sy,x1-x0,16);
  f.rng.forEach(([l,lo,hi],k)=>{const yy=sy+44+k*40,on=a>=lo&&a<=hi;ctx.fillStyle=on?C.hl:'#CFD6D2';ctx.fillRect(X(lo),yy,X(hi)-X(lo),14);label(l,X(hi)+10,yy+7,{a:'left',s:14,c:on?C.fg:C.muted,w:on?600:500})});
  ctx.fillStyle=C.fg;ctx.beginPath();ctx.moveTo(X(a),sy-2);ctx.lineTo(X(a)-8,sy-14);ctx.lineTo(X(a)+8,sy-14);ctx.closePath();ctx.fill();[0,100,200,300,400,500,600].forEach(g=>label(g+'',X(g),sy+28,{s:12,f:MONO}));
  // coat vs laminate panel
  const px=1000;[[f.cT,f.cD,0],[f.lT,f.lD,1]].forEach(([t,d,k])=>{const yy=150+k*330;box(px,yy,520,300,C.bg,C.line,12);label(t,px+20,yy+30,{a:'left',s:20,f:DISP,w:700,c:C.fg});
    const cy=yy+120;if(k===0){ctx.fillStyle=mix(PCOL.pu,'#ffffff',.2);ctx.fillRect(px+40,cy-26,440,20);drop(px+250,cy-60-((sceneT*40)%30),10,PCOL.pu);fabricX(px+40,px+480,cy+6,null,10,12)}
    else{ctx.fillStyle=mix(PCOL.ptfe,'#ffffff',.2);ctx.fillRect(px+40,cy-40-Math.max(0,20-((sceneT*20)%40)),440,10);for(let i=0;i<14;i++)circ(px+60+i*32,cy-18,3,PCOL.glue);fabricX(px+40,px+480,cy+6,null,10,12)}
    wrap(d,px+20,yy+180,480,{s:15,c:C.fg})});
  now(f.rng.filter(r=>a>=r[1]&&a<=r[2]).map(r=>r[0]).join(', ')||f.none)}

// ── 2 Direktbeschichtung (Rakel) ─────────────────────────────────────────────
function scene2(){const m=SV[1],c=CV(),f=c.kn,mm=f.m[m],y=420,x0=80,x1=1180,kx=560,off=(sceneT*60)%40;
  // fabric web
  if(m===0){ctx.strokeStyle=C.fabLine;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x0,y-30);ctx.lineTo(kx,y);ctx.lineTo(x1,y-30);ctx.stroke();circ(x0+20,y-30,26,'#D5DADC',C.steelD,2);circ(x1-20,y-30,26,'#D5DADC',C.steelD,2);label(f.tension,kx,y+70,{s:15,c:C.muted})}
  else{ctx.strokeStyle=C.fabLine;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();circ(kx,y+86,80,'#D5DADC',C.steelD,2);ctx.save();ctx.translate(kx,y+86);ctx.rotate(sceneT);ctx.strokeStyle=C.steelD;ctx.beginPath();ctx.moveTo(-70,0);ctx.lineTo(70,0);ctx.stroke();ctx.restore();label(m===1?f.roll:f.roll,kx,y+190,{s:15,c:C.fg})}
  // coating after knife
  const ct=[6,18,10][m],col=m===2?mix(PCOL.pu,'#ffffff',.55):mix(PCOL.pu,'#ffffff',.2);
  ctx.fillStyle=col;const yy=m===0?(x=>lerp(y,y-30,(x-kx)/(x1-kx))):(x=>y);ctx.beginPath();ctx.moveTo(kx,yy(kx)-4);for(let x=kx;x<=x1;x+=10)ctx.lineTo(x,yy(x)-4-ct);for(let x=x1;x>=kx;x-=10)ctx.lineTo(x,yy(x)-4);ctx.closePath();ctx.fill();
  if(m===2)for(let k=0;k<30;k++)circ(kx+20+((k*37+off)%(x1-kx-20)),y-4-ct/2,3,'#fff');
  // paste bank & knife
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(kx-40,y-30,46,28,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.steelD;ctx.beginPath();ctx.moveTo(kx-8,y-200);ctx.lineTo(kx+8,y-200);ctx.lineTo(kx+4,y-(m===0?2:4+ct));ctx.lineTo(kx-4,y-(m===0?2:4+ct));ctx.closePath();ctx.fill();
  label(f.knife,kx+20,y-180,{a:'left',s:15,c:C.fg});label(f.paste,kx-16,y-74,{a:'right',s:14,c:PCOL.pu});arrow(x0+60,y-110,x0+200,y-110,C.muted,2);label(f.dir,x0+60,y-130,{a:'left',s:14,c:C.muted});
  if(m!==0){ctx.strokeStyle=C.heat;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(kx+30,y-4);ctx.lineTo(kx+30,y-4-ct);ctx.stroke();label(f.gap,kx+40,y-30,{a:'left',s:14,c:C.heat})}
  // dryer
  box(900,y-160,280,100,'#FFF3EA',C.heat,10,2);label(f.dry,1040,y-110,{s:15,c:C.heat,w:600});
  // panel
  const px=1240;box(px,130,280,640,C.bg,C.line,12);label(mm.n,px+20,165,{a:'left',s:20,f:DISP,w:700,c:C.fg,mw:240});label(f.addL,px+20,215,{a:'left',s:13,f:MONO});label(mm.g,px+20,245,{a:'left',s:22,f:DISP,w:700,c:C.hl,mw:240});
  wrap(mm.d,px+20,295,240,{s:15,c:C.fg});now(mm.n)}

// ── 3 Transferbeschichtung ───────────────────────────────────────────────────
function scene3(){const s=SV[2],c=CV(),f=c.tr,y=380,x0=80,x1=1500,st=[160,420,700,980,1260];
  // release paper path
  ctx.strokeStyle='#E8E2D0';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(1260,y);ctx.lineTo(1320,y+160);ctx.stroke();label(f.paper,x0,y+30,{a:'left',s:14,c:C.muted});
  ctx.strokeStyle=C.fabLine;ctx.setLineDash([12,10]);ctx.lineDashOffset=-sceneT*60;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(1260,y);ctx.stroke();ctx.setLineDash([]);
  // layers growing
  ctx.fillStyle=mix(PCOL.pu,'#ffffff',.2);ctx.fillRect(st[0],y-12,1260-st[0],7);ctx.fillStyle=PCOL.glue;ctx.fillRect(st[2],y-18,1260-st[2],6);
  // fabric joins at st[3]
  ctx.strokeStyle=s?'#B9AE98':'#8E9AA0';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(st[3]-120,y-180);ctx.quadraticCurveTo(st[3]-30,y-40,st[3],y-28);ctx.lineTo(x1,y-28);ctx.stroke();
  if(s===1){for(let x=st[3]-110;x<x1;x+=18){ctx.strokeStyle='rgba(120,110,90,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-34,6,Math.PI,Math.PI*2);ctx.stroke()}}
  circ(st[3],y-60,32,'#D5DADC',C.steelD,2);circ(st[3],y+44,32,'#D5DADC',C.steelD,2);
  [[st[0],f.s1],[st[1],f.s2],[st[2],f.s3],[st[3]+60,f.s4],[st[4],f.s5]].forEach(([x,l],k)=>{box(x-90,y+90+(k%2)*70,180,56,C.bg,C.line,8);label(`${k+1}`,x-74,y+118+(k%2)*70,{a:'left',s:18,f:DISP,w:700,c:C.hl});wrap(l,x-50,y+108+(k%2)*70,130,{s:13,c:C.fg,lh:16})});
  [st[1],st[3]+150].forEach(x=>{box(x-70,y-130,140,60,'#FFF3EA',C.heat,8,1.5);label(f.oven,x,y-100,{s:13,c:C.heat})});
  label(f.strip,1340,y+150,{a:'left',s:14,c:C.muted});
  // panel
  box(80,660,1440,150,C.bg,C.line,12);label(f.subs[s],110,690,{a:'left',s:20,f:DISP,w:700,c:C.fg});wrap(s?f.knit:f.woven,110,725,1380,{s:16,c:C.fg});now(f.subs[s])}

// ── 4 PVC-Plane: Plastisol gelieren ──────────────────────────────────────────
function scene4(){const T=SV[3],c=CV(),f=c.pv,q=smooth(150,180,T),over=smooth(205,220,T);
  // process line
  f.line.forEach((s,k)=>{const x=80+k*240,on=k===3;box(x,110,220,74,on?'#FFF3EA':C.bg,on?C.heat:C.line,10,on?3:1.5);wrap(s,x+12,134,196,{s:14,c:C.fg,w:on?600:500,lh:18});if(k<f.line.length-1)arrow(x+222,147,x+238,147,C.muted,2)});
  // microscope view
  const mx=80,my=240,mw=860,mh=380;box(mx,my,mw,mh,'#F7F9FB',C.line,12);label(f.micro,mx+20,my+28,{a:'left',s:16,c:C.fg,w:600});
  ctx.save();ctx.beginPath();ctx.rect(mx+10,my+50,mw-20,mh-60);ctx.clip();
  ctx.fillStyle=mix('#F3F0D8',PCOL.pvc,q*.55);ctx.fillRect(mx,my,mw,mh);
  rs=3;for(let k=0;k<70;k++){const x=mx+30+rnd()*(mw-60),y=my+70+rnd()*(mh-100),r0=14+rnd()*8,r=r0*(1+q*.6);ctx.globalAlpha=1-q*.85;circ(x,y,r,mix('#9DB9DE',PCOL.pvc,q*.5),PCOL.pvc,1.5)}
  ctx.globalAlpha=1;if(over>0){ctx.fillStyle=`rgba(160,110,40,${over*.45})`;ctx.fillRect(mx,my,mw,mh)}ctx.restore();
  label(q<.3?f.sol:q<.9?f.gel:f.fused,mx+mw/2,my+mh-20,{s:16,c:C.fg,w:600});
  // thermometer & panel
  const px=1000;box(px,240,520,380,C.bg,C.line,12);label(T+' °C',px+260,300,{s:48,f:DISP,w:700,c:C.fg});
  const X=t=>px+40+(t-140)/80*440;ctx.fillStyle='#EEF0EE';ctx.fillRect(px+40,360,440,20);ctx.fillStyle='#CFEBD5';ctx.fillRect(X(177),360,X(205)-X(177),20);circ(X(T),370,10,C.heat);label(f.win,(X(177)+X(205))/2,400,{s:13,c:C.hl,w:600});
  [140,160,180,200,220].forEach(t=>label(t+'',X(t),344,{s:12,f:MONO}));
  wrap(T<170?f.low:T<=205?f.ok:f.high,px+30,450,460,{s:17,c:T<170||T>205?C.heat:C.hl,w:600});
  box(80,650,1440,160,C.bg,C.line,12);wrap(f.recipe,110,685,1380,{s:16,c:C.fg});now(T<170?f.low:T<=205?f.ok:f.high)}

// ── 5 Polymere ────────────────────────────────────────────────────────────────
function scene5(){const p=SV[4],c=CV(),f=c.po,pp=f.p[p],col=[PCOL.pvc,PCOL.pu,PCOL.sil,PCOL.ptfe][p];
  f.p.forEach((q,k)=>{const x=80+k*360,on=k===p;box(x,120,340,70,on?mix(col,'#ffffff',.85):C.bg,on?col:C.line,10,on?3:1.5);label(q.n,x+170,155,{s:18,c:C.fg,w:on?700:500,mw:310})});

  box(80,560,720,250,C.bg,C.line,10);wrap(pp.d,100,595,680,{s:16,c:C.fg});now(pp.n)}

// ── 6 Membranen ───────────────────────────────────────────────────────────────
function scene6(){const m=SV[5],c=CV(),f=c.me,mm=f.m[m],x0=80,x1=1000,my=440;
  label(f.out,x0,170,{a:'left',s:15,c:C.air,w:600});label(f.inn,x0,760,{a:'left',s:15,c:C.heat,w:600});
  // membrane
  ctx.fillStyle=m?mix(PCOL.pu,'#ffffff',.3):mix(PCOL.ptfe,'#ffffff',.2);ctx.fillRect(x0,my-18,x1-x0,36);
  if(m===0){ctx.fillStyle='#fff';for(let x=x0+10;x<x1;x+=26){ctx.fillRect(x,my-18,6,36)}}
  else{for(let x=x0+20;x<x1;x+=40){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,my-14);ctx.bezierCurveTo(x+12,my-4,x-12,my+4,x,my+14);ctx.stroke()}}
  box((x0+x1)/2-200,my+30,400,32,'#ffffff',null,6);label(m?f.monoL:f.microL,(x0+x1)/2,my+46,{s:15,c:C.fg,w:600,mw:390});
  // rain drops from above bounce
  for(let k=0;k<9;k++){const ph=(sceneT*.6+hsh(k))%1,x=x0+60+k*100,y=lerp(190,my-40,Math.min(1,ph*1.4));drop(x,y,12,'#4F93D2');if(ph>.7)circ(x+(ph-.7)*80,my-40-(ph-.7)*120,4,'#4F93D2')}
  // vapor from below
  for(let k=0;k<26;k++){const ph=(sceneT*.35+hsh(k+20))%1,x=x0+30+hsh(k+3)*(x1-x0-60);let y=lerp(740,200,ph);
    if(m===1&&y<my+20&&y>my-20){y=my+20-(ph%0.1)*400}ctx.globalAlpha=.75;circ(x,y,4,C.heat);ctx.globalAlpha=1}

  const px=1060;box(px,140,460,320,C.bg,C.line,12);if(m===0)label(f.scaleT,px+20,170,{a:'left',s:16,c:C.fg,w:600});
  if(m===0){[[f.drop,'×20 000',30],[f.pore,'1',8],[f.vap,'÷700',2]].forEach(([l,v,r],k)=>{const yy=230+k*70;circ(px+60,yy,r,[ '#4F93D2',PCOL.ptfe,C.heat][k]);label(l,px+110,yy,{a:'left',s:15,c:C.fg});label(v,px+430,yy,{a:'right',s:15,f:MONO,c:C.fg})});wrap(f.poreNote,px+20,420,420,{s:13,c:C.muted})}
  else wrap(f.monoNote,px+20,215,420,{s:16,c:C.fg});
  box(px,490,460,320,C.bg,C.line,12);label(mm.n,px+20,520,{a:'left',s:20,f:DISP,w:700,c:C.fg,mw:420});wrap(mm.d,px+20,560,420,{s:15,c:C.fg});
  now(mm.n)}

// ── 7 Kaschieren ──────────────────────────────────────────────────────────────
function scene7(){const m=SV[6],c=CV(),f=c.la,mm=f.m[m],y=430,nx=760,off=(sceneT*60)%30;
  // top web (foam or membrane/fabric) coming down to nip
  const topCol=m===0?'#F2E3A6':mix(PCOL.ptfe,'#ffffff',.2),botCol=C.fabLine;
  ctx.strokeStyle=topCol;ctx.lineWidth=m===0?26:10;const tx=m===2?620:120;ctx.beginPath();ctx.moveTo(tx,180);ctx.quadraticCurveTo(nx-100,y-60,nx,y-16);ctx.lineTo(1480,y-14);ctx.stroke();
  ctx.strokeStyle=botCol;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(120,y+20);ctx.lineTo(1480,y+2);ctx.stroke();
  circ(nx,y-70,44,'#D5DADC',C.steelD,2);circ(nx,y+56,44,'#D5DADC',C.steelD,2);label(f.nip,nx+60,y-110,{a:'left',s:14,c:C.fg});
  label(m===0?f.foam:f.top,tx+20,150,{a:'left',s:15,c:C.fg,w:600});label(f.bottom,140,y+50,{a:'left',s:15,c:C.fg,w:600});
  if(m===0){for(let k=0;k<7;k++){const x=430+k*28,h=30+12*Math.sin(sceneT*14+k);ctx.fillStyle=k%2?'#E07B39':'#F2B705';ctx.beginPath();ctx.moveTo(x-10,y-40);ctx.quadraticCurveTo(x,y-40-h,x+10,y-40);ctx.fill()}label(f.flame,500,y-120,{s:15,c:C.heat,w:600})}
  else if(m===1){for(let x=200;x<nx;x+=26)circ(x+off%26,y+12,5,PCOL.glue);box(260,y+40,200,70,'#EEF2F3',C.steelD,35,2);label(f.grav,360,y+130,{s:14,c:C.fg})}
  else if(m===2){for(let k=0;k<40;k++){const x=220+hsh(k)*400,ph=(sceneT*.8+hsh(k+9))%1;circ(x,lerp(y-140,y+12,ph),2.5,PCOL.glue)}box(220,y-180,400,30,'#EEF2F3',C.steelD,6,2);label(f.scatter,420,y-196,{s:14,c:C.fg});box(520,y+30,160,60,'#FFF3EA',C.heat,8,1.5);label(f.ir,600,y+60,{s:13,c:C.heat})}
  else{ctx.strokeStyle=PCOL.glue;ctx.lineWidth=3;ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(120,320);ctx.quadraticCurveTo(nx-150,y-10,nx,y);ctx.stroke();ctx.setLineDash([]);label(f.web,140,300,{a:'left',s:14,c:'#9C7B12',w:600})}
  // result section
  box(80,600,700,210,C.bg,C.line,12);label(mm.n,100,632,{a:'left',s:20,f:DISP,w:700,c:C.fg});wrap(mm.d,100,670,660,{s:15,c:C.fg});
  box(820,600,700,210,C.bg,C.line,12);[[f.proL,mm.pro,C.hl],[f.conL,mm.con,C.heat]].forEach(([l,v,col],k)=>{label(l,840,632+k*90,{a:'left',s:13,f:MONO,c:col,w:600});wrap(v,840,660+k*90,660,{s:15,c:C.fg})});
  now(mm.n)}

// ── 8 Lagenaufbau & Prüfwerte ─────────────────────────────────────────────────
function scene8(){const l=SV[7],c=CV(),f=c.ly,ll=f.l[l],x0=120,x1=640;
  const layers=[[f.outer,'#2E5D8C',22],[f.mem,mix(PCOL.ptfe,'#ffffff',.2),10]];if(l===1)layers.push([f.print,'#C9C2B0',6]);if(l===2)layers.push([f.lining,'#D9D3C4',16]);
  let y=240;label(f.stack,x0,190,{a:'left',s:16,c:C.fg,w:600});layers.forEach(([n,col,h],k)=>{ctx.fillStyle=col;ctx.fillRect(x0,y,x1-x0,h*2);if(k===1&&l===1){for(let x=x0+10;x<x1;x+=24)circ(x,y+h*2+6,4,'#B8AE96')}label(n,x1+20,y+h,{a:'left',s:15,c:C.fg});y+=h*2+8});
  if(l===0){ctx.strokeStyle='#C9C2B0';ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(x0,y+30);ctx.lineTo(x1,y+30);ctx.stroke();ctx.setLineDash([]);label(f.loose,x1+20,y+30,{a:'left',s:15,c:C.muted})}
  box(x0,520,640,290,C.bg,C.line,12);label(ll.n,x0+20,552,{a:'left',s:20,f:DISP,w:700,c:C.fg});wrap(ll.d,x0+20,590,600,{s:15,c:C.fg});
  // water column
  const px=920,ph=290;box(px,150,600,310,C.bg,C.line,12);label(f.hhT,px+20,172,{a:'left',s:16,c:C.fg,w:600});
  const bx=px+40,by=440,X=v=>bx+v/30000*500;f.hh.forEach(([lo,hi,n],k)=>{ctx.fillStyle=['#E6EEF6','#C9DDF0','#9CC2E6','#5E9CD6'][k];ctx.fillRect(X(lo),by-226,X(hi)-X(lo),36);box(bx,by-170+k*30,18,18,['#E6EEF6','#C9DDF0','#9CC2E6','#5E9CD6'][k],C.line,3,1);label(lo.toLocaleString(lang==='de'?'de-CH':lang)+'–'+hi.toLocaleString(lang==='de'?'de-CH':lang)+' mm: '+n,bx+28,by-161+k*30,{a:'left',s:13,c:C.fg,mw:510})});
  [0,5000,15000,30000].forEach(v=>label(v.toLocaleString(lang==='de'?'de-CH':lang),X(v),by-238,{s:12,f:MONO}));wrap(f.hhNote,px+20,by-38,560,{s:13,c:C.muted});
  // RET
  box(px,490,600,320,C.bg,C.line,12);label(f.retT,px+20,520,{a:'left',s:16,c:C.fg,w:600});
  f.ret.forEach(([r,n],k)=>{const yy=570+k*52;box(px+30,yy-18,90,36,['#CFEBD5','#E2F2D6','#F6EBC8','#F8D9C4'][k],null,6);label(r,px+75,yy,{s:15,f:MONO,c:C.fg});label(n,px+140,yy,{a:'left',s:15,c:C.fg})});
  wrap(f.retNote,px+20,768,560,{s:13,c:C.muted});now(ll.n)}

const DRAW=[scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8];

// ── controls / language ───────────────────────────────────────────────────────
function sliderOut(){const s=SL[scene];if(!s)return;const c=CV(),v=SV[scene];let o;
  if(s.k==='add')o=v+' g/m²';else if(s.k==='knife')o=c.kn.m[v].n;else if(s.k==='sub')o=c.tr.subs[v];else if(s.k==='temp')o=v+' °C';
  else if(s.k==='poly')o=c.po.p[v].n;else if(s.k==='mem')o=c.me.m[v].n;else if(s.k==='lam')o=c.la.m[v].n;else o=c.ly.l[v].n;$('sout').textContent=o}
function go(i){scene=(i+NSC)%NSC;sceneT=0;lastNow='';if(EMBED)document.title='scene:'+scene;
  $('scenes').querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-pressed',k===scene));
  const sc=T().scenes[scene];$('ctitle').textContent=`${scene+1} · ${sc.title}`;$('ctext').textContent=sc.text;$('cnow').textContent='';
  $('cfacts').innerHTML=sc.facts.map(f=>`<li><b>${f[0]}</b><span>${f[1]}</span></li>`).join('');
  const s=SL[scene];$('swrap').hidden=!s;if(s){const sl=$('sl');sl.min=s.min;sl.max=s.max;sl.step=s.step||1;sl.value=SV[scene];$('slab').textContent=T().ui.sl[s.k]}
  sliderOut()}
$('sl').oninput=()=>{SV[scene]=+$('sl').value;sliderOut()};
function setPlay(){$('play').textContent=auto?T().ui.pause:T().ui.play}
$('play').onclick=()=>{auto=!auto;setPlay()};
function applyLang(){const u=T().ui;document.documentElement.lang=lang;
  $('eyebrow').textContent=u.eyebrow;$('h1').textContent=u.h1;$('lead').textContent=u.lead;$('note').textContent=u.note;
  cv.setAttribute('aria-label',u.h1);
  $('scenes').innerHTML=T().scenes.map((s,i)=>`<button type="button" data-i="${i}"><span>${i+1}</span>${s.k}</button>`).join('');
  $('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $('langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  drawLinks();setPlay();const keep=sceneT;go(scene);sceneT=keep}
const LINK_KEYS=['chemical_finishing','finishing_machines','textile_pretreatment','nonwovens','man_made_fibres'];
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openModule(key){if(EMBED){document.title='open:'+key;return}location.href=key+'.html?lang='+encodeURIComponent(lang)}
function drawLinks(){const t=T();$('lkL').textContent=t.ui.lkL;
  $('links').innerHTML=t.links.map((l,i)=>`<button type="button" class="lk" data-k="${LINK_KEYS[i]}"><b>${escH(l[0])} →</b><span>${escH(l[1])}</span><em>${escH(t.ui.open)}</em></button>`).join('');
  $('links').querySelectorAll('.lk').forEach(b=>b.onclick=()=>openModule(b.dataset.k))}
window.setLang=l=>{if(TEXTS[l]){lang=l;applyLang()}};
window.goScene=i=>go(i);
[['de','DE'],['en','EN'],['es','ES'],['zh','中文']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.dataset.l=l;b.textContent=n;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(scene+1);if(e.key==='ArrowLeft')go(scene-1);if(e.key===' '){e.preventDefault();auto=!auto;setPlay()}});

let last=performance.now();
function frame(nw){const dt=Math.min(.05,(nw-last)/1000);last=nw;if(auto){t+=dt;sceneT+=dt}fit();
  try{const s=cv.width/W;ctx.setTransform(s,0,0,s,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.setLineDash([]);ctx.lineCap='round';ctx.lineJoin='round';
    DRAW[scene](auto?dt:0);
    label(`${scene+1}/${NSC}`,1540,60,{a:'right',s:22,f:MONO});label(T().scenes[scene].k.toUpperCase(),60,60,{a:'left',s:28,c:C.fg,f:DISP,w:600});
  }catch(err){console.error(err)}
  requestAnimationFrame(frame)}
applyLang();
if(!auto&&params.get('paused')==='1'){sceneT=6.3}
requestAnimationFrame(frame);
})();
